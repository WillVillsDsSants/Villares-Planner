  font-size: 13px; font-weight: 500; color: var(--color-text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
}
.notif-item--unread .notif-item__title { color: var(--color-text-primary); }
.notif-item__sub {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--color-text-quaternary); letter-spacing: 0.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.notif-item__sub--critical { color: #ff6b6b; }
.notif-item__sub--warn     { color: #e0922b; }
.notif-item__dismiss {
  flex-shrink: 0; width: 38px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-quaternary); font-size: 15px; font-family: var(--font-mono);
  opacity: 0; transition: opacity 120ms, color 120ms;
}
.notif-item:hover .notif-item__dismiss { opacity: 1; }
.notif-item__dismiss:hover { color: var(--color-critical); }

/* Badge */
.topbar__btn--bell .notif-badge {
  position: absolute; top: 5px; right: 6px;
  min-width: 16px; height: 16px; padding: 0 4px;
  background: var(--color-critical); color: #fff;
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}



/* ── Toggle de alarme no painel de notificações ── */
.notif-alarm {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 13px 18px;
  background: var(--color-bg-surface-2);
  border: none; border-bottom: 1px solid var(--color-border-subtle);
  cursor: pointer; text-align: left;
  transition: background 140ms;
}
.notif-alarm:hover { background: var(--color-bg-surface-3); }
.notif-alarm__icon { font-size: 14px; opacity: 0.85; }
.notif-alarm__text {
  flex: 1; font-size: 11.5px; color: var(--color-text-tertiary);
  font-family: var(--font-mono); letter-spacing: 0.02em;
}
.notif-alarm--on .notif-alarm__text { color: var(--color-text-primary); }
.notif-alarm__switch {
  position: relative; flex-shrink: 0;
  width: 40px; height: 22px;
  background: var(--color-bg-surface-3); border: 1px solid var(--color-border-default);
  font-size: 0; padding: 0;
  transition: background 200ms ease, border-color 200ms ease;
}
.notif-alarm__switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; background: var(--color-text-tertiary);
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1), background 200ms ease;
}
.notif-alarm--on .notif-alarm__switch { background: var(--color-neutral-strong); border-color: var(--color-neutral-strong); }
.notif-alarm--on .notif-alarm__switch::after { transform: translateX(18px); background: var(--color-bg-base); }

/* ═══════════════════════════════════════════════════════════
   REFINO v2.1 — animações, profundidade e micro-interações
   ═══════════════════════════════════════════════════════════ */

/* Transições globais suaves em elementos interativos */
.kpi, .list-row, .cat-tile, .note, .kanban__card, .timeline__item,
.day-panel__row, .agenda__day, .team-card, .report-panel, .todo__row,
.cal__cell, .tab, .sidebar__item, .toolbar__select, .topbar__btn,
.topbar__cta, .btn, .form-chip, .day-chip, .cal-filter, .cal-mode,
.notif-item, .sync-indicator, .dropdown__item, .date-nav__btn, .date-nav__today {
  transition: background-color 160ms ease, border-color 160ms ease,
              color 160ms ease, transform 160ms cubic-bezier(0.16,1,0.3,1),
              box-shadow 160ms ease, opacity 160ms ease;
}

/* Entrada escalonada da lista (stagger) */
@keyframes rowIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.list-row { animation: rowIn 360ms cubic-bezier(0.16,1,0.3,1) both; }
.list-row:nth-child(1) { animation-delay: 0ms; }
.list-row:nth-child(2) { animation-delay: 28ms; }
.list-row:nth-child(3) { animation-delay: 56ms; }
.list-row:nth-child(4) { animation-delay: 84ms; }
.list-row:nth-child(5) { animation-delay: 112ms; }
.list-row:nth-child(6) { animation-delay: 140ms; }
.list-row:nth-child(7) { animation-delay: 168ms; }
.list-row:nth-child(8) { animation-delay: 196ms; }
.list-row:nth-child(n+9) { animation-delay: 220ms; }

/* KPI: leve elevação no hover + brilho sutil */
.kpi { position: relative; overflow: hidden; transition: transform 280ms cubic-bezier(0.16,1,0.3,1), box-shadow 280ms ease; }
.kpi::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,0.05), transparent 60%);
  opacity: 0; transition: opacity 280ms ease; pointer-events: none;
}
.kpi:hover::after { opacity: 1; }
.kpi:hover { transform: translateY(-3px); box-shadow: 0 16px 40px -20px rgba(0,0,0,0.7); }

/* KPI value — animação de contagem visual (pulse on mount) */
@keyframes kpiPop {
  0% { opacity: 0; transform: translateY(8px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.kpi__value { animation: kpiPop 480ms cubic-bezier(0.16,1,0.3,1) both; }

/* Linhas da lista: barra de acento na origem ao passar o mouse */
.list-row { position: relative; }
.list-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--color-neutral-strong);
  transform: scaleY(0); transform-origin: center;
  transition: transform 180ms cubic-bezier(0.16,1,0.3,1);
}
.list-row:hover::before { transform: scaleY(1); }

/* Cards do Kanban: profundidade ao arrastar e hover */
.kanban__card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.32); }
.kanban__col { transition: background-color 180ms ease, border-color 180ms ease; }
.kanban__col--over { box-shadow: inset 0 0 0 1px var(--color-neutral-strong); }

/* Sidebar: indicador ativo deslizante */
.sidebar__item { position: relative; }
.sidebar__item::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
  width: 2px; height: 22px; background: var(--color-neutral-strong);
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar__item--active::before { transform: translateY(-50%) scaleY(1); }
.sidebar__item:hover { color: var(--color-text-primary); }
.sidebar__item:hover svg { transform: scale(1.08); }
.sidebar__item svg { transition: transform 180ms cubic-bezier(0.16,1,0.3,1); }

/* Tabs: sublinhado animado */
.tab { position: relative; }
.tab::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--color-text-primary); transform: scaleX(0); transform-origin: center;
  transition: transform 220ms cubic-bezier(0.16,1,0.3,1);
}
.tab--active::after { transform: scaleX(1); }

/* Botão primário: brilho ao hover */
.topbar__cta, .btn--primary { position: relative; overflow: hidden; }
.topbar__cta::after, .btn--primary::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(110deg, transparent, rgba(255,255,255,0.35), transparent);
  transition: left 520ms cubic-bezier(0.16,1,0.3,1);
}
.topbar__cta:hover::after, .btn--primary:hover::after { left: 140%; }
.topbar__cta:active, .btn--primary:active { transform: scale(0.97); }

/* Tiles de categoria: barra preenche com easing ao montar */
.cat-tile__bar-fill { transition: width 640ms cubic-bezier(0.16,1,0.3,1); }
.report-row__fill { transition: width 640ms cubic-bezier(0.16,1,0.3,1); }

/* Notas e cards: leve lift */
.note:hover, .team-card:hover, .report-panel:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.24); }

/* Dropdown menus: entrada suave */
@keyframes menuIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.dropdown__menu { animation: menuIn 150ms cubic-bezier(0.16,1,0.3,1) both; transform-origin: top right; }

/* Modal: backdrop blur + entrada do card */
.modal-backdrop {
  backdrop-filter: blur(3px);
  animation: fadeIn 180ms ease both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal { animation: modalIn 260ms cubic-bezier(0.16,1,0.3,1) both; }

/* Inputs/selects: foco com glow sutil */
.form-input:focus, .form-select:focus, .form-textarea:focus,
.todo__input:focus, .topbar__search input:focus {
  box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
}
.topbar__search { transition: box-shadow 180ms ease; }
.topbar__search:focus-within { box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }

/* Checkbox do to-do: pop ao marcar */
@keyframes checkPop { 0%{transform:scale(0.7)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
.todo__check--on, .day-agenda__check--on { animation: checkPop 240ms cubic-bezier(0.16,1,0.3,1); }

/* Badge do sino: pulso quando há não-lidas */
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(220, 34, 34,0.5); }
  50%     { box-shadow: 0 0 0 4px rgba(220, 34, 34,0); }
}
.topbar__btn--bell .notif-badge { animation: badgePulse 2.4s ease-in-out infinite; }

/* Scrollbar global discreta */
::selection { background: rgba(255,255,255,0.16); color: #fff; }
html.light ::selection { background: rgba(0,0,0,0.12); color: #000; }
/* Foco de teclado elegante (acessibilidade sem poluir o mouse) */
:focus-visible { outline: 1px solid var(--color-border-strong); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); background-clip: padding-box; }

/* Título do header com leve gradiente de texto */
.page__header-title {
  background: linear-gradient(180deg, var(--color-text-primary), rgba(255,255,255,0.7));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
html.light .page__header-title {
  background: linear-gradient(180deg, #0e0e10, #3f3f48);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

/* Respeitar quem prefere menos movimento */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-fill-mode: none !important;
    transition-duration: 0.01ms !important;
  }
  /* Garante que elementos animados terminem VISÍVEIS, nunca presos no estado inicial */
  .view-stage, .view-stage > *, .kpi, .tabs .tab, .onb, .onb__left-body,
  .tpick, .tpick__card, .sidebar, .topbar, .app, .list-row {
    opacity: 1 !important; filter: none !important; transform: none !important;
  }
}

/* ════ TO-DO BOARD v2 ════ */
.todo2 { margin-top: 18px; max-width: 920px; }
.todo2__progress {
  display: flex; align-items: center; gap: 18px;
  margin-bottom: 20px;
}
.todo2__progress-info { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
.todo2__progress-pct {
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  letter-spacing: -0.01em; color: var(--color-text-primary);
}
.todo2__progress-label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); }
.todo2__progress-bar {
  flex: 1; height: 6px; background: var(--color-bg-surface-3); overflow: hidden;
}
.todo2__progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #22C55E, #4ade80);
  transition: width 640ms cubic-bezier(0.16,1,0.3,1);
}

.todo2__add {
  display: flex; align-items: center; gap: 0;
  border: 1px solid var(--color-border-default);
  background: var(--color-bg-surface-1);
  margin-bottom: 22px;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.todo2__add:focus-within { border-color: var(--color-border-strong); box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
.todo2__add-icon {
  font-size: 20px; color: var(--color-text-quaternary);
  width: 48px; text-align: center; flex-shrink: 0; font-weight: 300;
}
.todo2__input {
  flex: 1; height: 50px; background: transparent; border: none; outline: none;
  color: var(--color-text-primary); font-size: 15px; font-family: var(--font-sans);
}
.todo2__input::placeholder { color: var(--color-text-quaternary); }
.todo2__add-btn {
  height: 50px; padding: 0 22px; flex-shrink: 0;
  background: var(--color-neutral-strong); color: var(--color-bg-base);
  border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
  transition: opacity 140ms ease;
}
.todo2__add-btn:hover:not(:disabled) { opacity: 0.88; }
.todo2__add-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.todo2__cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .todo2__cols { grid-template-columns: 1fr; } }
.todo2 { max-width: 1100px; }
.todo2__col-dot--prog { background: #f59e0b; }
.todo2__col-head--prog { color: var(--color-text-secondary); }
.todo2__card--prog { border-left-color: #f59e0b; }
.todo2__check--prog { border-color: #f59e0b; color: #f59e0b; font-size: 11px; }
.todo2__check--prog:hover { background: rgba(245,158,11,0.12); }
.todo2__move {
  width: 24px; height: 24px; flex-shrink: 0;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-quaternary); font-size: 14px; font-family: var(--font-mono);
  opacity: 0; transition: opacity 120ms, color 120ms;
}
.todo2__card:hover .todo2__move { opacity: 1; }
.todo2__move:hover { color: var(--color-text-primary); }
.todo2__col {
  background: var(--color-bg-surface-1);
  border: 1px solid var(--color-border-subtle);
  min-height: 200px;
}
.todo2__col-head {
  display: flex; align-items: center; gap: 9px;
  padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--color-text-secondary);
}
.todo2__col-dot { width: 7px; height: 7px; background: var(--color-neutral-mid); }
.todo2__col-dot--done { background: #22C55E; }
.todo2__col-count {
  font-family: var(--font-mono); font-size: 11px; color: var(--color-text-quaternary);
  background: var(--color-bg-surface-3); padding: 1px 8px;
}
.todo2__col-head--done { color: var(--color-text-tertiary); }
.todo2__clear {
  margin-left: auto; background: transparent; border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--color-text-quaternary);
}
.todo2__clear:hover { color: var(--color-critical); }
.todo2__list { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.todo2__col-empty {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-quaternary);
  text-align: center; padding: 26px 8px;
}
@keyframes todoCardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.todo2__card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px;
  background: var(--color-bg-surface-2);
  border: 1px solid var(--color-border-subtle);
  border-left: 2px solid var(--color-neutral-mid);
  animation: todoCardIn 240ms cubic-bezier(0.16,1,0.3,1) both;
  transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}
.todo2__card:hover { border-color: var(--color-border-strong); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
.todo2__card--done { border-left-color: #22C55E; opacity: 0.6; }
.todo2__card--done .todo2__text { text-decoration: line-through; color: var(--color-text-tertiary); }
.todo2__check {
  width: 20px; height: 20px; flex-shrink: 0;
  background: transparent; border: 1.5px solid var(--color-border-strong); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--color-bg-base);
  transition: all 140ms ease;
}
.todo2__check:hover { border-color: #22C55E; }
.todo2__check--on { background: #22C55E; border-color: #22C55E; }
@keyframes checkPop2 { 0%{transform:scale(0.6)} 55%{transform:scale(1.2)} 100%{transform:scale(1)} }
.todo2__check--on { animation: checkPop2 260ms cubic-bezier(0.16,1,0.3,1); }
.todo2__text { flex: 1; font-size: 14px; color: var(--color-text-primary); line-height: 1.4; }
.todo2__del {
  width: 24px; height: 24px; flex-shrink: 0;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-quaternary); font-size: 17px; font-family: var(--font-mono);
  opacity: 0; transition: opacity 120ms, color 120ms;
}
.todo2__card:hover .todo2__del { opacity: 1; }
.todo2__del:hover { color: var(--color-critical); }
.todo2__empty {
  text-align: center; padding: 56px 24px;
  border: 1px dashed var(--color-border-default);
}
.todo2__empty-mark {
  width: 48px; height: 48px; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #22C55E; color: #22C55E; font-size: 22px;
}
.todo2__empty-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.todo2__empty-sub { font-size: 13px; color: var(--color-text-tertiary); max-width: 400px; margin: 0 auto; line-height: 1.6; }

/* ── Toggle de configuração (switch) ── */
.settings-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 16px; margin-bottom: 16px;
  background: var(--color-bg-surface-2);
  border: 1px solid var(--color-border-subtle);
}
.settings-toggle__title { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
.settings-toggle__sub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
.settings-switch {
  width: 44px; height: 24px; flex-shrink: 0;
  background: var(--color-bg-surface-3); border: 1px solid var(--color-border-default);
  cursor: pointer; position: relative; padding: 0;
  transition: background 200ms ease, border-color 200ms ease;
}
.settings-switch--on { background: #22C55E; border-color: #22C55E; }
.settings-switch__knob {
  position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; background: #fff;
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1);
}
.settings-switch--on .settings-switch__knob { transform: translateX(20px); }



/* ── Barra de resumo do dia (segmentada) ── */
.statusbar {
  margin-top: 18px;
  border: 1px solid var(--color-border-subtle);
  background: linear-gradient(180deg, var(--color-bg-surface-1), rgba(255,255,255,0.012));
  padding: 18px 20px 16px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px -16px rgba(0,0,0,0.6);
}
.statusbar__top {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 13px;
}
.statusbar__heading {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--color-text-quaternary);
}
.statusbar__total {
  font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary);
}
.statusbar__total b { color: var(--color-text-primary); font-weight: 600; }
.statusbar__track {
  display: flex; height: 7px; gap: 2px;
  padding: 2px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--color-border-subtle);
  border-radius: 1px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3) inset;
}
.statusbar__seg {
  transition: flex-grow 600ms cubic-bezier(0.16,1,0.3,1);
  min-width: 8px; position: relative; border-radius: 1px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.25);
}
/* Brilho sutil no topo de cada segmento, como os botões/cards do site */
.statusbar__seg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 60%);
  border-radius: 1px;
}
.statusbar__seg--pend  { background: var(--color-neutral-mid); }
.statusbar__seg--prog  { background: #c98a2b; }
.statusbar__seg--feito { background: var(--color-neutral-strong); }
.statusbar__seg--falha { background: var(--color-critical); }
.statusbar__legend {
  display: flex; align-items: center; gap: 0; flex-wrap: wrap;
  margin-top: 15px;
}
.statusbar__item {
  display: flex; align-items: center; gap: 9px;
  padding-right: 20px; margin-right: 20px;
  border-right: 1px solid var(--color-border-subtle);
}
.statusbar__item:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.statusbar__num {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  color: var(--color-text-primary); letter-spacing: -0.01em; line-height: 1;
}
.statusbar__meta { display: flex; flex-direction: column; gap: 2px; }
.statusbar__label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--color-text-quaternary); line-height: 1;
}
.statusbar__dot {
  width: 6px; height: 6px; flex-shrink: 0;
  box-shadow: 0 0 8px -1px currentColor;
}
.statusbar__dot--pend  { background: var(--color-neutral-mid); color: var(--color-neutral-mid); }
.statusbar__dot--prog  { background: #c98a2b; color: #c98a2b; }
.statusbar__dot--feito { background: var(--color-neutral-strong); color: var(--color-neutral-strong); }
.statusbar__dot--falha { background: var(--color-critical); color: var(--color-critical); }

/* ── Popup de ação rápida (vindo da notificação do navegador) ── */
.qa-backdrop {
  position: fixed; inset: 0; z-index: 1200;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(0,0,0,0.55), rgba(0,0,0,0.72));
  backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 220ms ease both;
}
.qa-popup {
  width: 420px; max-width: calc(100vw - 32px);
  background: linear-gradient(180deg, var(--color-bg-surface-2), var(--color-bg-surface-1) 40%);
  border: 1px solid var(--color-border-default);
  box-shadow: 0 40px 100px -28px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.02), inset 0 1px 0 rgba(255,255,255,0.05);
  padding: 30px 30px 24px;
  animation: qaPopIn 360ms cubic-bezier(0.16,1,0.3,1) both;
  position: relative; overflow: hidden;
}
/* fio de acento no topo, fininho e elegante (não bloco bruto) */
.qa-popup::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-critical), transparent);
  opacity: 0.7;
}
@keyframes qaPopIn { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
.qa-popup__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.qa-popup__kicker {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--color-text-tertiary);
}
.qa-popup__kicker::before {
  content: ''; width: 6px; height: 6px; background: var(--color-critical);
  box-shadow: 0 0 8px var(--color-critical); animation: qaPulse 1.8s ease-in-out infinite;
}
@keyframes qaPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.qa-popup__close {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent; cursor: pointer; color: var(--color-text-quaternary);
  transition: color 160ms, border-color 160ms, background 160ms;
}
.qa-popup__close:hover { color: var(--color-text-primary); background: var(--color-bg-surface-2); border-color: var(--color-border-subtle); }
.qa-popup__title {
  font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--color-text-primary); line-height: 1.25; margin-bottom: 8px;
}
.qa-popup__desc { font-size: 13.5px; color: var(--color-text-tertiary); line-height: 1.55; margin-bottom: 22px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qa-popup__label {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 11px;
}
.qa-popup__actions { display: flex; flex-direction: column; gap: 9px; }
.qa-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px 14px 17px; width: 100%; text-align: left;
  background: rgba(255,255,255,0.018); border: 1px solid var(--color-border-subtle);
  color: var(--color-text-secondary); cursor: pointer;
  font-family: var(--font-sans); font-size: 14px; font-weight: 500;
  position: relative; overflow: hidden;
  transition: background 200ms, border-color 200ms, color 200ms, transform 240ms cubic-bezier(0.16,1,0.3,1), padding-left 200ms;
}
/* faixa de acento à esquerda */
.qa-btn::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--color-text-quaternary); transform: scaleY(0); transform-origin: center;
  transition: transform 240ms cubic-bezier(0.16,1,0.3,1), background 200ms;
}
.qa-btn svg { flex-shrink: 0; opacity: 0.55; transition: opacity 200ms, color 200ms; }
.qa-btn:hover { background: rgba(255,255,255,0.04); color: var(--color-text-primary); transform: translateY(-1px); padding-left: 21px; }
.qa-btn:hover::before { transform: scaleY(1); }
.qa-btn:hover svg { opacity: 1; }
.qa-btn:active { transform: translateY(0) scale(0.995); }
.qa-btn--done:hover { border-color: rgba(255,255,255,0.22); }
.qa-btn--done:hover::before { background: var(--color-text-primary); }
.qa-btn--done:hover svg { color: var(--color-text-primary); }
.qa-btn--prog:hover { border-color: rgba(201,138,43,0.5); }
.qa-btn--prog:hover::before { background: #d99a3b; }
.qa-btn--prog:hover svg { color: #d99a3b; }
.qa-btn--fail:hover { border-color: rgba(220, 34, 34,0.5); }
.qa-btn--fail:hover::before { background: var(--color-critical); }
.qa-btn--fail:hover svg { color: var(--color-critical); }
.qa-popup__open {
  margin-top: 16px; width: 100%;
  background: transparent; border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--color-text-quaternary); padding: 8px;
  transition: color 160ms;
}
.qa-popup__open:hover { color: var(--color-text-secondary); }

/* ═══════════════════════════════════════════════════════════
   v3.0 — transições de view, mobile drawer, workspaces, foco
   ═══════════════════════════════════════════════════════════ */

/* ── Transição ao trocar de view (key=view remonta) ── */
@keyframes viewIn {
  from { opacity: 0; transform: translateY(12px) scale(0.995); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.view-stage { animation: viewIn 380ms cubic-bezier(0.16,1,0.3,1) both; }
@keyframes appBootIn { from { opacity: 0; } to { opacity: 1; } }
.app { animation: appBootIn 600ms ease both; }
.sidebar { animation: sidebarIn 600ms cubic-bezier(0.16,1,0.3,1) both; }
@keyframes sidebarIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.topbar { animation: topbarIn 560ms cubic-bezier(0.16,1,0.3,1) both; }
@keyframes topbarIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
/* Filhos diretos da view entram em cascata (efeito premium de "montagem") */
@keyframes viewChildIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.view-stage > * { animation: viewChildIn 480ms cubic-bezier(0.16,1,0.3,1) both; }
.view-stage > *:nth-child(1) { animation-delay: 40ms; }
.view-stage > *:nth-child(2) { animation-delay: 100ms; }
.view-stage > *:nth-child(3) { animation-delay: 160ms; }
.view-stage > *:nth-child(4) { animation-delay: 220ms; }
.view-stage > *:nth-child(n+5) { animation-delay: 280ms; }

/* Transição ao trocar de WORKSPACE — o app inteiro pisca suavemente */
@keyframes wsSwap {
  0%   { opacity: 1; }
  35%  { opacity: 0.55; transform: scale(0.997); }
  100% { opacity: 1; transform: scale(1); }
}
.main--ws-swap { animation: wsSwap 460ms cubic-bezier(0.16,1,0.3,1); }

/* Hamburger — só no mobile */
.topbar__burger {
  display: none;
  width: 34px; height: 34px; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--color-border-subtle);
  color: var(--color-text-secondary); cursor: pointer; flex-shrink: 0;
  transition: color 140ms, border-color 140ms;
}
.topbar__burger:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); }

/* ── Workspace switcher (topbar) ── */
.ws-switch { position: relative; flex-shrink: 0; }
.ws-switch__btn {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 12px;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-default);
  color: var(--color-text-secondary); cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  transition: border-color 140ms, color 140ms;
}
.ws-switch__btn:hover { border-color: var(--color-border-strong); color: var(--color-text-primary); }
.ws-switch__dot { width: 7px; height: 7px; background: var(--color-neutral-strong); flex-shrink: 0; }
.ws-switch__label { white-space: nowrap; }
.ws-switch__menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 100;
  width: 220px;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-default);
  box-shadow: 0 16px 44px -12px rgba(0,0,0,0.7);
  animation: menuIn 160ms cubic-bezier(0.16,1,0.3,1) both;
}
.ws-switch__item {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  padding: 11px 14px; text-align: left;
  background: transparent; border: none; border-bottom: 1px solid var(--color-border-subtle);
  cursor: pointer; transition: background 120ms;
}
.ws-switch__item:last-child { border-bottom: none; }
.ws-switch__item:hover { background: var(--color-bg-surface-2); }
.ws-switch__item--active { background: var(--color-bg-surface-2); }
.ws-switch__item--active .ws-switch__item-name { color: var(--color-text-primary); }
.ws-switch__item-name { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
.ws-switch__item-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--color-text-quaternary); letter-spacing: 0.04em; }

/* ── Mobile drawer ── */
.drawer-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.6);
  opacity: 0; pointer-events: none; transition: opacity 240ms ease;
  backdrop-filter: none;
}
.drawer-backdrop--open { opacity: 1; pointer-events: auto; backdrop-filter: blur(2px); }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 101;
  width: 280px; max-width: 84vw;
  background: var(--color-bg-sidebar);
  border-right: 1px solid var(--color-border-default);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 300ms cubic-bezier(0.16,1,0.3,1);
}
.drawer--open { transform: translateX(0); }
.drawer__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 18px 16px; border-bottom: 1px solid var(--color-border-subtle);
}
.drawer__brand { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.drawer__brand-sep { color: var(--color-critical); }
.drawer__close { background: transparent; border: none; color: var(--color-text-tertiary); cursor: pointer; }
.drawer__ws { padding: 16px 14px; border-bottom: 1px solid var(--color-border-subtle); }
.drawer__ws-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 10px; padding: 0 4px; }
.drawer__ws-btn {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  padding: 10px 12px; margin-bottom: 4px; text-align: left;
  background: transparent; border: 1px solid transparent; cursor: pointer;
  transition: background 120ms, border-color 120ms;
}
.drawer__ws-btn:hover { background: var(--color-bg-surface-2); }
.drawer__ws-btn--active { background: var(--color-bg-surface-2); border-color: var(--color-border-default); }
.drawer__ws-name { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
.drawer__ws-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--color-text-quaternary); }
.drawer__nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.drawer__item {
  display: flex; align-items: center; gap: 13px;
  padding: 12px 14px; width: 100%; text-align: left;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-tertiary); font-family: var(--font-sans); font-size: 14px;
  transition: background 120ms, color 120ms;
}
.drawer__item:hover { background: var(--color-bg-surface-2); color: var(--color-text-primary); }
.drawer__item--active { background: var(--color-bg-surface-2); color: var(--color-text-primary); box-shadow: inset 2px 0 0 var(--color-neutral-strong); }
.drawer__footer { padding: 12px 10px; border-top: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; gap: 2px; }

/* ── Week view ── */
.week { max-width: 1180px; margin: 20px auto 0; min-width: 0; }
.view-stage { min-width: 0; max-width: 100%; overflow-x: hidden; }
.page { overflow-x: hidden; }
.week__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.week__kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 6px; }
.week__heading { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.week__summary { display: flex; align-items: baseline; gap: 10px; }
.week__summary-pct { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--color-text-primary); }
.week__summary-label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); }

/* Gráfico de carga */
.week__chart {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
  padding: 18px; margin-bottom: 18px;
  border: 1px solid var(--color-border-subtle); background: var(--color-bg-surface-1);
}
.week__bar-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  background: transparent; border: none; cursor: pointer; padding: 6px 0;
  transition: background 140ms;
}
.week__bar-wrap--sel { background: var(--color-bg-surface-2); }
.week__bar-track { width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.week__bar {
  width: 60%; max-width: 38px; background: var(--color-bg-surface-3); position: relative;
  display: flex; align-items: flex-end; transition: height 520ms cubic-bezier(0.16,1,0.3,1);
}
.week__bar-done { width: 100%; background: var(--color-neutral-strong); transition: height 520ms cubic-bezier(0.16,1,0.3,1); }
.week__bar-day { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--color-text-quaternary); }
.week__bar-day--today { color: var(--color-text-primary); font-weight: 700; }
.week__bar-num { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); min-height: 14px; }

/* Grade de colunas */
.week__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--color-border-subtle); border: 1px solid var(--color-border-subtle); }
.week__col { background: var(--color-bg-base); display: flex; flex-direction: column; min-height: 220px; min-width: 0; overflow: hidden; }
.week__col--today { background: var(--color-bg-surface-1); }
.week__col--sel { box-shadow: inset 0 2px 0 var(--color-neutral-strong); }
.week__col-head {
  display: flex; align-items: center; gap: 6px; padding: 10px 11px;
  background: transparent; border: none; border-bottom: 1px solid var(--color-border-subtle);
  cursor: pointer; width: 100%; transition: background 120ms;
}
.week__col-head:hover { background: var(--color-bg-surface-2); }
.week__col-name { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; color: var(--color-text-quaternary); }
.week__col-date { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
.week__col--today .week__col-date { color: var(--color-text-primary); }
.week__col-ratio { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--color-text-tertiary); background: var(--color-bg-surface-3); padding: 1px 6px; }
.week__col-body { flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.week__col-empty { text-align: center; color: var(--color-text-quaternary); font-size: 16px; padding: 16px 0; opacity: 0.4; }
.week__task {
  display: flex; align-items: center; gap: 6px; padding: 6px 7px; cursor: pointer;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-subtle);
  border-left: 2px solid var(--color-neutral-mid);
  transition: background 120ms, transform 120ms;
}
.week__task:hover { background: var(--color-bg-surface-2); transform: translateX(1px); }
.week__task--done { opacity: 0.5; border-left-color: var(--color-neutral-strong); }
.week__task--done .week__task-title { text-decoration: line-through; }
.week__task-check {
  width: 15px; height: 15px; flex-shrink: 0; padding: 0;
  background: transparent; border: 1px solid var(--color-border-strong); cursor: pointer;
  font-size: 9px; color: var(--color-neutral-strong); display: flex; align-items: center; justify-content: center;
}
.week__task-check:hover { border-color: var(--color-neutral-strong); }
.week__task-hora { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-tertiary); flex-shrink: 0; }
.week__task { min-width: 0; }
.week__task-title { font-size: 11px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; min-width: 0; flex: 1; }
.week__col-more { font-family: var(--font-mono); font-size: 9.5px; color: var(--color-text-tertiary); text-align: center; padding: 6px 4px; cursor: pointer; width: 100%; background: transparent; border: none; border-top: 1px solid var(--color-border-subtle); margin-top: 2px; transition: color 120ms, background 120ms; }
.week__col-more:hover { color: var(--color-text-primary); background: var(--color-bg-surface-2); }

/* Mobile: semana vira scroll horizontal */
@media (max-width: 860px) {
  .week__grid {
    grid-template-columns: repeat(7, minmax(128px, 1fr));
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }
  .week__chart {
    grid-template-columns: repeat(7, minmax(34px, 1fr));
    overflow-x: auto; max-width: 100%;
  }
}

/* ── Mobile: ativa hamburger, esconde sidebar, ajusta tudo ── */
@media (max-width: 860px) {
  .sidebar { display: none; }
  .app > .main { margin-left: 0; }
  .topbar__burger { display: flex; }
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar__title { display: none; }
  .ws-switch__label { display: none; }
  .ws-switch__btn { padding: 0 9px; }
  .topbar__date .date-nav__today { display: none; }
  .topbar__updated { display: none; }
  .page { padding: 18px 14px; }
  .focus__heading { font-size: 23px; }
  .focus__now-title { font-size: 20px; }
  .todo2__cols { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .topbar__search { display: none; }
  .topbar__date { display: none; }
  .sync-indicator { display: none; }
  .topbar__sep { display: none; }
  .topbar__actions { gap: 6px; margin-left: auto; }
  .topbar__cta { padding: 0 12px; }
  .topbar__cta span { display: none; }
}
@media (max-width: 560px) {
  .ws-switch { display: none; }
}

/* ════ ONBOARDING — experiência de boas-vindas em tela cheia ════ */
.onb {
  position: fixed; inset: 0; z-index: 2000;
  display: grid; grid-template-columns: 0.9fr 1.1fr;
  background: var(--color-bg-base);
  animation: onbFadeIn 480ms ease both;
}
@keyframes onbFadeIn { from { opacity: 0; } to { opacity: 1; } }
.onb--leaving { animation: onbFadeOut 420ms ease both; }
@keyframes onbFadeOut { from { opacity: 1; } to { opacity: 0; transform: scale(1.01); } }

/* ── Painel esquerdo ── */
.onb__left {
  position: relative;
  display: flex; flex-direction: column;
  padding: 64px 72px;
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,0.03), transparent 55%),
    var(--color-bg-base);
  border-right: 1px solid var(--color-border-subtle);
}
.onb__brand {
  display: flex; align-items: center; gap: 11px;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em;
  color: var(--color-text-primary);
}
.onb__brand-mark {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  background: #fff; color: #050505;
}
.onb__brand-sep { color: var(--color-critical); }

.onb__left-body {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  min-height: 0;
  animation: onbBodyIn 560ms cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes onbBodyIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.onb__index {
  display: flex; align-items: baseline; gap: 6px; margin-bottom: 22px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.onb__index-num { font-size: 15px; color: var(--color-text-primary); font-weight: 600; }
.onb__index-sep { font-size: 13px; color: var(--color-text-quaternary); }
.onb__index-total { font-size: 13px; color: var(--color-text-quaternary); }
.onb__tag {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--color-critical); margin-bottom: 16px;
}
.onb__title {
  font-family: var(--font-display); font-size: 42px; font-weight: 700;
  letter-spacing: -0.02em; line-height: 1.08; margin: 0 0 20px;
  background: linear-gradient(180deg, var(--color-text-primary), rgba(255,255,255,0.62));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
html.light .onb__title { background: linear-gradient(180deg, #0e0e10, #44444c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.onb__text { font-size: 16px; line-height: 1.7; color: var(--color-text-tertiary); margin: 0; max-width: 480px; }

.onb__footer { margin-top: 36px; width: 100%; }
.onb__nav {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  width: 100%;
}
.onb__dots { display: flex; gap: 8px; }
.onb__dot {
  width: 8px; height: 8px; padding: 0; cursor: pointer;
  background: var(--color-bg-surface-3); border: 1px solid var(--color-border-default);
  transition: all 240ms cubic-bezier(0.16,1,0.3,1);
}
.onb__dot--done { background: var(--color-text-quaternary); border-color: var(--color-text-quaternary); }
.onb__dot--active { width: 28px; background: var(--color-critical); border-color: var(--color-critical); }
.onb__actions { display: flex; gap: 10px; }
.onb__btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 22px; cursor: pointer;
  font-family: var(--font-sans); font-size: 14px; font-weight: 500;
  border: 1px solid var(--color-border-default);
  transition: all 200ms cubic-bezier(0.16,1,0.3,1);
}
.onb__btn--ghost { background: transparent; color: var(--color-text-tertiary); }
.onb__btn--ghost:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); }
.onb__btn--primary { background: var(--color-text-primary); color: var(--color-bg-base); border-color: var(--color-text-primary); }
.onb__btn--primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px -8px rgba(0,0,0,0.5); }
.onb__btn-arrow { transition: transform 200ms ease; }
.onb__btn--primary:hover .onb__btn-arrow { transform: translateX(3px); }

.onb__skip {
  display: inline-block; margin-top: 22px;
  background: transparent; border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--color-text-quaternary); padding: 4px 0; transition: color 160ms;
}
.onb__skip:hover { color: var(--color-text-secondary); }

/* ── Painel direito (visual) ── */
.onb__right {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(140% 100% at 100% 0%, rgba(220, 34, 34,0.06), transparent 55%),
    var(--color-bg-sidebar);
}
.onb__stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.onb__grid-bg {
  position: absolute; inset: 0; opacity: 0.5;
  background-image:
    linear-gradient(var(--color-border-subtle) 1px, transparent 1px),
    linear-gradient(90deg, var(--color-border-subtle) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, black, transparent 72%);
  -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, black, transparent 72%);
}
.onb__rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.onb__ring {
  position: absolute; border: 1px solid var(--color-border-subtle); border-radius: 50%;
}
.onb__ring--1 { width: 200px; height: 200px; animation: onbPulse 4s ease-in-out infinite; }
.onb__ring--2 { width: 320px; height: 320px; animation: onbPulse 4s ease-in-out infinite 0.4s; opacity: 0.7; }
.onb__ring--3 { width: 460px; height: 460px; animation: onbPulse 4s ease-in-out infinite 0.8s; opacity: 0.4; }
@keyframes onbPulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.05); opacity: 0.9; } }

.onb__icon-wrap {
  position: relative; z-index: 2;
  animation: onbIconIn 640ms cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes onbIconIn { from { opacity: 0; transform: scale(0.5) rotate(-10deg); } to { opacity: 1; transform: none; } }
.onb__icon {
  position: relative; z-index: 2;
  width: 108px; height: 108px;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-default);
  color: var(--color-text-primary);
  box-shadow: 0 24px 64px -16px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.07);
}
.onb__icon-glow {
  position: absolute; inset: -30px; z-index: 1;
  background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 65%);
  animation: onbGlow 4s ease-in-out infinite;
}
@keyframes onbGlow { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

.onb__progress { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--color-bg-surface-3); z-index: 3; }
.onb__progress-fill { height: 100%; background: linear-gradient(90deg, var(--color-critical), #ff6b6b); transition: width 520ms cubic-bezier(0.16,1,0.3,1); }

/* ── Mobile: empilha, visual vira topo compacto ── */
@media (max-width: 820px) {
  .onb { grid-template-columns: 1fr; grid-template-rows: 200px 1fr; }
  .onb__right { order: -1; border-bottom: 1px solid var(--color-border-subtle); }
  .onb__ring--3 { display: none; }
  .onb__ring--2 { width: 220px; height: 220px; }
  .onb__icon { width: 76px; height: 76px; }
  .onb__icon svg { width: 32px; height: 32px; }
  .onb__left { padding: 28px 24px 32px; }
  .onb__brand { display: none; }
  .onb__title { font-size: 30px; }
  .onb__text { font-size: 14.5px; }
  .onb__footer { margin-top: 24px; }
  .onb__nav { flex-direction: column; align-items: stretch; gap: 16px; }
  .onb__actions { justify-content: flex-end; }
  .onb__skip { margin-top: 16px; }
}

.settings-replay {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--color-text-secondary); background: var(--color-bg-surface-3);
  border: 1px solid var(--color-border-default); padding: 8px 14px; cursor: pointer; flex-shrink: 0;
  transition: color 140ms, border-color 140ms;
}
.settings-replay:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); }

.settings-toggle--col { flex-direction: column; align-items: stretch; gap: 12px; }
.settings-daystart {
  width: 100%; height: 38px; padding: 0 12px;
  background: var(--color-bg-surface-3); border: 1px solid var(--color-border-default);
  color: var(--color-text-primary); font-family: var(--font-mono); font-size: 12px;
  cursor: pointer; border-radius: 0;
}
.settings-daystart:focus { outline: none; border-color: var(--color-border-strong); box-shadow: 0 0 0 3px rgba(255,255,255,0.06); }

/* ════ TYPE PICKER — escolha do tipo de planner ════ */
.tpick {
  position: fixed; inset: 0; z-index: 1990;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
  background: radial-gradient(ellipse 90% 70% at 50% 0%, rgba(220, 34, 34,0.05), transparent 55%), var(--color-bg-base);
  animation: onbFadeIn 460ms ease both;
}
.tpick__inner { width: 100%; max-width: 940px; }
.tpick__head { text-align: center; margin-bottom: 40px; animation: onbBodyIn 520ms cubic-bezier(0.16,1,0.3,1) both; }
.tpick__kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-critical); margin-bottom: 14px; }
.tpick__title {
  font-family: var(--font-display); font-size: 38px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 14px;
  background: linear-gradient(180deg, var(--color-text-primary), rgba(255,255,255,0.6));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
html.light .tpick__title { background: linear-gradient(180deg,#0e0e10,#44444c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.tpick__sub { font-size: 15px; line-height: 1.6; color: var(--color-text-tertiary); max-width: 560px; margin: 0 auto; }

.tpick__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
.tpick__card {
  position: relative; text-align: left; cursor: pointer;
  padding: 26px 22px;
  background: var(--color-bg-surface-1);
  border: 1px solid var(--color-border-default);
  transition: transform 320ms cubic-bezier(0.16,1,0.3,1), border-color 240ms ease, box-shadow 320ms ease, background 240ms ease;
  animation: tpickCardIn 620ms cubic-bezier(0.16,1,0.3,1) both;
  overflow: hidden;
}
.tpick__card:hover { background: var(--color-bg-surface-2); }
.tpick__card--sel { background: var(--color-bg-surface-2); }
@keyframes tpickCardIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.tpick__card::before {
  content: ''; position: absolute; left: 0; top: 0; right: 0; height: 2px;
  background: var(--color-critical); transform: scaleX(0); transform-origin: left;
  transition: transform 320ms cubic-bezier(0.16,1,0.3,1);
}
.tpick__card:hover { transform: translateY(-4px); border-color: var(--color-border-strong); box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7); }
.tpick__card--sel { border-color: var(--color-critical); }
.tpick__card--sel::before { transform: scaleX(1); }
.tpick__card-icon {
  width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-surface-2); border: 1px solid var(--color-border-default);
  color: var(--color-text-primary); margin-bottom: 18px;
  transition: background 220ms, color 220ms;
}
.tpick__card--sel .tpick__card-icon { background: var(--color-critical); color: #fff; border-color: var(--color-critical); }
.tpick__card-kicker { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-critical); margin-bottom: 8px; }
.tpick__card-name { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-bottom: 8px; color: var(--color-text-primary); letter-spacing: -0.01em; }
.tpick__card:hover .tpick__card-name, .tpick__card--sel .tpick__card-name { color: #fff; }
.tpick__card-desc { font-size: 13px; line-height: 1.55; color: var(--color-text-secondary); margin-bottom: 18px; min-height: 56px; }
.tpick__card-cats { display: flex; flex-wrap: wrap; gap: 5px; }
.tpick__tag { font-family: var(--font-mono); font-size: 9.5px; padding: 3px 8px; background: var(--color-bg-surface-3); color: var(--color-text-secondary); letter-spacing: 0.02em; }
.tpick__tag--more { background: transparent; border: 1px solid var(--color-border-default); color: var(--color-text-quaternary); }
.tpick__card-check {
  position: absolute; top: 18px; right: 18px; width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--color-border-default); color: #fff; font-size: 12px;
  transition: background 220ms, border-color 220ms;
}
.tpick__card--sel .tpick__card-check { background: var(--color-critical); border-color: var(--color-critical); }

.tpick__foot { display: flex; justify-content: center; }
.tpick__btn {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 14px 28px; cursor: pointer;
  background: var(--color-text-primary); color: var(--color-bg-base); border: 1px solid var(--color-text-primary);
  font-family: var(--font-sans); font-size: 14.5px; font-weight: 600;
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1), opacity 200ms, box-shadow 200ms;
}
.tpick__btn:disabled { opacity: 0.4; cursor: not-allowed; }
.tpick__btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 12px 30px -8px rgba(0,0,0,0.5); }
.tpick__btn-arrow { transition: transform 200ms; }
.tpick__btn:not(:disabled):hover .tpick__btn-arrow { transform: translateX(3px); }

@media (max-width: 760px) {
  .tpick__grid { grid-template-columns: 1fr; }
  .tpick__title { font-size: 28px; }
  .tpick__card-desc { min-height: 0; }
}

/* ════ v4.1 — camada extra de movimento ════ */
/* Tabs: leve subida no hover */
.tab { transition: color 180ms ease, transform 180ms cubic-bezier(0.16,1,0.3,1); }
.tab:hover { transform: translateY(-1px); }
.tab__count { transition: background 200ms ease, color 200ms ease; }

/* Botões de data e ações: feedback de clique tátil */
.date-nav__btn, .date-nav__today, .topbar__btn, .toolbar__select, .topbar__cta,
.row-action, .btn, .cal-filter, .day-chip {
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms cubic-bezier(0.16,1,0.3,1);
}
.date-nav__btn:active, .topbar__btn:active, .toolbar__select:active,
.cal-filter:active, .day-chip:active { transform: scale(0.93); }
.date-nav__btn:hover, .topbar__btn:hover { transform: translateY(-1px); }

/* Toolbar selects sobem sutilmente no hover */
.toolbar__select:hover { transform: translateY(-1px); }

/* Tabs entram em cascata quando a barra monta */
.tabs .tab { animation: tabIn 460ms cubic-bezier(0.16,1,0.3,1) both; }
.tabs .tab:nth-child(1) { animation-delay: 30ms; }
.tabs .tab:nth-child(2) { animation-delay: 75ms; }
.tabs .tab:nth-child(3) { animation-delay: 120ms; }
.tabs .tab:nth-child(4) { animation-delay: 165ms; }
.tabs .tab:nth-child(5) { animation-delay: 210ms; }
.tabs .tab:nth-child(n+6) { animation-delay: 255ms; }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* KPIs: cascata de entrada mais marcada */
.kpi { animation: kpiIn 560ms cubic-bezier(0.16,1,0.3,1) both; }
.kpi:nth-child(1) { animation-delay: 60ms; }
.kpi:nth-child(2) { animation-delay: 130ms; }
.kpi:nth-child(3) { animation-delay: 200ms; }
.kpi:nth-child(4) { animation-delay: 270ms; }
@keyframes kpiIn { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }

/* Notas, cards do kanban e itens de relatório com leve hover lift */
.note-card, .report-row, .cat-breakdown__item { transition: transform 200ms cubic-bezier(0.16,1,0.3,1), border-color 200ms ease, box-shadow 200ms ease; }
.note-card:hover { transform: translateY(-3px); box-shadow: 0 14px 36px -18px rgba(0,0,0,0.65); }

/* Modal backdrop com fade + leve zoom de entrada do conteúdo já existe; reforço no fechar via classe */
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
/* Só os overlays que são montados condicionalmente animam.
   O .drawer-backdrop fica sempre no DOM e controla visibilidade por opacity/classe,
   então NÃO pode ter animation com fill-mode:both (forçaria a tela borrada). */
.modal-overlay, .qa-backdrop { animation: overlayIn 200ms ease both; }
.drawer-backdrop--open { animation: overlayIn 240ms ease; }

/* Status pills mudam de cor suavemente */
.status, .list-row__status, [class*="status--"] { transition: background 240ms ease, color 240ms ease; }

/* Respeita quem prefere menos movimento (acessibilidade) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-fill-mode: none !important;
    transition-duration: 0.01ms !important;
  }
  /* Garante que elementos animados terminem VISÍVEIS, nunca presos no estado inicial */
  .view-stage, .view-stage > *, .kpi, .tabs .tab, .onb, .onb__left-body,
  .tpick, .tpick__card, .sidebar, .topbar, .app, .list-row {
    opacity: 1 !important; filter: none !important; transform: none !important;
  }
}

.settings-shortcuts { margin: 4px 0 20px; padding: 16px; border: 1px solid var(--color-border-subtle); background: var(--color-bg-surface-1); }
.settings-shortcuts__title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 12px; }
.settings-shortcuts__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
.settings-shortcut { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-text-secondary); }
.settings-shortcut kbd {
  font-family: var(--font-mono); font-size: 11px; min-width: 26px; height: 24px; padding: 0 7px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--color-bg-surface-3); border: 1px solid var(--color-border-default);
  border-bottom-width: 2px; color: var(--color-text-primary);
}

/* ── Code.gs no guia de configuração ── */
.gs-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.gs-btn {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  padding: 8px 14px; cursor: pointer;
  background: var(--color-bg-surface-3); color: var(--color-text-secondary);
  border: 1px solid var(--color-border-default);
  transition: color 140ms, border-color 140ms, background 140ms, transform 140ms cubic-bezier(0.16,1,0.3,1);
}
.gs-btn:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); transform: translateY(-1px); }
.gs-btn--primary { background: var(--color-text-primary); color: var(--color-bg-base); border-color: var(--color-text-primary); font-weight: 600; }
.gs-btn--primary:hover { color: var(--color-bg-base); opacity: 0.9; }
.gs-code {
  margin-top: 12px; max-height: 320px; overflow: auto;
  background: var(--color-bg-base); border: 1px solid var(--color-border-subtle);
  padding: 14px 16px; font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
  color: var(--color-text-tertiary); white-space: pre; tab-size: 2;
}
.gs-code code { font-family: inherit; color: inherit; background: none; }

/* ── Alarme tocando: popup com destaque + botão silenciar ── */
.qa-popup--ringing::before { opacity: 1; height: 2px; animation: ringingBar 1s ease-in-out infinite; }
@keyframes ringingBar { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.qa-popup__silence {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 7px 13px; margin-left: auto; margin-right: 8px; cursor: pointer;
  background: var(--color-critical); color: #fff; border: none;
  transition: opacity 160ms, transform 160ms;
  animation: silencePulse 1.4s ease-in-out infinite;
}
.qa-popup__silence:hover { opacity: 0.88; transform: translateY(-1px); }
@keyframes silencePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220, 34, 34,0.5); } 50% { box-shadow: 0 0 0 6px rgba(220, 34, 34,0); } }
.qa-popup--ringing .qa-popup__kicker::before { animation: qaPulse 0.7s ease-in-out infinite; }

/* ── NEXT UP — próxima tarefa com contagem regressiva (faixa de foco do turno) ── */
.nextup {
  display: flex; align-items: center; gap: 20px; width: 100%; text-align: left;
  margin-top: 16px; padding: 14px 18px; cursor: pointer;
  background: linear-gradient(90deg, var(--color-bg-surface-2), var(--color-bg-surface-1));
  border: 1px solid var(--color-border-subtle); border-left: 2px solid var(--color-text-quaternary);
  position: relative; overflow: hidden;
  transition: border-color 240ms, transform 240ms cubic-bezier(0.16,1,0.3,1), box-shadow 240ms;
  animation: viewChildIn 480ms cubic-bezier(0.16,1,0.3,1) both;
}
.nextup:hover { transform: translateY(-1px); box-shadow: 0 12px 32px -18px rgba(0,0,0,0.7); border-left-color: var(--color-text-secondary); }
.nextup--soon { border-left-color: var(--color-critical); }
.nextup--soon::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--color-critical); box-shadow: 0 0 14px var(--color-critical);
  animation: qaPulse 1.6s ease-in-out infinite;
}
.nextup__left { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; min-width: 64px; }
.nextup__label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-text-quaternary); }
.nextup__hora { font-family: var(--font-mono); font-size: 19px; font-weight: 600; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
.nextup__mid { flex: 1; min-width: 0; }
.nextup__title { font-size: 14.5px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nextup__cats { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-quaternary); margin-top: 2px; letter-spacing: 0.03em; }
.nextup__right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; min-width: 110px; }
.nextup__count { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--color-text-secondary); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.nextup--soon .nextup__count { color: var(--color-critical); }
.nextup__bar { width: 100px; height: 3px; background: var(--color-bg-surface-3); overflow: hidden; }
.nextup__bar-fill { display: block; height: 100%; background: var(--color-text-quaternary); transition: width 500ms cubic-bezier(0.16,1,0.3,1); }
.nextup--soon .nextup__bar-fill { background: var(--color-critical); }
@media (max-width: 640px) {
  .nextup { gap: 14px; padding: 12px 14px; }
  .nextup__right { min-width: 0; }
  .nextup__bar { width: 60px; }
}

/* ════ INSIGHTS — análises e hábitos no dashboard ════ */
.insights { margin-top: 28px; }
.insights__head { display: flex; align-items: center; margin-bottom: 14px; }
.insights__kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); }
.insights__grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; }
.insight-card {
  background: linear-gradient(180deg, var(--color-bg-surface-2), var(--color-bg-surface-1));
  border: 1px solid var(--color-border-subtle); padding: 18px 20px;
  animation: viewChildIn 480ms cubic-bezier(0.16,1,0.3,1) both;
}
.insight-card__label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 16px; }

/* Tendência (mini gráfico de barras) */
.insight-trend { display: flex; align-items: flex-end; gap: 10px; height: 110px; }
.insight-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.insight-bar__track { flex: 1; width: 100%; display: flex; align-items: flex-end; background: var(--color-bg-surface-3); min-height: 0; }
.insight-bar__fill { width: 100%; background: var(--color-text-tertiary); transition: height 600ms cubic-bezier(0.16,1,0.3,1); }
.insight-bar--today .insight-bar__fill { background: var(--color-critical); }
.insight-bar__pct { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
.insight-bar--today .insight-bar__pct { color: var(--color-text-primary); font-weight: 600; }
.insight-bar__day { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-quaternary); text-transform: uppercase; }

/* Cards de métrica */
.insight-card--metric { display: flex; flex-direction: column; }
.insight-metric { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
.insight-metric__value { font-family: var(--font-sans); font-size: 38px; font-weight: 400; letter-spacing: -0.03em; color: var(--color-text-primary); line-height: 1; font-variant-numeric: tabular-nums; }
.insight-metric__unit { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-tertiary); }
.insight-metric__pct { font-size: 20px; color: var(--color-text-tertiary); }
.insight-metric__sub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: auto; padding-top: 12px; line-height: 1.4; }
.insight-flames { display: flex; gap: 4px; margin-top: 12px; }
.insight-flame { width: 100%; height: 4px; background: var(--color-bg-surface-3); }
.insight-flame--on { background: var(--color-critical); }

.insight-stats { display: flex; gap: 16px; margin-top: 10px; }
.insight-stat { display: flex; flex-direction: column; gap: 2px; }
.insight-stat__n { font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
.insight-stat__n--bad { color: var(--color-critical); }
.insight-stat__l { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-quaternary); }

@media (max-width: 900px) {
  .insights__grid { grid-template-columns: 1fr; }
}

/* ── HABITS PANEL — rotinas como hábitos ── */
.habits { margin-top: 18px; border: 1px solid var(--color-border-subtle); background: linear-gradient(180deg, var(--color-bg-surface-2), var(--color-bg-surface-1)); padding: 20px 22px; animation: viewChildIn 480ms cubic-bezier(0.16,1,0.3,1) both; }
.habits__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.habits__kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-text-secondary); }
.habits__sub { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-quaternary); letter-spacing: 0.04em; }
.habits__list { display: flex; flex-direction: column; }
.habit-row { display: flex; align-items: center; gap: 18px; padding: 12px 0; border-top: 1px solid var(--color-border-subtle); }
.habit-row:first-child { border-top: none; }
.habit-row__info { flex: 1; min-width: 0; }
.habit-row__name { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.habit-row__meta { display: flex; gap: 12px; margin-top: 3px; }
.habit-row__streak { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); letter-spacing: 0.03em; }
.habit-row__consist { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-quaternary); letter-spacing: 0.03em; }
.habit-row__grid { display: flex; gap: 3px; flex-shrink: 0; }
.habit-cell { width: 13px; height: 13px; background: var(--color-bg-surface-3); position: relative; }
.habit-cell--feito { background: var(--color-neutral-strong); }
.habit-cell--falha { background: var(--color-critical); opacity: 0.85; }
.habit-cell--perdido { background: var(--color-bg-surface-3); border: 1px solid rgba(220,34,34,0.35); }
.habit-cell--hoje { background: var(--color-bg-surface-3); border: 1px solid var(--color-text-tertiary); }
.habit-cell--futuro { background: transparent; border: 1px solid var(--color-border-subtle); }
.habit-cell--naoprog { background: transparent; }
.habit-cell--today { box-shadow: 0 0 0 1px var(--color-text-primary); }
@media (max-width: 640px) {
  .habit-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .habit-row__grid { flex-wrap: wrap; }
}

/* Segunda linha de KPIs (pedidos / projetos em andamento) */
.hero--secondary { grid-template-columns: 1fr 1fr; margin-top: 1px; }
@media (max-width: 720px) { .hero--secondary { grid-template-columns: 1fr; } }

/* ════════════════════════════════════════════════════════════
   CAMADA DE MOVIMENTO v6.3 — tudo animado: entrada, saída, estado
   ════════════════════════════════════════════════════════════ */

/* ── Entradas mais expressivas ── */
@keyframes popIn {
  0%   { opacity: 0; transform: translateY(14px) scale(0.97); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-16px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Linhas da lista: entrada mais marcada + cascata mais longa ── */
@keyframes rowIn {
  from { opacity: 0; transform: translateY(12px) scale(0.995); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.list-row { animation: rowIn 440ms cubic-bezier(0.16,1,0.3,1) both; }
.list-row:nth-child(1)  { animation-delay: 20ms; }
.list-row:nth-child(2)  { animation-delay: 55ms; }
.list-row:nth-child(3)  { animation-delay: 90ms; }
.list-row:nth-child(4)  { animation-delay: 125ms; }
.list-row:nth-child(5)  { animation-delay: 160ms; }
.list-row:nth-child(6)  { animation-delay: 195ms; }
.list-row:nth-child(7)  { animation-delay: 230ms; }
.list-row:nth-child(8)  { animation-delay: 265ms; }
.list-row:nth-child(9)  { animation-delay: 300ms; }
.list-row:nth-child(10) { animation-delay: 335ms; }
.list-row:nth-child(n+11) { animation-delay: 360ms; }

/* ── KPIs: entrada com pop ── */
.kpi { animation: popIn 600ms cubic-bezier(0.16,1,0.3,1) both; }
.kpi:nth-child(1) { animation-delay: 60ms; }
.kpi:nth-child(2) { animation-delay: 130ms; }
.kpi:nth-child(3) { animation-delay: 200ms; }
.kpi:nth-child(4) { animation-delay: 270ms; }
.hero--secondary .kpi:nth-child(1) { animation-delay: 320ms; }
.hero--secondary .kpi:nth-child(2) { animation-delay: 380ms; }

/* ── Painéis (insights, habits, aside, nextup, statusbar) entram de baixo ── */
.insights, .habits, .aside-grid, .nextup, .statusbar, .hero-bottom,
.cat-tile, .upcoming, .categories, .conclusion {
  animation: fadeSlideUp 560ms cubic-bezier(0.16,1,0.3,1) both;
}
.aside-grid { animation-delay: 80ms; }
.insights { animation-delay: 140ms; }
.habits { animation-delay: 200ms; }

/* ── Cards de hábito / categoria / linhas internas em cascata ── */
.habit-row { animation: fadeSlideUp 460ms cubic-bezier(0.16,1,0.3,1) both; }
.habit-row:nth-child(1) { animation-delay: 60ms; }
.habit-row:nth-child(2) { animation-delay: 110ms; }
.habit-row:nth-child(3) { animation-delay: 160ms; }
.habit-row:nth-child(4) { animation-delay: 210ms; }
.habit-row:nth-child(n+5) { animation-delay: 250ms; }
.habit-cell { animation: scaleIn 360ms cubic-bezier(0.16,1,0.3,1) both; }

/* células de hábito animam em onda */
.habit-cell:nth-child(1){animation-delay:.02s}.habit-cell:nth-child(2){animation-delay:.04s}
.habit-cell:nth-child(3){animation-delay:.06s}.habit-cell:nth-child(4){animation-delay:.08s}
.habit-cell:nth-child(5){animation-delay:.10s}.habit-cell:nth-child(6){animation-delay:.12s}
.habit-cell:nth-child(7){animation-delay:.14s}.habit-cell:nth-child(8){animation-delay:.16s}
.habit-cell:nth-child(9){animation-delay:.18s}.habit-cell:nth-child(10){animation-delay:.20s}
.habit-cell:nth-child(11){animation-delay:.22s}.habit-cell:nth-child(12){animation-delay:.24s}
.habit-cell:nth-child(13){animation-delay:.26s}.habit-cell:nth-child(14){animation-delay:.28s}

/* ── Barras de categoria / progresso animam a largura ── */
.cat-tile__bar-fill, .insight-bar__fill, .habit-cell, .nextup__bar-fill,
.conclusion__ring-fill, .cat-breakdown__bar-fill {
  transition: width 700ms cubic-bezier(0.16,1,0.3,1), height 700ms cubic-bezier(0.16,1,0.3,1), background 300ms ease;
}

/* ── MODAIS: entrada E saída animadas ── */
@keyframes modalInBig {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes modalOutBig {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to   { opacity: 0; transform: translateY(16px) scale(0.97); }
}
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
.modal, .qa-popup, .tpick__inner, .onb__card {
  animation: modalInBig 420ms cubic-bezier(0.16,1,0.3,1) both;
}
.modal-backdrop, .qa-backdrop, .drawer-backdrop--open, .tpick, .onb {
  animation: backdropIn 280ms ease both;
}
/* classe de saída aplicada via JS quando vai fechar */
.is-closing.modal, .is-closing .modal, .is-closing.qa-popup, .is-closing .qa-popup {
  animation: modalOutBig 280ms cubic-bezier(0.4,0,1,1) both;
}

/* ── Abas / dropdowns / menus entram ── */
.tabs .tab { animation: fadeSlideUp 480ms cubic-bezier(0.16,1,0.3,1) both; }
.tabs .tab:nth-child(1){animation-delay:.03s}.tabs .tab:nth-child(2){animation-delay:.07s}
.tabs .tab:nth-child(3){animation-delay:.11s}.tabs .tab:nth-child(4){animation-delay:.15s}
.tabs .tab:nth-child(5){animation-delay:.19s}.tabs .tab:nth-child(n+6){animation-delay:.22s}

.dropdown__item, .menu__item { animation: slideInLeft 280ms cubic-bezier(0.16,1,0.3,1) both; }
.dropdown__item:nth-child(1),.menu__item:nth-child(1){animation-delay:.02s}
.dropdown__item:nth-child(2),.menu__item:nth-child(2){animation-delay:.05s}
.dropdown__item:nth-child(3),.menu__item:nth-child(3){animation-delay:.08s}
.dropdown__item:nth-child(4),.menu__item:nth-child(4){animation-delay:.11s}
.dropdown__item:nth-child(5),.menu__item:nth-child(5){animation-delay:.14s}
.dropdown__item:nth-child(n+6),.menu__item:nth-child(n+6){animation-delay:.16s}

/* ── Notificações entram em cascata ── */
.notif-item { animation: slideInLeft 380ms cubic-bezier(0.16,1,0.3,1) both; }
.notif-item:nth-child(1){animation-delay:.04s}.notif-item:nth-child(2){animation-delay:.09s}
.notif-item:nth-child(3){animation-delay:.14s}.notif-item:nth-child(4){animation-delay:.19s}
.notif-item:nth-child(n+5){animation-delay:.22s}

/* ── Microinterações de estado (clique) — todos os botões "afundam" ── */
button:active, .btn:active, .qa-btn:active, .tab:active, .sidebar__item:active,
.list-row__action:active, .topbar__btn:active, .ws-switch__btn:active {
  transform: scale(0.96);
}

/* ── Badges/contadores pulsam ao mudar ── */
@keyframes countPulse { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
.tab__count, .topbar__bell-badge, .notif-badge { transition: transform 240ms cubic-bezier(0.16,1,0.3,1), background 240ms, color 240ms; }

/* respeita redução de movimento — termina tudo visível */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    animation-fill-mode: none !important; transition-duration: 0.01ms !important;
  }
  .list-row, .kpi, .insights, .habits, .aside-grid, .nextup, .habit-row, .habit-cell,
  .tabs .tab, .modal, .qa-popup, .notif-item, .dropdown__item, .onb__card, .tpick__inner {
    opacity: 1 !important; transform: none !important; filter: none !important;
  }
}

/* Menu de ações que abre para cima quando falta espaço abaixo */
.dropdown__menu--up { top: auto; bottom: calc(100% + 6px); transform-origin: bottom right; }
.dropdown { position: relative; }
.dropdown__menu { z-index: 200; }
/* a lista não deve clipar o menu */
.list { overflow: visible; }

/* KPI clicável (filtra a lista ao clicar) */
.kpi--clickable { cursor: pointer; }
.kpi--clickable:hover { background: linear-gradient(180deg, var(--color-bg-surface-3), var(--color-bg-surface-1) 55%); }
.kpi--clickable:hover .kpi__sub { color: var(--color-text-secondary); }
.kpi--clickable:active { transform: scale(0.99); }
.kpi--clickable:focus-visible { outline: 2px solid var(--color-text-tertiary); outline-offset: -2px; }

/* ── Modal de exclusão (escolha dia / geral) ── */
.modal--delete { width: 460px; max-width: calc(100vw - 32px); }
.modal__kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 6px; }
.modal__kicker--danger { color: var(--color-critical); }
.del-modal__text { font-size: 14px; color: var(--color-text-secondary); line-height: 1.5; margin: 0 0 20px; }
.del-modal__options { display: flex; flex-direction: column; gap: 10px; }
.del-option {
  display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left;
  padding: 15px 16px; cursor: pointer;
  background: rgba(255,255,255,0.02); border: 1px solid var(--color-border-subtle);
  position: relative; overflow: hidden;
  transition: background 200ms, border-color 200ms, transform 220ms cubic-bezier(0.16,1,0.3,1);
}
.del-option::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--color-text-quaternary); transform: scaleY(0); transform-origin: center;
  transition: transform 220ms cubic-bezier(0.16,1,0.3,1), background 200ms;
}
.del-option:hover { background: rgba(255,255,255,0.04); border-color: var(--color-border-default); transform: translateY(-1px); }
.del-option:hover::before { transform: scaleY(1); }
.del-option--danger:hover { border-color: rgba(220,34,34,0.5); }
.del-option--danger:hover::before { background: var(--color-critical); }
.del-option__main { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.del-option__main svg { opacity: 0.6; }
.del-option--danger:hover .del-option__main svg { color: var(--color-critical); opacity: 1; }
.del-option__hint { font-size: 12px; color: var(--color-text-tertiary); line-height: 1.4; padding-left: 26px; }
.del-modal__actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn--ghost { background: transparent; color: var(--color-text-secondary); border: 1px solid var(--color-border-default); padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500; transition: color 160ms, border-color 160ms, background 160ms, transform 180ms cubic-bezier(0.16,1,0.3,1); }
.btn--ghost:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); transform: translateY(-1px); }

/* ── Painel de inteligência da Visão Semanal ── */
.week-intel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--color-border-subtle); border: 1px solid var(--color-border-subtle); margin: 20px 0; }
.week-intel__card { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: var(--color-bg-surface-1); text-align: left; cursor: default; border: none; position: relative; transition: background 200ms; }
button.week-intel__card { cursor: pointer; }
button.week-intel__card:hover { background: var(--color-bg-surface-2); }
.week-intel__card--accent::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--color-critical); }
.week-intel__label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); }
