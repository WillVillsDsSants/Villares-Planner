  font-size: 0; padding: 0;
  transition: background 200ms ease, border-color 200ms ease;
}
.notif-alarm__switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; background: var(--color-text-tertiary);
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1), background 200ms ease;
}
.notif-alarm--on .notif-alarm__switch { background: var(--color-neutral-strong); border-color: var(--color-neutral-strong); }
.notif-alarm--on .notif-alarm__switch::after { transform: translateX(18px); background: var(--color-bg-base); }

/* ═══════════════════════════════════════════════════════════
   REFINO v2.1 — animações, profundidade e micro-interações
   ═══════════════════════════════════════════════════════════ */

/* Transições globais suaves em elementos interativos */
.kpi, .list-row, .cat-tile, .note, .kanban__card, .timeline__item,
.day-panel__row, .agenda__day, .team-card, .report-panel, .todo__row,
.cal__cell, .tab, .sidebar__item, .toolbar__select, .topbar__btn,
.topbar__cta, .btn, .form-chip, .day-chip, .cal-filter, .cal-mode,
.notif-item, .sync-indicator, .dropdown__item, .date-nav__btn, .date-nav__today {
  transition: background-color 160ms ease, border-color 160ms ease,
              color 160ms ease, transform 160ms cubic-bezier(0.16,1,0.3,1),
              box-shadow 160ms ease, opacity 160ms ease;
}

/* Entrada escalonada da lista (stagger) */
@keyframes rowIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.list-row { animation: rowIn 360ms cubic-bezier(0.16,1,0.3,1) both; }
.list-row:nth-child(1) { animation-delay: 0ms; }
.list-row:nth-child(2) { animation-delay: 28ms; }
.list-row:nth-child(3) { animation-delay: 56ms; }
.list-row:nth-child(4) { animation-delay: 84ms; }
.list-row:nth-child(5) { animation-delay: 112ms; }
.list-row:nth-child(6) { animation-delay: 140ms; }
.list-row:nth-child(7) { animation-delay: 168ms; }
.list-row:nth-child(8) { animation-delay: 196ms; }
.list-row:nth-child(n+9) { animation-delay: 220ms; }

/* KPI: leve elevação no hover + brilho sutil */
.kpi { position: relative; overflow: hidden; transition: transform 280ms cubic-bezier(0.16,1,0.3,1), box-shadow 280ms ease; }
.kpi::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,0.05), transparent 60%);
  opacity: 0; transition: opacity 280ms ease; pointer-events: none;
}
.kpi:hover::after { opacity: 1; }
.kpi:hover { transform: translateY(-3px); box-shadow: 0 16px 40px -20px rgba(0,0,0,0.7); }

/* KPI value — animação de contagem visual (pulse on mount) */
@keyframes kpiPop {
  0% { opacity: 0; transform: translateY(8px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.kpi__value { animation: kpiPop 480ms cubic-bezier(0.16,1,0.3,1) both; }

/* Linhas da lista: barra de acento na origem ao passar o mouse */
.list-row { position: relative; }
.list-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--color-neutral-strong);
  transform: scaleY(0); transform-origin: center;
  transition: transform 180ms cubic-bezier(0.16,1,0.3,1);
}
.list-row:hover::before { transform: scaleY(1); }

/* Cards do Kanban: profundidade ao arrastar e hover */
.kanban__card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.32); }
.kanban__col { transition: background-color 180ms ease, border-color 180ms ease; }
.kanban__col--over { box-shadow: inset 0 0 0 1px var(--color-neutral-strong); }

/* Sidebar: indicador ativo deslizante */
.sidebar__item { position: relative; }
.sidebar__item::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
  width: 2px; height: 22px; background: var(--color-neutral-strong);
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar__item--active::before { transform: translateY(-50%) scaleY(1); }
.sidebar__item:hover { color: var(--color-text-primary); }
.sidebar__item:hover svg { transform: scale(1.08); }
.sidebar__item svg { transition: transform 180ms cubic-bezier(0.16,1,0.3,1); }

/* Tabs: sublinhado animado */
.tab { position: relative; }
.tab::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--color-text-primary); transform: scaleX(0); transform-origin: center;
  transition: transform 220ms cubic-bezier(0.16,1,0.3,1);
}
.tab--active::after { transform: scaleX(1); }

/* Botão primário: brilho ao hover */
.topbar__cta, .btn--primary { position: relative; overflow: hidden; }
.topbar__cta::after, .btn--primary::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(110deg, transparent, rgba(255,255,255,0.35), transparent);
  transition: left 520ms cubic-bezier(0.16,1,0.3,1);
}
.topbar__cta:hover::after, .btn--primary:hover::after { left: 140%; }
.topbar__cta:active, .btn--primary:active { transform: scale(0.97); }

/* Tiles de categoria: barra preenche com easing ao montar */
.cat-tile__bar-fill { transition: width 640ms cubic-bezier(0.16,1,0.3,1); }
.report-row__fill { transition: width 640ms cubic-bezier(0.16,1,0.3,1); }

/* Notas e cards: leve lift */
.note:hover, .team-card:hover, .report-panel:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.24); }

/* Dropdown menus: entrada suave */
@keyframes menuIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.dropdown__menu { animation: menuIn 150ms cubic-bezier(0.16,1,0.3,1) both; transform-origin: top right; }

/* Modal: backdrop blur + entrada do card */
.modal-backdrop {
  backdrop-filter: blur(3px);
  animation: fadeIn 180ms ease both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal { animation: modalIn 260ms cubic-bezier(0.16,1,0.3,1) both; }

/* Inputs/selects: foco com glow sutil */
.form-input:focus, .form-select:focus, .form-textarea:focus,
.todo__input:focus, .topbar__search input:focus {
  box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
}
.topbar__search { transition: box-shadow 180ms ease; }
.topbar__search:focus-within { box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }

/* Checkbox do to-do: pop ao marcar */
@keyframes checkPop { 0%{transform:scale(0.7)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
.todo__check--on, .day-agenda__check--on { animation: checkPop 240ms cubic-bezier(0.16,1,0.3,1); }

/* Badge do sino: pulso quando há não-lidas */
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(220,34,34,0.5); }
  50%     { box-shadow: 0 0 0 4px rgba(220,34,34,0); }
}
.topbar__btn--bell .notif-badge { animation: badgePulse 2.4s ease-in-out infinite; }

/* Scrollbar global discreta */
::selection { background: rgba(255,255,255,0.16); color: #fff; }
html.light ::selection { background: rgba(0,0,0,0.12); color: #000; }
/* Foco de teclado elegante (acessibilidade sem poluir o mouse) */
:focus-visible { outline: 1px solid var(--color-border-strong); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); background-clip: padding-box; }

/* Título do header com leve gradiente de texto */
.page__header-title {
  background: linear-gradient(180deg, var(--color-text-primary), rgba(255,255,255,0.7));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
html.light .page__header-title {
  background: linear-gradient(180deg, #0e0e10, #3f3f48);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

/* Respeitar quem prefere menos movimento */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-fill-mode: none !important;
    transition-duration: 0.01ms !important;
  }
  /* Garante que elementos animados terminem VISÍVEIS, nunca presos no estado inicial */
  .view-stage, .view-stage > *, .kpi, .tabs .tab, .onb, .onb__left-body,
  .tpick, .tpick__card, .sidebar, .topbar, .app, .list-row {
    opacity: 1 !important; filter: none !important; transform: none !important;
  }
}

/* ════ TO-DO BOARD v2 ════ */
.todo2 { margin-top: 18px; max-width: 920px; }
.todo2__progress {
  display: flex; align-items: center; gap: 18px;
  margin-bottom: 20px;
}
.todo2__progress-info { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
.todo2__progress-pct {
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  letter-spacing: -0.01em; color: var(--color-text-primary);
}
.todo2__progress-label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); }
.todo2__progress-bar {
  flex: 1; height: 6px; background: var(--color-bg-surface-3); overflow: hidden;
}
.todo2__progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #22C55E, #4ade80);
  transition: width 640ms cubic-bezier(0.16,1,0.3,1);
}

.todo2__add {
  display: flex; align-items: center; gap: 0;
  border: 1px solid var(--color-border-default);
  background: var(--color-bg-surface-1);
  margin-bottom: 22px;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.todo2__add:focus-within { border-color: var(--color-border-strong); box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
.todo2__add-icon {
  font-size: 20px; color: var(--color-text-quaternary);
  width: 48px; text-align: center; flex-shrink: 0; font-weight: 300;
}
.todo2__input {
  flex: 1; height: 50px; background: transparent; border: none; outline: none;
  color: var(--color-text-primary); font-size: 15px; font-family: var(--font-sans);
}
.todo2__input::placeholder { color: var(--color-text-quaternary); }
.todo2__add-btn {
  height: 50px; padding: 0 22px; flex-shrink: 0;
  background: var(--color-neutral-strong); color: var(--color-bg-base);
  border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
  transition: opacity 140ms ease;
}
.todo2__add-btn:hover:not(:disabled) { opacity: 0.88; }
.todo2__add-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.todo2__cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .todo2__cols { grid-template-columns: 1fr; } }
.todo2 { max-width: 1100px; }
.todo2__col-dot--prog { background: #f59e0b; }
.todo2__col-head--prog { color: var(--color-text-secondary); }
.todo2__card--prog { border-left-color: #f59e0b; }
.todo2__check--prog { border-color: #f59e0b; color: #f59e0b; font-size: 11px; }
.todo2__check--prog:hover { background: rgba(245,158,11,0.12); }
.todo2__move {
  width: 24px; height: 24px; flex-shrink: 0;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-quaternary); font-size: 14px; font-family: var(--font-mono);
  opacity: 0; transition: opacity 120ms, color 120ms;
}
.todo2__card:hover .todo2__move { opacity: 1; }
.todo2__move:hover { color: var(--color-text-primary); }
.todo2__col {
  background: var(--color-bg-surface-1);
  border: 1px solid var(--color-border-subtle);
  min-height: 200px;
}
.todo2__col-head {
  display: flex; align-items: center; gap: 9px;
  padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--color-text-secondary);
}
.todo2__col-dot { width: 7px; height: 7px; background: var(--color-neutral-mid); }
.todo2__col-dot--done { background: #22C55E; }
.todo2__col-count {
  font-family: var(--font-mono); font-size: 11px; color: var(--color-text-quaternary);
  background: var(--color-bg-surface-3); padding: 1px 8px;
}
.todo2__col-head--done { color: var(--color-text-tertiary); }
.todo2__clear {
  margin-left: auto; background: transparent; border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--color-text-quaternary);
}
.todo2__clear:hover { color: var(--color-critical); }
.todo2__list { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.todo2__col-empty {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-quaternary);
  text-align: center; padding: 26px 8px;
}
@keyframes todoCardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.todo2__card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px;
  background: var(--color-bg-surface-2);
  border: 1px solid var(--color-border-subtle);
  border-left: 2px solid var(--color-neutral-mid);
  animation: todoCardIn 240ms cubic-bezier(0.16,1,0.3,1) both;
  transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}
.todo2__card:hover { border-color: var(--color-border-strong); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
.todo2__card--done { border-left-color: #22C55E; opacity: 0.6; }
.todo2__card--done .todo2__text { text-decoration: line-through; color: var(--color-text-tertiary); }
.todo2__check {
  width: 20px; height: 20px; flex-shrink: 0;
  background: transparent; border: 1.5px solid var(--color-border-strong); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--color-bg-base);
  transition: all 140ms ease;
}
.todo2__check:hover { border-color: #22C55E; }
.todo2__check--on { background: #22C55E; border-color: #22C55E; }
@keyframes checkPop2 { 0%{transform:scale(0.6)} 55%{transform:scale(1.2)} 100%{transform:scale(1)} }
.todo2__check--on { animation: checkPop2 260ms cubic-bezier(0.16,1,0.3,1); }
.todo2__text { flex: 1; font-size: 14px; color: var(--color-text-primary); line-height: 1.4; }
.todo2__del {
  width: 24px; height: 24px; flex-shrink: 0;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-quaternary); font-size: 17px; font-family: var(--font-mono);
  opacity: 0; transition: opacity 120ms, color 120ms;
}
.todo2__card:hover .todo2__del { opacity: 1; }
.todo2__del:hover { color: var(--color-critical); }
.todo2__empty {
  text-align: center; padding: 56px 24px;
  border: 1px dashed var(--color-border-default);
}
.todo2__empty-mark {
  width: 48px; height: 48px; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #22C55E; color: #22C55E; font-size: 22px;
}
.todo2__empty-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.todo2__empty-sub { font-size: 13px; color: var(--color-text-tertiary); max-width: 400px; margin: 0 auto; line-height: 1.6; }

/* ── Toggle de configuração (switch) ── */
.settings-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 16px; margin-bottom: 16px;
  background: var(--color-bg-surface-2);
  border: 1px solid var(--color-border-subtle);
}
.settings-toggle__title { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
.settings-toggle__sub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
.settings-switch {
  width: 44px; height: 24px; flex-shrink: 0;
  background: var(--color-bg-surface-3); border: 1px solid var(--color-border-default);
  cursor: pointer; position: relative; padding: 0;
  transition: background 200ms ease, border-color 200ms ease;
}
.settings-switch--on { background: #22C55E; border-color: #22C55E; }
.settings-switch__knob {
  position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; background: #fff;
  transition: transform 200ms cubic-bezier(0.16,1,0.3,1);
}
.settings-switch--on .settings-switch__knob { transform: translateX(20px); }



/* ── Barra de resumo do dia (segmentada) ── */
.statusbar {
  margin-top: 18px;
  border: 1px solid var(--color-border-subtle);
  background: linear-gradient(180deg, var(--color-bg-surface-1), rgba(255,255,255,0.012));
  padding: 18px 20px 16px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px -16px rgba(0,0,0,0.6);
}
.statusbar__top {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 13px;
}
.statusbar__heading {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--color-text-quaternary);
}
.statusbar__total {
  font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary);
}
.statusbar__total b { color: var(--color-text-primary); font-weight: 600; }
.statusbar__track {
  display: flex; height: 7px; gap: 2px;
  padding: 2px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--color-border-subtle);
  border-radius: 1px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3) inset;
}
.statusbar__seg {
  transition: flex-grow 600ms cubic-bezier(0.16,1,0.3,1);
  min-width: 8px; position: relative; border-radius: 1px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.25);
}
/* Brilho sutil no topo de cada segmento, como os botões/cards do site */
.statusbar__seg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 60%);
  border-radius: 1px;
}
.statusbar__seg--pend  { background: var(--color-neutral-mid); }
.statusbar__seg--prog  { background: #c98a2b; }
.statusbar__seg--feito { background: var(--color-neutral-strong); }
.statusbar__seg--falha { background: var(--color-critical); }
.statusbar__legend {
  display: flex; align-items: center; gap: 0; flex-wrap: wrap;
  margin-top: 15px;
}
.statusbar__item {
  display: flex; align-items: center; gap: 9px;
  padding-right: 20px; margin-right: 20px;
  border-right: 1px solid var(--color-border-subtle);
}
.statusbar__item:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.statusbar__num {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  color: var(--color-text-primary); letter-spacing: -0.01em; line-height: 1;
}
.statusbar__meta { display: flex; flex-direction: column; gap: 2px; }
.statusbar__label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--color-text-quaternary); line-height: 1;
}
.statusbar__dot {
  width: 6px; height: 6px; flex-shrink: 0;
  box-shadow: 0 0 8px -1px currentColor;
}
.statusbar__dot--pend  { background: var(--color-neutral-mid); color: var(--color-neutral-mid); }
.statusbar__dot--prog  { background: #c98a2b; color: #c98a2b; }
.statusbar__dot--feito { background: var(--color-neutral-strong); color: var(--color-neutral-strong); }
.statusbar__dot--falha { background: var(--color-critical); color: var(--color-critical); }

/* ── Popup de ação rápida (vindo da notificação do navegador) ── */
.qa-backdrop {
  position: fixed; inset: 0; z-index: 1200;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 14vh;
  animation: fadeIn 160ms ease both;
}
.qa-popup {
  width: 380px; max-width: calc(100vw - 32px);
  background: var(--color-bg-surface-1);
  border: 1px solid var(--color-border-default);
  box-shadow: 0 28px 72px -16px rgba(0,0,0,0.8);
  padding: 18px 20px 16px;
  animation: modalIn 240ms cubic-bezier(0.16,1,0.3,1) both;
  position: relative;
}
.qa-popup::before {
  content: ''; position: absolute; left: 0; top: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--color-critical), transparent 70%);
}
.qa-popup__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.qa-popup__kicker {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--color-text-quaternary);
}
.qa-popup__close {
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; cursor: pointer; color: var(--color-text-tertiary);
  transition: color 140ms;
}
.qa-popup__close:hover { color: var(--color-text-primary); }
.qa-popup__title {
  font-family: var(--font-display); font-size: 18px; font-weight: 600;
  color: var(--color-text-primary); line-height: 1.3; margin-bottom: 5px;
}
.qa-popup__desc { font-size: 12.5px; color: var(--color-text-tertiary); line-height: 1.5; margin-bottom: 16px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qa-popup__label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 9px;
}
.qa-popup__actions { display: flex; flex-direction: column; gap: 7px; }
.qa-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; width: 100%;
  background: var(--color-bg-surface-2); border: 1px solid var(--color-border-subtle);
  border-left-width: 2px;
  color: var(--color-text-secondary); cursor: pointer;
  font-family: var(--font-sans); font-size: 13.5px; font-weight: 500;
  transition: background 140ms, border-color 140ms, color 140ms, transform 120ms;
}
.qa-btn:hover { background: var(--color-bg-surface-3); color: var(--color-text-primary); transform: translateX(2px); }
.qa-btn--done { border-left-color: var(--color-neutral-strong); }
.qa-btn--prog { border-left-color: #c98a2b; }
.qa-btn--fail { border-left-color: var(--color-critical); }
.qa-btn--done:hover { border-color: var(--color-neutral-strong); }
.qa-btn--prog:hover { border-color: #c98a2b; }
.qa-btn--fail:hover { border-color: var(--color-critical); }
.qa-popup__open {
  margin-top: 14px; width: 100%;
  background: transparent; border: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
  color: var(--color-text-tertiary); padding: 6px;
  transition: color 140ms;
}
.qa-popup__open:hover { color: var(--color-text-primary); }

/* ═══════════════════════════════════════════════════════════
   v3.0 — transições de view, mobile drawer, workspaces, foco
   ═══════════════════════════════════════════════════════════ */

/* ── Transição ao trocar de view (key=view remonta) ── */
@keyframes viewIn {
  from { opacity: 0; transform: translateY(12px) scale(0.995); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.view-stage { animation: viewIn 380ms cubic-bezier(0.16,1,0.3,1) both; }
@keyframes appBootIn { from { opacity: 0; } to { opacity: 1; } }
.app { animation: appBootIn 600ms ease both; }
.sidebar { animation: sidebarIn 600ms cubic-bezier(0.16,1,0.3,1) both; }
@keyframes sidebarIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.topbar { animation: topbarIn 560ms cubic-bezier(0.16,1,0.3,1) both; }
@keyframes topbarIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
/* Filhos diretos da view entram em cascata (efeito premium de "montagem") */
@keyframes viewChildIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.view-stage > * { animation: viewChildIn 480ms cubic-bezier(0.16,1,0.3,1) both; }
.view-stage > *:nth-child(1) { animation-delay: 40ms; }
.view-stage > *:nth-child(2) { animation-delay: 100ms; }
.view-stage > *:nth-child(3) { animation-delay: 160ms; }
.view-stage > *:nth-child(4) { animation-delay: 220ms; }
.view-stage > *:nth-child(n+5) { animation-delay: 280ms; }

/* Transição ao trocar de WORKSPACE — o app inteiro pisca suavemente */
@keyframes wsSwap {
  0%   { opacity: 1; }
  35%  { opacity: 0.55; transform: scale(0.997); }
  100% { opacity: 1; transform: scale(1); }
}
.main--ws-swap { animation: wsSwap 460ms cubic-bezier(0.16,1,0.3,1); }

/* Hamburger — só no mobile */
.topbar__burger {
  display: none;
  width: 34px; height: 34px; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--color-border-subtle);
  color: var(--color-text-secondary); cursor: pointer; flex-shrink: 0;
  transition: color 140ms, border-color 140ms;
}
.topbar__burger:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); }

/* ── Workspace switcher (topbar) ── */
.ws-switch { position: relative; flex-shrink: 0; }
.ws-switch__btn {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 12px;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-default);
  color: var(--color-text-secondary); cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  transition: border-color 140ms, color 140ms;
}
.ws-switch__btn:hover { border-color: var(--color-border-strong); color: var(--color-text-primary); }
.ws-switch__dot { width: 7px; height: 7px; background: var(--color-neutral-strong); flex-shrink: 0; }
.ws-switch__label { white-space: nowrap; }
.ws-switch__menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 100;
  width: 220px;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-default);
  box-shadow: 0 16px 44px -12px rgba(0,0,0,0.7);
  animation: menuIn 160ms cubic-bezier(0.16,1,0.3,1) both;
}
.ws-switch__item {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  padding: 11px 14px; text-align: left;
  background: transparent; border: none; border-bottom: 1px solid var(--color-border-subtle);
  cursor: pointer; transition: background 120ms;
}
.ws-switch__item:last-child { border-bottom: none; }
.ws-switch__item:hover { background: var(--color-bg-surface-2); }
.ws-switch__item--active { background: var(--color-bg-surface-2); }
.ws-switch__item--active .ws-switch__item-name { color: var(--color-text-primary); }
.ws-switch__item-name { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
.ws-switch__item-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--color-text-quaternary); letter-spacing: 0.04em; }

/* ── Mobile drawer ── */
.drawer-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none; transition: opacity 240ms ease;
}
.drawer-backdrop--open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 101;
  width: 280px; max-width: 84vw;
  background: var(--color-bg-sidebar);
  border-right: 1px solid var(--color-border-default);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 300ms cubic-bezier(0.16,1,0.3,1);
}
.drawer--open { transform: translateX(0); }
.drawer__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 18px 16px; border-bottom: 1px solid var(--color-border-subtle);
}
.drawer__brand { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.drawer__brand-sep { color: var(--color-critical); }
.drawer__close { background: transparent; border: none; color: var(--color-text-tertiary); cursor: pointer; }
.drawer__ws { padding: 16px 14px; border-bottom: 1px solid var(--color-border-subtle); }
.drawer__ws-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 10px; padding: 0 4px; }
.drawer__ws-btn {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  padding: 10px 12px; margin-bottom: 4px; text-align: left;
  background: transparent; border: 1px solid transparent; cursor: pointer;
  transition: background 120ms, border-color 120ms;
}
.drawer__ws-btn:hover { background: var(--color-bg-surface-2); }
.drawer__ws-btn--active { background: var(--color-bg-surface-2); border-color: var(--color-border-default); }
.drawer__ws-name { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
.drawer__ws-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--color-text-quaternary); }
.drawer__nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.drawer__item {
  display: flex; align-items: center; gap: 13px;
  padding: 12px 14px; width: 100%; text-align: left;
  background: transparent; border: none; cursor: pointer;
  color: var(--color-text-tertiary); font-family: var(--font-sans); font-size: 14px;
  transition: background 120ms, color 120ms;
}
.drawer__item:hover { background: var(--color-bg-surface-2); color: var(--color-text-primary); }
.drawer__item--active { background: var(--color-bg-surface-2); color: var(--color-text-primary); box-shadow: inset 2px 0 0 var(--color-neutral-strong); }
.drawer__footer { padding: 12px 10px; border-top: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; gap: 2px; }

/* ── Week view ── */
.week { max-width: 1180px; margin: 20px auto 0; min-width: 0; }
.view-stage { min-width: 0; max-width: 100%; overflow-x: hidden; }
.page { overflow-x: hidden; }
.week__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.week__kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 6px; }
.week__heading { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.week__summary { display: flex; align-items: baseline; gap: 10px; }
.week__summary-pct { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--color-text-primary); }
.week__summary-label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); }

/* Gráfico de carga */
.week__chart {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
  padding: 18px; margin-bottom: 18px;
  border: 1px solid var(--color-border-subtle); background: var(--color-bg-surface-1);
}
.week__bar-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  background: transparent; border: none; cursor: pointer; padding: 6px 0;
  transition: background 140ms;
}
.week__bar-wrap--sel { background: var(--color-bg-surface-2); }
.week__bar-track { width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.week__bar {
  width: 60%; max-width: 38px; background: var(--color-bg-surface-3); position: relative;
  display: flex; align-items: flex-end; transition: height 520ms cubic-bezier(0.16,1,0.3,1);
}
.week__bar-done { width: 100%; background: var(--color-neutral-strong); transition: height 520ms cubic-bezier(0.16,1,0.3,1); }
.week__bar-day { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--color-text-quaternary); }
.week__bar-day--today { color: var(--color-text-primary); font-weight: 700; }
.week__bar-num { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); min-height: 14px; }

/* Grade de colunas */
.week__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--color-border-subtle); border: 1px solid var(--color-border-subtle); }
.week__col { background: var(--color-bg-base); display: flex; flex-direction: column; min-height: 220px; min-width: 0; overflow: hidden; }
.week__col--today { background: var(--color-bg-surface-1); }
.week__col--sel { box-shadow: inset 0 2px 0 var(--color-neutral-strong); }
.week__col-head {
  display: flex; align-items: center; gap: 6px; padding: 10px 11px;
  background: transparent; border: none; border-bottom: 1px solid var(--color-border-subtle);
  cursor: pointer; width: 100%; transition: background 120ms;
}
.week__col-head:hover { background: var(--color-bg-surface-2); }
.week__col-name { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; color: var(--color-text-quaternary); }
.week__col-date { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
.week__col--today .week__col-date { color: var(--color-text-primary); }
.week__col-ratio { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--color-text-tertiary); background: var(--color-bg-surface-3); padding: 1px 6px; }
.week__col-body { flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.week__col-empty { text-align: center; color: var(--color-text-quaternary); font-size: 16px; padding: 16px 0; opacity: 0.4; }
.week__task {
  display: flex; align-items: center; gap: 6px; padding: 6px 7px; cursor: pointer;
  background: var(--color-bg-surface-1); border: 1px solid var(--color-border-subtle);
  border-left: 2px solid var(--color-neutral-mid);
  transition: background 120ms, transform 120ms;
}
.week__task:hover { background: var(--color-bg-surface-2); transform: translateX(1px); }
.week__task--done { opacity: 0.5; border-left-color: var(--color-neutral-strong); }
.week__task--done .week__task-title { text-decoration: line-through; }
.week__task-check {
  width: 15px; height: 15px; flex-shrink: 0; padding: 0;
  background: transparent; border: 1px solid var(--color-border-strong); cursor: pointer;
  font-size: 9px; color: var(--color-neutral-strong); display: flex; align-items: center; justify-content: center;
}
.week__task-check:hover { border-color: var(--color-neutral-strong); }
.week__task-hora { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-tertiary); flex-shrink: 0; }
.week__task { min-width: 0; }
.week__task-title { font-size: 11px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; min-width: 0; flex: 1; }
.week__col-more { font-family: var(--font-mono); font-size: 9.5px; color: var(--color-text-tertiary); text-align: center; padding: 6px 4px; cursor: pointer; width: 100%; background: transparent; border: none; border-top: 1px solid var(--color-border-subtle); margin-top: 2px; transition: color 120ms, background 120ms; }
.week__col-more:hover { color: var(--color-text-primary); background: var(--color-bg-surface-2); }

/* Mobile: semana vira scroll horizontal */
@media (max-width: 860px) {
  .week__grid {
    grid-template-columns: repeat(7, minmax(128px, 1fr));
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }
  .week__chart {
    grid-template-columns: repeat(7, minmax(34px, 1fr));
    overflow-x: auto; max-width: 100%;
  }
}

/* ── Mobile: ativa hamburger, esconde sidebar, ajusta tudo ── */
@media (max-width: 860px) {
  .sidebar { display: none; }
  .topbar__burger { display: flex; }
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar__title { display: none; }
  .ws-switch__label { display: none; }
  .ws-switch__btn { padding: 0 9px; }
  .topbar__date .date-nav__today { display: none; }
  .topbar__updated { display: none; }
  .page { padding: 18px 14px; }
  .focus__heading { font-size: 23px; }
  .focus__now-title { font-size: 20px; }
  .todo2__cols { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .topbar__search { display: none; }
  .topbar__date { display: none; }
  .sync-indicator { display: none; }
  .topbar__sep { display: none; }
  .topbar__actions { gap: 6px; margin-left: auto; }
  .topbar__cta { padding: 0 12px; }
  .topbar__cta span { display: none; }
}
@media (max-width: 560px) {
  .ws-switch { display: none; }
}

/* ════ ONBOARDING — experiência de boas-vindas em tela cheia ════ */
.onb {
  position: fixed; inset: 0; z-index: 2000;
  display: grid; grid-template-columns: 0.9fr 1.1fr;
  background: var(--color-bg-base);
  animation: onbFadeIn 480ms ease both;
}
@keyframes onbFadeIn { from { opacity: 0; } to { opacity: 1; } }
.onb--leaving { animation: onbFadeOut 420ms ease both; }
@keyframes onbFadeOut { from { opacity: 1; } to { opacity: 0; transform: scale(1.01); } }

/* ── Painel esquerdo ── */
.onb__left {
  position: relative;
  display: flex; flex-direction: column;
  padding: 64px 72px;
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,0.03), transparent 55%),
    var(--color-bg-base);
  border-right: 1px solid var(--color-border-subtle);
}
.onb__brand {
  display: flex; align-items: center; gap: 11px;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em;
  color: var(--color-text-primary);
}
.onb__brand-mark {

  <!-- ══ Conteúdo SEO (exibido a buscadores e quando o JavaScript está desativado) ══ -->
  <noscript>
  <main style="max-width:880px;margin:0 auto;padding:48px 24px;font-family:sans-serif;line-height:1.7;color:#222">
    <h1>Villares Planner — Gestor de Tarefas, Rotinas e Calendário Operacional Online</h1>
    <p>O <strong>Villares Planner</strong> é um dashboard operacional completo para <strong>gestão de tarefas, rotinas recorrentes, pedidos e prazos</strong>, criado em <strong>Bauru, interior de São Paulo, Brasil</strong>, e pensado para quem precisa organizar o dia a dia de operações com velocidade e clareza. Diferente de planilhas soltas ou aplicativos genéricos de listas, o Villares Planner nasceu dentro da rotina real de <strong>logística e business intelligence</strong>: torres de controle, fechamentos de turno, indicadores de SLA, pedidos de outras áreas e rotinas que se repetem todos os dias úteis. É uma ferramenta de produtividade construída por quem vive operação, para quem vive operação.</p>

    <h2>O que é o Villares Planner</h2>
    <p>O Villares Planner é um <strong>organizador de tarefas online e gratuito</strong>, em português do Brasil, que funciona direto no navegador — inclusive aberto localmente, sem necessidade de servidor. Ele reúne em uma única tela tudo o que um profissional de operações, um analista ou uma pequena equipe precisa para planejar o dia: <strong>painel de indicadores</strong> com taxa de conclusão, itens em andamento, vencimentos do dia e atrasados; <strong>lista de tarefas</strong> com busca global, filtros por prioridade e categoria, ordenação por urgência e visualização compacta ou detalhada; <strong>quadro Kanban</strong> com arrastar e soltar entre colunas de status; <strong>calendário</strong> com quatro modos de visualização; e <strong>notas rápidas</strong> para registrar ideias que ainda não viraram tarefa.</p>

    <h2>Rotinas recorrentes de verdade</h2>
    <p>O grande diferencial do Villares Planner está nas <strong>rotinas recorrentes por dia da semana</strong>. Ao criar uma rotina, você marca em quais dias ela deve acontecer — segunda, terça, quarta, quinta, sexta, sábado ou domingo — e o sistema cuida do resto. A rotina <strong>reaparece automaticamente</strong> em cada dia configurado, sem que você precise recriá-la manualmente. Concluir uma rotina vale apenas para o dia atual: no dia seguinte, ela volta como pendente, exatamente como uma checklist operacional deve funcionar. Conferências diárias de base, dailies, fechamentos de turno, relatórios semanais de KPI, reuniões fixas: tudo se organiza sozinho, e a taxa de conclusão acompanha o ritmo real da operação.</p>

    <h2>Tarefas com hora, prazo e prioridade</h2>
    <p>Cada tarefa pode receber <strong>hora opcional</strong>, exibida no formato 09:30 | Título | Descrição, prazo de entrega com atalhos por dia da semana ("quero isso pronto até sexta"), descrição com quebras de linha preservadas e botão "ver mais", múltiplas categorias simultâneas e quatro níveis de prioridade — <strong>Crítica, Alta, Média e Baixa</strong> — com indicadores visuais imediatos. Pedidos de outras áreas ganham campo de solicitante, permitindo enxergar quem demanda o quê e acompanhar o volume por pessoa na visão de equipe.</p>

    <h2>Calendário com Agenda, Semana, Mês e Timeline</h2>
    <p>O <strong>calendário de tarefas</strong> do Villares Planner foi projetado como ferramenta de planejamento, não como enfeite. São quatro modos: <strong>Agenda</strong>, em lista cronológica agrupada por dia; <strong>Semana</strong>, com sete colunas e os compromissos de cada dia ordenados por hora; <strong>Mês</strong>, na grade tradicional com painel detalhado do dia selecionado; e <strong>Timeline</strong>, uma linha do tempo vertical para enxergar a sequência de entregas. Uma barra de filtros real permite combinar <strong>tipo</strong> (projetos, rotinas, pedidos), <strong>status</strong> (pendente, em andamento, concluído, atrasado), <strong>prioridade</strong>, <strong>categorias com multi-seleção</strong> e <strong>período</strong> — hoje, amanhã, esta semana, próxima semana ou este mês — além de navegação rápida entre datas com botões de dia anterior, próximo dia e "ir para qualquer data".</p>

    <h2>Sincronização com Google Sheets</h2>
    <p>Os dados do Villares Planner podem viver onde sua equipe já trabalha: numa <strong>planilha do Google Sheets</strong>. A integração usa o Google Apps Script como backend gratuito — você cria a planilha, cola o script fornecido, define um token secreto e publica como Web App. Pronto: cada tarefa criada, editada ou concluída no Planner é gravada na planilha em tempo real, com colunas nomeadas em português (Id, Origem, Título, Descrição, Categoria, Prioridade, Status, Prazo, Hora, Dias da Semana, Última Conclusão e mais). Isso significa <strong>backup automático, dados auditáveis e zero dependência de servidores pagos</strong>. Sem conexão configurada, o aplicativo funciona em modo local, salvando tudo no próprio navegador.</p>

    <h2>Para quem é</h2>

// ============================================================================
// HELPERS DE STATUS
// Cada origem tem seu próprio vocabulário de status. Aqui unificamos
// em três buckets lógicos para a UI: "aberto", "andamento", "feito".
// ============================================================================

const STATUS_BUCKET = {
  // Projetos
  "Pendente":     "aberto",
  "Em Andamento": "andamento",
  "Pausado":      "aberto",
  "Concluído":    "feito",
  "Cancelado":    "feito",
  "Falha":        "falha",
  // Rotina (já tratado acima)
  // Pedidos
  "Recebido":     "aberto",
  "Recusado":     "feito",
};

// ── Rotinas recorrentes por dia da semana ──
// Uma rotina com `dias` ("Seg, Ter, Qua") reaparece automaticamente em cada
// dia configurado. Concluir só vale para o dia: `ultimaConclusao` guarda a
// última data concluída; no dia seguinte a rotina volta como pendente sozinha.
const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const splitDias = (s) => String(s || '').split(',').map(x => x.trim()).filter(Boolean);

// Dias efetivos da rotina: os marcados; ou, para rotinas antigas criadas só com
// frequência "Diária" (sem dias), todos os 7 dias — evita o modo legado por status
const diasEfetivos = (item) => {
  if (item.origem !== 'Rotina') return [];
  const d = splitDias(item.dias);
  if (d.length > 0) return d;
  if (/di[áa]ria/i.test(String(item.frequencia || ''))) return [...DIAS_SEMANA];
  return [];
};
const temDias = (item) => diasEfetivos(item).length > 0;
const rotinaNoDia = (item, date) => diasEfetivos(item).includes(DIAS_SEMANA[date.getDay()]);

// Datas 'yyyy-mm-dd' DEVEM ser interpretadas no fuso local (não UTC),
// senão tudo desloca um dia no Brasil (UTC-3)
const parseLocalDate = (v) => {
  if (v instanceof Date) return new Date(v);
  const s = String(v);
  return new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T12:00:00' : s);
};

// Data de hoje (ou de d) como 'yyyy-mm-dd' no fuso LOCAL
// (toISOString é UTC: à noite no Brasil já devolve o dia seguinte)
const localISO = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const diasAteHoje = (date) => {
  if (!date) return null;
  const d = parseLocalDate(date); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / (1000 * 60 * 60 * 24));
};

// Conclusões de rotina por DIA: lista de datas 'yyyy-mm-dd' em item.conclusoes.
// Concluir hoje afeta SÓ hoje — cada dia tem seu próprio registro.
const rotinaFeitaNoDia = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  if (Array.isArray(item.conclusoes) && item.conclusoes.includes(iso)) return true;
  // fallback legado (registros antigos em "Última Conclusão")
  if (item.ultimaConclusao) {
    const u = parseLocalDate(item.ultimaConclusao);
    const dd = parseLocalDate(d);
    return u.getFullYear() === dd.getFullYear() && u.getMonth() === dd.getMonth() && u.getDate() === dd.getDate();
  }
  return false;
};

const rotinaFeitaHoje = (item) => rotinaFeitaNoDia(item, new Date());

// Rotina EM ANDAMENTO num dia: lista item.andamentos = ['yyyy-mm-dd', ...]
const rotinaAndamentoNoDia = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  return Array.isArray(item.andamentos) && item.andamentos.includes(iso);
};
// Rotina em FALHA num dia: lista item.falhas = [{ data, categoria, motivo }, ...]
const rotinaFalhaNoDia = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  return Array.isArray(item.falhas) && item.falhas.some(f => f.data === iso);
};
const rotinaFalhaInfo = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  return Array.isArray(item.falhas) ? item.falhas.find(f => f.data === iso) : null;
};
// Estado da rotina no dia: 'feito' | 'andamento' | 'falha' | 'pendente' | 'naoprog'
const rotinaEstadoNoDia = (item, d) => {
  if (!rotinaNoDia(item, d)) return 'naoprog';
  if (rotinaFeitaNoDia(item, d)) return 'feito';
  if (rotinaFalhaNoDia(item, d)) return 'falha';
  if (rotinaAndamentoNoDia(item, d)) return 'andamento';
  return 'pendente';
};

const isAtivo = (item) => {
  if (temDias(item)) return !rotinaFeitaHoje(item);
  const b = STATUS_BUCKET[item.status];
  return b === "aberto" || b === "andamento";
};

const isFeito = (item) => {
  if (temDias(item)) return rotinaFeitaHoje(item);
  return STATUS_BUCKET[item.status] === "feito" && item.status !== "Cancelado" && item.status !== "Recusado";
};

const isFalha = (item) => !temDias(item) && item.status === "Falha";

const isAtrasado = (item) => {
  if (temDias(item)) return false; // rotina recorrente nunca "atrasa": reaparece no próximo dia
  if (!isAtivo(item) || !item.prazo) return false;
  return diasAteHoje(item.prazo) < 0;
};

const isHoje = (item) => {
  if (temDias(item)) return rotinaNoDia(item, new Date()) && isAtivo(item);
  if (!isAtivo(item) || !item.prazo) return false;
  return diasAteHoje(item.prazo) === 0;
};

// ── Estado relativo a uma DATA específica (selecionada no topo) ──
const mesmoDia = (a, b) => {
  const x = parseLocalDate(a), y = b instanceof Date ? b : parseLocalDate(b);
  return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
};
// Pertence ao dia? (rotina programada no dia, ou item com prazo naquele dia)
const noDia = (item, d) => {
  if (temDias(item)) return rotinaNoDia(item, d);
  return !!item.prazo && mesmoDia(item.prazo, d);
};
// Concluído NAQUELE dia?
const feitoNoDia = (item, d) => {
  if (temDias(item)) return rotinaFeitaNoDia(item, d);
  return isFeito(item);
};
// Ativo (pendente/andamento) NAQUELE dia?
const ativoNoDia = (item, d) => {
  if (temDias(item)) return rotinaNoDia(item, d) && !rotinaFeitaNoDia(item, d);
  return isAtivo(item) && !!item.prazo && mesmoDia(item.prazo, d);
};

const isProximos48h = (item) => {
  if (!isAtivo(item) || !item.prazo) return false;
  const d = diasAteHoje(item.prazo);
  return d >= 0 && d <= 2;
};

const isEstaSemana = (item) => {
  if (!isAtivo(item) || !item.prazo) return false;
  const d = diasAteHoje(item.prazo);
  return d >= 0 && d <= 7;
};

const isConcluidoRecente = (item) => {
  if (!isFeito(item)) return false;
  // Considera concluído nos últimos 7 dias (usa prazo como aproximação se não houver concluidoEm)
  if (item.prazo) {
    const d = diasAteHoje(item.prazo);
    return d >= -7 && d <= 0;
  }
  if (item.ultimaConclusao) {
    const d = diasAteHoje(item.ultimaConclusao);
    return d >= -7 && d <= 0;
  }
  return false;
};

const formatDate = (d) => {
  if (!d) return "—";
  const date = parseLocalDate(d);
  return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
};

const formatRelative = (d) => {
  if (!d) return "—";
  const dias = diasAteHoje(d);
  if (dias === 0) return "hoje";
  if (dias === 1) return "amanhã";
  if (dias === -1) return "ontem";
  if (dias > 0 && dias <= 6) return `em ${dias}d`;
  if (dias < 0 && dias >= -6) return `${Math.abs(dias)}d atrás`;
  return formatDate(d);
};

// Multi-categoria: armazenada como string separada por vírgula ("A, B")
const splitCats = (c) => String(c || '').split(',').map(s => s.trim()).filter(Boolean);
const hasCat = (item, cat) => splitCats(item.categoria).includes(cat);

window.PLANNER_DATA = {
  MOCK_ITEMS,
  CATEGORIAS,
  WORKSPACES, TODAS_CATEGORIAS, getWorkspace, getCategorias,
  STATUS_BUCKET,
  isAtivo, isFeito, isAtrasado, isHoje, isProximos48h, isEstaSemana, isConcluidoRecente,
  diasAteHoje, formatDate, formatRelative,
  parseLocalDate, localISO,
  splitCats, hasCat,
  DIAS_SEMANA, splitDias, diasEfetivos, temDias, rotinaNoDia, rotinaFeitaHoje, rotinaFeitaNoDia,
  rotinaAndamentoNoDia, rotinaFalhaNoDia, rotinaFalhaInfo, rotinaEstadoNoDia,
  mesmoDia, noDia, feitoNoDia, ativoNoDia, isFalha,
};

let __audioCtx = null;
const uiSoundOn = () => { try { return localStorage.getItem('villares_sound') !== 'off'; } catch { return true; } };
const playTone = (freqs, { dur = 0.12, gain = 0.12, type = 'sine' } = {}) => {
  if (!uiSoundOn()) return;
  try {
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    (Array.isArray(freqs) ? freqs : [freqs]).forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.06;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    });
  } catch {}
};
const sfx = {
  complete: () => playTone([660, 880, 1175], { dur: 0.14, gain: 0.10 }),
  add:      () => playTone([523, 784], { dur: 0.09, gain: 0.08 }),
  tick:     () => playTone(440, { dur: 0.05, gain: 0.05 }),
  remove:   () => playTone([392, 294], { dur: 0.08, gain: 0.06 }),
};

function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('ops_theme') || 'dark'; } catch { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme);
    try { localStorage.setItem('ops_theme', theme); } catch {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
}

// DONUT SVG
// ────────────────────────────────────────────────────────────────────────────
function Donut({ pct, size, stroke }) {
  const [drawn, setDrawn] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setDrawn(pct), 80);
    return () => clearTimeout(t);
  }, [pct]);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (drawn / 100) * c;
  const color = drawn >= 70 ? 'var(--color-positive)'
              : drawn >= 40 ? 'var(--color-warning)'
              : drawn > 0   ? 'var(--color-negative)'
              : 'var(--color-text-quaternary)';
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)', display: 'block' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
              stroke="var(--color-bg-surface-3)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
              stroke={color} strokeWidth={stroke}
              strokeDasharray={c} strokeDashoffset={off}
              style={{ transition: 'stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1), stroke 250ms' }}/>
    </svg>
  );
}

          </div>
        </div>
      </div>

      <div className="cat-breakdown fade-up">
        <div className="cat-breakdown__header">
          <div className="cat-breakdown__title">
            <Layers size={11}/>
            Conclusão por categoria
          </div>
          {categorias.length > 5 && (
            <button className="cat-breakdown__toggle" onClick={() => setShowAll(v => !v)}>
              {showAll ? 'Ver menos' : `Ver todas (${categorias.length})`}
            </button>
          )}
        </div>
        {categorias.length === 0 ? (
          <div style={{ padding: '20px 0', textAlign: 'center', color: 'var(--color-text-tertiary)', fontFamily: 'var(--font-mono)', fontSize: 11 }}>
            Sem dados disponíveis
          </div>
        ) : (
          <div className="cat-breakdown__grid">
            {(showAll ? categorias : categorias.slice(0, 5)).map(c => (
              <div key={c.nome} className="cat-tile">
                <div className="cat-tile__top">
                  <div className="cat-tile__name" title={c.nome}>{c.nome}</div>
                  <div className="cat-tile__pct">{Math.round(c.pct)}%</div>
                </div>
                <div className="cat-tile__bar">
                  <div className={`cat-tile__bar-fill ${c.pct < 30 && c.total > 0 ? 'cat-tile__bar-fill--critical' : ''}`}
                       style={{ width: `${c.pct}%` }}/>
                </div>
                <div className="cat-tile__ratio">{c.feitos} de {c.total} Concluídos</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// TABS (estilo Mercado Livre)
// ────────────────────────────────────────────────────────────────────────────
function Tabs({ active, onChange, counts, selDate }) {
  const isTodaySel = D.diasAteHoje(selDate) === 0;
  const dateLabel = isTodaySel ? 'Hoje'
    : `${D.DIAS_SEMANA[selDate.getDay()]} ${String(selDate.getDate()).padStart(2, '0')}/${String(selDate.getMonth() + 1).padStart(2, '0')}`;
  const tabs = [
    { key: 'Hoje', label: dateLabel },
    { key: 'Todos', label: 'Todos' },
    { key: 'Projeto', label: 'Projetos' },
    { key: 'Rotina', label: 'Rotina' },
    { key: 'Pedido', label: 'Pedidos' },
    { key: 'Atrasados', label: 'Atrasados' },
    { key: 'Concluidos', label: 'Concluídos' },
  ];
  return (
    <div className="tabs">
      {tabs.map(t => (
        <button key={t.key}
                className={`tab ${active === t.key ? 'tab--active' : ''}`}
                onClick={() => onChange(t.key)}>
          {t.label}
          <span className="tab__count">{counts[t.key] || 0}</span>
        </button>
      ))}
{/* seletor de data na Topbar */}
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// TOOLBAR (search + sort + filter + count)
// ────────────────────────────────────────────────────────────────────────────
const SORT_OPTIONS = [
  { key: null,         label: 'Urgência' },
  { key: 'hora',       label: 'Hora' },
  { key: 'prazo',      label: 'Prazo' },
  { key: 'titulo',     label: 'Título' },
  { key: 'prioridade', label: 'Prioridade' },
  { key: 'status',     label: 'Status' },
  { key: 'criadoEm',   label: 'Criado em' },
];

function ToolbarDropdown({ icon: IconC, label, value, open, onToggle, children }) {
  return (
    <div className="dropdown">
      <button className="toolbar__select" onClick={onToggle}>
        <IconC size={13}/>
        <span className="toolbar__select-label">{label}:</span>
        <span>{value}</span>
        <Chevron size={12}/>
      </button>
      {open && (
        <div className="dropdown__menu dropdown__menu--left">
          {children}
        </div>
      )}
    </div>
  );
}

function Toolbar({ count, sortBy, onSortSelect, prio, onPrio, cat, onCat, density, onToggleDensity, catList = D.CATEGORIAS }) {
  const [openMenu, setOpenMenu] = useState(null); // 'sort' | 'prio' | 'cat' | null

  useEffect(() => {
    if (!openMenu) return;
    const onClick = (e) => { if (!e.target.closest('.dropdown')) setOpenMenu(null); };
    const onKey = (e) => { if (e.key === 'Escape') setOpenMenu(null); };
    const t = setTimeout(() => {
      document.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);
    }, 0);
    return () => {
      clearTimeout(t);
      document.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [openMenu]);

  const toggle = (m) => setOpenMenu(prev => prev === m ? null : m);
  const sortLabel = (SORT_OPTIONS.find(o => o.key === sortBy) || SORT_OPTIONS[0]).label;

  return (
    <div className="toolbar">
      <ToolbarDropdown icon={SortIcon} label="Ordenar" value={sortLabel}
                       open={openMenu === 'sort'} onToggle={() => toggle('sort')}>
        {SORT_OPTIONS.map(o => (
          <button key={String(o.key)}
                  className={`dropdown__item ${sortBy === o.key ? 'dropdown__item--active' : ''}`}
                  onClick={() => { onSortSelect(o.key); setOpenMenu(null); }}>
            {o.label}
            {sortBy === o.key && <span className="dropdown__check">■</span>}
          </button>
        ))}
      </ToolbarDropdown>

      <ToolbarDropdown icon={FilterIcon} label="Prioridade" value={prio}
                       open={openMenu === 'prio'} onToggle={() => toggle('prio')}>
        {['Todas', 'Crítica', 'Alta', 'Média', 'Baixa'].map(p => (
          <button key={p}
                  className={`dropdown__item ${prio === p ? 'dropdown__item--active' : ''}`}
                  onClick={() => { onPrio(p); setOpenMenu(null); }}>
            {p}
            {prio === p && <span className="dropdown__check">■</span>}
          </button>
        ))}
      </ToolbarDropdown>

      <ToolbarDropdown icon={Layers} label="Categoria" value={cat}
                       open={openMenu === 'cat'} onToggle={() => toggle('cat')}>
        {['Todas', ...catList].map(c => (
          <button key={c}
                  className={`dropdown__item ${cat === c ? 'dropdown__item--active' : ''}`}
                  onClick={() => { onCat(c); setOpenMenu(null); }}>
            {c}
            {cat === c && <span className="dropdown__check">■</span>}
          </button>
        ))}
      </ToolbarDropdown>

      <button className="toolbar__select" onClick={onToggleDensity}
              title={density === 'compacta' ? 'Mudar para lista detalhada' : 'Mudar para lista compacta'}>
        <Layers size={13}/>
        <span>{density === 'compacta' ? 'Compacta' : 'Detalhada'}</span>
      </button>
      <span className="toolbar__count">{count} {count === 1 ? 'Item' : 'Itens'}</span>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// LIST ROW
// ────────────────────────────────────────────────────────────────────────────
function statusKey(status) {
  if (status === 'Falha') return 'falha';
  return {
    'Pendente': 'pendente', 'Recebido': 'pendente',
    'Em Andamento': 'andamento',
    'Pausado': 'pausado',
    'Concluído': 'concluido',
    'Bloqueado': 'bloqueado',
    'Cancelado': 'pendente', 'Recusado': 'pendente',
  }[status] || 'pendente';
}

function RowDesc({ text }) {
  const [expanded, setExpanded] = useState(false);
  const long = text.length > 140 || text.split('\n').length > 2;
  return (
    <div className="list-row__desc-wrap">
      <div className={`list-row__desc ${expanded ? 'list-row__desc--expanded' : ''}`}>{text}</div>
      {long && (
        <button className="list-row__desc-toggle"
                onClick={(e) => { e.stopPropagation(); setExpanded(v => !v); }}>
          {expanded ? 'Ver menos' : 'Ver mais'}
        </button>
      )}
    </div>
  );
}

function ListRow({ item, occDate, menuOpen, onMenuToggle, onEdit, onToggleComplete, onDuplicate, onDelete, onMarkFalha, onClearFalha, onSetAndamento }) {
  const origemClass = item.origem === 'Projeto' ? 'projeto'
                    : item.origem === 'Rotina'  ? 'rotina' : 'pedido';
  const origemLetter = item.origem === 'Projeto' ? 'PJ'
                     : item.origem === 'Rotina'  ? 'RT' : 'PD';

  // — Coluna "Recebido em" (data de criação) —
  const criadoEm = item.criadoEm || item.recebidoEm;
  const criadoDate = criadoEm
    ? D.parseLocalDate(criadoEm).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')
    : null;
  const criadoDias = criadoEm ? D.diasAteHoje(criadoEm) : null;
  const criadoSub = criadoDias === null ? null
    : criadoDias === 0 ? 'Hoje'
    : criadoDias === -1 ? 'Ontem'
    : criadoDias < 0 ? `há ${Math.abs(criadoDias)} dias`
    : `em ${criadoDias} dias`;

  // — Coluna "Prazo" —
  const isLate = D.isAtrasado(item);
  const isToday = D.isHoje(item);
  const prazoDate = item.prazo
    ? new Date(item.prazo).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')
    : null;
  const prazoDias = item.prazo ? D.diasAteHoje(item.prazo) : null;
  const prazoSub = prazoDias === null ? null
    : prazoDias === 0 ? 'Hoje'
    : prazoDias === 1 ? 'Amanhã'
    : prazoDias < 0 ? `${Math.abs(prazoDias)} dias atrás`
    : `em ${prazoDias} dias`;
  const prazoPrimaryCls = isLate ? 'date-cell__primary--late'
                        : isToday ? 'date-cell__primary--today' : '';
  const prazoSubCls = isLate ? 'date-cell__sub--late' : '';

  // Para rotinas recorrentes, o estado exibido é o da DATA da ocorrência
  const dia = occDate || new Date();
  const recorrente = D.temDias(item);
  const programada = recorrente ? D.rotinaNoDia(item, dia) : true;
  const feitaNoDia = recorrente ? D.rotinaFeitaNoDia(item, dia) : D.isFeito(item);
  const ehHoje = D.diasAteHoje(dia) === 0;
  // Estado por-dia da rotina: feito | andamento | falha | pendente | naoprog
  const rotEstado = recorrente ? D.rotinaEstadoNoDia(item, dia) : null;
  const rotAndamento = recorrente && rotEstado === 'andamento';
  const rotFalha = recorrente && rotEstado === 'falha';
  const rotFalhaInfo = rotFalha ? D.rotinaFalhaInfo(item, dia) : null;
  const statusK = recorrente
    ? (rotEstado === 'feito' ? 'feito'
       : rotEstado === 'andamento' ? 'andamento'
       : rotEstado === 'falha' ? 'falha'
       : rotEstado === 'naoprog' ? 'pausado' : 'aberto')
    : statusKey(item.status);
  const isFeito = feitaNoDia;

  return (
    <div className={`list-row fade-up ${menuOpen ? 'list-row--menu-open' : ''}`}>
      <div className={`list-row__origem list-row__origem--${origemClass}`}>{origemLetter}</div>

      <div className="list-row__hora-cell">
        {item.hora ? item.hora : <span className="list-row__hora-none">—</span>}
      </div>

      <div className="list-row__main">
        <div className="list-row__title">
          {item.titulo}
        </div>
        {item.descricao && <RowDesc text={item.descricao}/>}
        {!recorrente && item.status === 'Falha' && item.falhaMotivo && (
          <div className="list-row__falha-motivo" title={item.falhaMotivo}>
            {item.falhaCategoria ? `${item.falhaCategoria}: ` : ''}{item.falhaMotivo}
          </div>
        )}
        {recorrente && rotFalha && rotFalhaInfo && rotFalhaInfo.motivo && (
          <div className="list-row__falha-motivo" title={rotFalhaInfo.motivo}>
            {rotFalhaInfo.categoria ? `${rotFalhaInfo.categoria}: ` : ''}{rotFalhaInfo.motivo}
          </div>
        )}
        <div className="list-row__sub">
          <span>{item.origem}</span>
          {item.solicitante && (
            <>
              <span className="list-row__sub-dot"/>
              <span>de {item.solicitante}</span>
            </>
          )}
          {D.temDias(item) ? (
            <>
              <span className="list-row__sub-dot"/>
              <span>{item.dias}</span>
            </>
          ) : item.frequencia && (
            <>
              <span className="list-row__sub-dot"/>
              <span>{item.frequencia}</span>
            </>
          )}
        </div>
      </div>

      <div className="tag-cat" title={item.categoria}>{item.categoria}</div>

      <div>
        {item.prioridade === 'Crítica' && <span className="tag-prio tag-prio--critica">Crítica</span>}
        {item.prioridade === 'Alta' && <span className="tag-prio tag-prio--alta">Alta</span>}
        {item.prioridade === 'Média' && <span className="tag-prio tag-prio--media">Média</span>}
        {item.prioridade === 'Baixa' && <span className="tag-prio">Baixa</span>}
      </div>

      <div className="date-cell">
        {criadoDate ? (
          <>
            <span className="date-cell__primary">{criadoDate}</span>
            <span className="date-cell__sub">{criadoSub}</span>
          </>
        ) : (
          <span className="date-cell__none">—</span>
        )}
      </div>

      <div className="date-cell">
        {prazoDate ? (
          <>
            <span className={`date-cell__primary ${prazoPrimaryCls}`}>{prazoDate}</span>
            <span className={`date-cell__sub ${prazoSubCls}`}>{prazoSub}</span>
          </>
        ) : (
          <span className="date-cell__none">Sem prazo</span>
        )}
      </div>

      <div>
        <div className={`status status--${statusK}`}>
          <span className="status__dot"/>
          <span>{recorrente
            ? (rotEstado === 'feito' ? 'Concluído'
               : rotEstado === 'andamento' ? 'Em Andamento'
               : rotEstado === 'falha' ? 'Falha'
               : rotEstado === 'naoprog' ? 'Não programada' : 'Pendente')
            : item.status}</span>
        </div>
      </div>

      <div className="dropdown">
        <button className="list-row__action" title="Mais ações"
                onClick={(e) => { e.stopPropagation(); onMenuToggle(item.id); }}>
          <More size={14}/>
        </button>
        {menuOpen && (
          <div className="dropdown__menu" onClick={(e) => e.stopPropagation()}>
            <button className="dropdown__item" onClick={() => { onEdit(item); onMenuToggle(null); }}>
              <Edit size={14}/> Editar
            </button>
            {(!recorrente || programada || feitaNoDia) && (
            <button className="dropdown__item" onClick={() => { onToggleComplete(item, dia); onMenuToggle(null); }}>
              {recorrente
                ? (feitaNoDia
                    ? <><Undo size={14}/> Reabrir {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]} ${String(dia.getDate()).padStart(2, '0')}/${String(dia.getMonth() + 1).padStart(2, '0')})`}</>
                    : <><CheckDouble size={14}/> Concluir {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]} ${String(dia.getDate()).padStart(2, '0')}/${String(dia.getMonth() + 1).padStart(2, '0')})`}</>)
                : (isFeito ? <><Undo size={14}/> Reabrir</> : <><CheckDouble size={14}/> Marcar Concluído</>)}
            </button>
            )}
            {/* EM ANDAMENTO — tarefas e rotinas (rotina: por dia, só se programada) */}
            {!recorrente
              ? (item.status !== 'Em Andamento' && !isFeito && item.status !== 'Falha' && (
                  <button className="dropdown__item dropdown__item--andamento" onClick={() => { onSetAndamento(item); onMenuToggle(null); }}>
                    <Loader size={14}/> Marcar em andamento
                  </button>
                ))
              : (programada && !feitaNoDia && (
                  rotAndamento
                    ? <button className="dropdown__item dropdown__item--andamento" onClick={() => { onSetAndamento(item, dia); onMenuToggle(null); }}>
                        <Undo size={14}/> Tirar de andamento {ehHoje ? '' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                    : <button className="dropdown__item dropdown__item--andamento" onClick={() => { onSetAndamento(item, dia); onMenuToggle(null); }}>
                        <Loader size={14}/> Em andamento {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                ))}
            {/* FALHA — tarefas e rotinas (rotina: por dia) */}
            {!recorrente
              ? (item.status === 'Falha'
                  ? <button className="dropdown__item" onClick={() => { onClearFalha(item); onMenuToggle(null); }}>
                      <Undo size={14}/> Desfazer falha
                    </button>
                  : <button className="dropdown__item dropdown__item--warn" onClick={() => { onMarkFalha(item); onMenuToggle(null); }}>
                      <Warning size={14}/> Marcar falha
                    </button>)
              : (programada && (
                  rotFalha
                    ? <button className="dropdown__item" onClick={() => { onClearFalha(item, dia); onMenuToggle(null); }}>
                        <Undo size={14}/> Desfazer falha {ehHoje ? '' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                    : <button className="dropdown__item dropdown__item--warn" onClick={() => { onMarkFalha(item, dia); onMenuToggle(null); }}>
                        <Warning size={14}/> Marcar falha {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                ))}
            <button className="dropdown__item" onClick={() => { onDuplicate(item); onMenuToggle(null); }}>
              <Copy size={14}/> Duplicar
            </button>
            <div className="dropdown__divider"/>
            <button className="dropdown__item dropdown__item--danger" onClick={() => { onDelete(item); onMenuToggle(null); }}>
              <Trash size={14}/> Excluir
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Ícone seta pra sort
const SortArrow = (p) => <Icon {...p}><path d="M12 5v14M5 12l7 7 7-7"/></Icon>;

function StatusBar({ items, selDate, onJump }) {
  // Distribuição dos itens visíveis por estado (relativo à data)
  const buckets = useMemo(() => {
    let pend = 0, prog = 0, feito = 0, falha = 0;
    items.forEach(it => {
      if (D.temDias(it)) {
        if (!D.rotinaNoDia(it, selDate)) return;
        if (D.rotinaFeitaNoDia(it, selDate)) feito++;
        else if (it.status === 'Em Andamento') prog++;
        else pend++;
      } else {
        if (it.status === 'Falha') falha++;
        else if (D.isFeito(it)) feito++;
        else if (it.status === 'Em Andamento') prog++;
        else pend++;
      }
    });
    return { pend, prog, feito, falha };
  }, [items, selDate]);

  const total = buckets.pend + buckets.prog + buckets.feito + buckets.falha;
  if (total === 0) return null;

  const segs = [
    { key: 'pend',  label: 'Pendentes',    val: buckets.pend,  cls: 'statusbar__seg--pend' },
    { key: 'prog',  label: 'Em andamento', val: buckets.prog,  cls: 'statusbar__seg--prog' },
    { key: 'feito', label: 'Concluídos',   val: buckets.feito, cls: 'statusbar__seg--feito' },
    { key: 'falha', label: 'Falhas',       val: buckets.falha, cls: 'statusbar__seg--falha' },
  ].filter(s => s.val > 0);

  const pctFeito = Math.round((buckets.feito / total) * 100);
  return (
    <div className="statusbar fade-up">
      <div className="statusbar__top">
        <span className="statusbar__heading">Resumo do dia</span>
        <span className="statusbar__total"><b>{pctFeito}%</b> concluído · {total} {total === 1 ? 'item' : 'itens'}</span>
      </div>
      <div className="statusbar__track">
        {segs.map(s => (
          <div key={s.key} className={`statusbar__seg ${s.cls}`}
               style={{ flexGrow: s.val }}
               title={`${s.val} ${s.label}`}/>
        ))}
      </div>
      <div className="statusbar__legend">
        {segs.map(s => (
          <span key={s.key} className="statusbar__item">
            <span className={`statusbar__dot statusbar__dot--${s.key}`}/>
            <span className="statusbar__num">{s.val}</span>
            <span className="statusbar__meta">
              <span className="statusbar__label">{s.label}</span>
            </span>
          </span>
        ))}
      </div>
    </div>
  );
}

function ListHeader({ sortBy, sortDir, onSort }) {
  const cell = (key, label) => {
    const active = sortBy === key;
    const cls = `list-header__cell ${active ? 'list-header__cell--active' : ''} ${active && sortDir === 'desc' ? 'list-header__cell--desc' : ''}`;
    return (
      <button className={cls} onClick={() => onSort(key)}>
        {label}
        <SortArrow size={11} className="list-header__cell-icon"/>
      </button>
    );
  };
  return (
    <div className="list-header">
      <div/>
      {cell('hora', 'Hora')}
      {cell('titulo', 'Item')}
      {cell('categoria', 'Categoria')}
      {cell('prioridade', 'Prioridade')}
      {cell('criadoEm', 'Recebido em')}
      {cell('prazo', 'Prazo')}
      {cell('status', 'Status')}
      <div/>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// ASIDE: Próximos vencimentos + Categorias
// ────────────────────────────────────────────────────────────────────────────
function UpcomingPanel({ items }) {
  return (
    <div className="aside-panel">
      <div className="aside-panel__title">
        <Cal size={11}/>
        Próximos vencimentos
        <span className="aside-panel__title-meta">Próximos 7 dias</span>
      </div>
      {items.length === 0 ? (
        <div style={{ padding: '20px 0', textAlign: 'center', color: 'var(--color-text-tertiary)', fontFamily: 'var(--font-mono)', fontSize: 11 }}>
          Sem vencimentos próximos
        </div>
      ) : (
        <div className="upcoming">
          {items.map(item => {
            const dias = D.diasAteHoje(item.prazo);
            const isLate = dias < 0;
            const isToday = dias === 0;
            const cls = isLate ? 'upcoming-row__date--late' : isToday ? 'upcoming-row__date--today' : '';
            const lbl = isLate ? `${Math.abs(dias)}d atrás`
                      : isToday ? 'Hoje'
                      : dias === 1 ? 'Amanhã'
                      : `Em ${dias}d`;
            const origemCls = item.origem === 'Projeto' ? 'projeto'
                            : item.origem === 'Rotina'  ? 'rotina' : 'pedido';
            return (
              <div key={item.id} className="upcoming-row">
                <div className={`upcoming-row__date ${cls}`}>{lbl}</div>
                <div style={{ minWidth: 0 }}>
                  <div className="upcoming-row__title">{item.titulo}</div>
                  <div className="upcoming-row__cat">{item.categoria}</div>
                </div>
                <div className={`upcoming-row__origem upcoming-row__origem--${origemCls}`}>
                  {item.origem}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function CategoriesPanel({ data }) {
  return (
    <div className="aside-panel">
      <div className="aside-panel__title">
        <Layers size={11}/>
        Progresso por categoria
        <span className="aside-panel__title-meta">{data.length} Ativas</span>
      </div>
      {data.length === 0 ? (
        <div style={{ padding: '20px 0', textAlign: 'center', color: 'var(--color-text-tertiary)', fontFamily: 'var(--font-mono)', fontSize: 11 }}>
          Sem dados disponíveis
        </div>
      ) : (
        <div className="cat-list">
          {data.slice(0, 6).map(row => {
            const variant = row.pct >= 70 ? 'positive'
                          : row.pct >= 40 ? 'warning'
                          : row.pct > 0   ? 'negative' : '';
            return (
              <div key={row.nome}>
                <div className="cat-row__head">
                  <div>
                    <span className="cat-row__name">{row.nome}</span>
                    <span className="cat-row__ratio">{row.feitos}/{row.total}</span>
                  </div>
                  <span className="cat-row__pct">{Math.round(row.pct)}%</span>
                </div>
                <div className="bar">
                  <div className={`bar__fill ${variant ? 'bar__fill--' + variant : ''}`}
                       style={{ width: `${row.pct}%` }}/>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
