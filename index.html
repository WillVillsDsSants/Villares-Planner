// ITEM MODAL — criar/editar item
// ────────────────────────────────────────────────────────────────────────────
function ItemModal({ open, item, onClose, onSave }) {
  const isEdit = !!item;
  const todayISO = new Date().toISOString().slice(0, 10);

  const [origem, setOrigem] = useState('Projeto');
  const [titulo, setTitulo] = useState('');
  const [descricao, setDescricao] = useState('');
  const wsCats = D.getCategorias();
  const [categorias, setCategorias] = useState([wsCats[0]]);
  const [prioridade, setPrioridade] = useState('Média');
  const [status, setStatus] = useState('Pendente');
  const [prazo, setPrazo] = useState('');
  const [hora, setHora] = useState('');
  const [solicitante, setSolicitante] = useState('');
  const [frequencia, setFrequencia] = useState('Diária');
  const [dias, setDias] = useState(['Seg', 'Ter', 'Qua', 'Qui', 'Sex']);
  const [error, setError] = useState('');

  // Reset state quando abre / muda item
  useEffect(() => {
    if (!open) return;
    setOrigem(item?.origem || 'Projeto');
    setTitulo(item?.titulo || '');
    setDescricao(item?.descricao || '');
    const cats = D.splitCats(item?.categoria);
    setCategorias(cats.length > 0 ? cats : [wsCats[0]]);
    setPrioridade(item?.prioridade || 'Média');
    setStatus(item?.status || (item?.origem === 'Pedido' ? 'Recebido' : 'Pendente'));
    setPrazo(item?.prazo ? String(item.prazo).slice(0, 10) : '');
    setHora(item?.hora || '');
    setSolicitante(item?.solicitante || '');
    setFrequencia(item?.frequencia || 'Diária');
    const d = D.splitDias(item?.dias);
    setDias(d.length > 0 ? d : ['Seg', 'Ter', 'Qua', 'Qui', 'Sex']);
    setError('');
  }, [open, item]);

  // Quando muda origem, ajusta status default e limpa campos específicos
  useEffect(() => {
    if (!open || isEdit) return;
    if (origem === 'Pedido') setStatus('Recebido');
    else if (origem === 'Rotina') setStatus('Pendente');
    else setStatus('Pendente');
  }, [origem, open, isEdit]);

  // ESC fecha
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!open) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!titulo.trim()) {
      setError('O título é obrigatório');
      return;
    }
    if (categorias.length === 0) {
      setError('Selecione ao menos uma categoria');
      return;
    }
    if (origem === 'Rotina' && dias.length === 0) {
      setError('Selecione ao menos um dia da semana para a rotina');
      return;
    }
    const data = {
      origem,
      titulo: titulo.trim(),
      descricao: descricao.trim() || undefined,
      categoria: categorias.join(', '),
      prioridade,
      status,
      criadoEm: item?.criadoEm || todayISO,
    };
    if (prazo) data.prazo = prazo;
    if (hora) data.hora = hora;
    if (origem === 'Rotina') data.dias = dias.join(', ');
    if (origem === 'Pedido') {
      if (solicitante.trim()) data.solicitante = solicitante.trim();
      data.recebidoEm = item?.recebidoEm || todayISO;
    }
    if (origem === 'Rotina' && item?.frequencia) {
      data.frequencia = frequencia; // preserva valor legado ao editar
    }
    if (origem === 'Projeto' && item?.progresso !== undefined) {
      data.progresso = item.progresso;
    }
    onSave(data);
  };

  const statusOpts = origem === 'Pedido'
    ? ['Recebido', 'Em Andamento', 'Concluído', 'Falha', 'Recusado']
    : origem === 'Rotina'
      ? ['Pendente', 'Em Andamento', 'Concluído', 'Falha']
      : ['Pendente', 'Em Andamento', 'Pausado', 'Bloqueado', 'Concluído', 'Falha', 'Cancelado'];

  return (
    <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal modal--form">
        <header className="modal__header">
          <div className="modal__title">{isEdit ? 'Editar item' : 'Novo item'}</div>
          <button type="button" className="modal__close" onClick={onClose} title="Fechar">
            <X size={16}/>
          </button>
        </header>

        <form onSubmit={handleSubmit}>
          <div className="modal__body">
            {/* Origem */}
            <div className="form-section__title">Identificação</div>
            <div className="form-group">
              <label className="form-group__label">Origem</label>
              <div className="form-segmented">
                {['Projeto', 'Rotina', 'Pedido'].map(o => (
                  <button key={o} type="button"
                          className={`form-segmented__item ${origem === o ? 'form-segmented__item--active' : ''}`}
                          onClick={() => setOrigem(o)}>
                    {o}
                  </button>
                ))}
              </div>
            </div>

            {/* Título */}
            <div className="form-group">
              <label className="form-group__label">
                Título<span className="form-group__label-req">*</span>
              </label>
              <input type="text" className="form-input" value={titulo}
                     onChange={(e) => { setTitulo(e.target.value); setError(''); }}
                     placeholder="Ex: Revisar tabela de fretes regional Sul"
                     autoFocus/>
              {error && <div className="form-group__hint" style={{ color: 'var(--color-critical)' }}>{error}</div>}
            </div>

            {/* Descrição */}
            <div className="form-group">
              <label className="form-group__label">Descrição</label>
              <textarea className="form-textarea" value={descricao}
                        onChange={(e) => setDescricao(e.target.value)}
                        placeholder="Detalhes adicionais (opcional)"
                        rows={2}/>
            </div>

            <div className="form-section__title form-section__title--gap">Classificação</div>

            {/* Categorias (multi-seleção) */}
            <div className="form-group">
              <label className="form-group__label">
                Categorias <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· Selecione uma ou mais</span>
              </label>
              <div className="form-chips">
                {wsCats.map(c => {
                  const active = categorias.includes(c);
                  return (
                    <button key={c} type="button"
                            className={`form-chip ${active ? 'form-chip--active' : ''}`}
                            onClick={() => setCategorias(prev =>
                              active ? prev.filter(x => x !== c) : [...prev, c]
                            )}>
                      <span className="form-chip__mark">{active ? '■' : '□'}</span>
                      {c}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Prioridade */}
            <div className="form-row">
              <div className="form-group">
                <label className="form-group__label">Prioridade</label>
                <div className="form-segmented">
                  {['Crítica', 'Alta', 'Média', 'Baixa'].map(p => (
                    <button key={p} type="button"
                            className={`form-segmented__item ${prioridade === p ? 'form-segmented__item--active' : ''}`}
                            onClick={() => setPrioridade(p)}>
                      {p}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="form-section__title form-section__title--gap">Agendamento</div>

            {/* Status + Hora (opcional) */}
            <div className="form-row">
              <div className="form-group">
                <label className="form-group__label">Status</label>
                <select className="form-select" value={status}
                        onChange={(e) => setStatus(e.target.value)}>
                  {statusOpts.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-group__label">
                  Hora <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· Opcional</span>
                </label>
                <input type="time" className="form-input" value={hora}
                       onChange={(e) => setHora(e.target.value)}/>
              </div>
            </div>

            {/* Rotina: dias da semana em que se repete */}
            {origem === 'Rotina' && (
              <div className="form-group">
                <label className="form-group__label">
                  Dias da semana <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· A rotina reaparece automaticamente nesses dias</span>
                </label>
                <div className="day-chips">
                  {['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(d => {
                    const active = dias.includes(d);
                    return (
                      <button key={d} type="button"
                              className={`day-chip ${active ? 'day-chip--active' : ''}`}
                              onClick={() => setDias(prev =>
                                active ? prev.filter(x => x !== d) : [...prev, d]
                              )}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Prazo com atalho de dia da semana */}
            {origem !== 'Rotina' && (
              <div className="form-group">
                <label className="form-group__label">
                  Prazo de entrega <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· Ou escolha o dia abaixo</span>
                </label>
                <input type="date" className="form-input" value={prazo}
                       onChange={(e) => setPrazo(e.target.value)}/>
                <div className="day-chips" style={{ marginTop: 6 }}>
                  {['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map((d, i) => {
                    const targetDow = (i + 1) % 7; // Seg=1 ... Dom=0
                    const selDow = prazo ? new Date(prazo + 'T12:00:00').getDay() : null;
                    return (
                      <button key={d} type="button"
                              className={`day-chip ${selDow === targetDow ? 'day-chip--active' : ''}`}
                              title={`Próxima ${d === 'Sáb' || d === 'Dom' ? '' : ''}${d}`}
                              onClick={() => {
                                const t = new Date(); t.setHours(12, 0, 0, 0);
                                const diff = (targetDow - t.getDay() + 7) % 7 || 7;
                                t.setDate(t.getDate() + (D.DIAS_SEMANA[t.getDay()] === d ? 0 : diff));
                                setPrazo(t.toISOString().slice(0, 10));
                              }}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Campos específicos */}
            {origem === 'Pedido' && (
              <div className="form-group">
                <label className="form-group__label">Solicitante</label>
                <input type="text" className="form-input" value={solicitante}
                       onChange={(e) => setSolicitante(e.target.value)}
                       placeholder="Ex: Gestor, Cliente interno, Outra área"/>
              </div>
            )}
          </div>

          <footer className="modal__footer">
            <button type="button" className="btn" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn btn--primary">
              {isEdit ? 'Salvar alterações' : 'Adicionar item'}
            </button>
          </footer>
        </form>
      </div>
    </div>
  );
}

function Onboarding({ onFinish }) {
  const [step, setStep] = useState(0);
  const [leaving, setLeaving] = useState(false);
  const total = ONBOARDING_STEPS.length;
  const s = ONBOARDING_STEPS[step];
  const IconC = ONB_ICONS[s.icon] || Layers;
  const last = step === total - 1;

  const go = (n) => { if (n >= 0 && n < total) setStep(n); };
  const avancar = () => last ? sair() : go(step + 1);
  const sair = () => { setLeaving(true); setTimeout(onFinish, 420); };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') sair();
      else if (e.key === 'ArrowRight' || e.key === 'Enter') avancar();
      else if (e.key === 'ArrowLeft') go(step - 1);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [step]);

  return (
    <div className={`onb ${leaving ? 'onb--leaving' : ''}`}>
      {/* Painel esquerdo — editorial */}
      <div className="onb__left">
        <div className="onb__brand">
          <span className="onb__brand-mark">
            <Icon size={16}><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></Icon>
          </span>
          VILLARES<span className="onb__brand-sep"> | </span>PLANNER
        </div>

        <div className="onb__left-body" key={step}>
          <div className="onb__index">
            <span className="onb__index-num">{String(step + 1).padStart(2, '0')}</span>
            <span className="onb__index-sep">/</span>
            <span className="onb__index-total">{String(total).padStart(2, '0')}</span>
          </div>
          <div className="onb__tag">{s.tag}</div>
          <h1 className="onb__title">{s.title}</h1>
          <p className="onb__text">{s.text}</p>
        </div>

        <div className="onb__footer">
          <div className="onb__nav">
            <div className="onb__dots">
              {ONBOARDING_STEPS.map((_, i) => (
                <button key={i}
                        className={`onb__dot ${i === step ? 'onb__dot--active' : ''} ${i < step ? 'onb__dot--done' : ''}`}
                        onClick={() => go(i)} aria-label={`Passo ${i + 1}`}/>
              ))}
            </div>
            <div className="onb__actions">
              {step > 0 && <button className="onb__btn onb__btn--ghost" onClick={() => go(step - 1)}>Voltar</button>}
              <button className="onb__btn onb__btn--primary" onClick={avancar}>
                {last ? 'Entrar no Planner' : 'Avançar'}
                {!last && <span className="onb__btn-arrow">→</span>}
              </button>
            </div>
          </div>
          <button className="onb__skip" onClick={sair}>Pular apresentação</button>
        </div>
      </div>

      {/* Painel direito — visual */}
      <div className="onb__right" key={'v' + step}>
        <div className="onb__stage">
          <div className="onb__rings">
            <span className="onb__ring onb__ring--1"/>
            <span className="onb__ring onb__ring--2"/>
            <span className="onb__ring onb__ring--3"/>
          </div>
          <div className="onb__grid-bg"/>
          <div className="onb__icon-wrap">
            <div className="onb__icon"><IconC size={44}/></div>
            <div className="onb__icon-glow"/>
          </div>
        </div>
        <div className="onb__progress"><div className="onb__progress-fill" style={{ width: `${((step + 1) / total) * 100}%` }}/></div>
      </div>
    </div>
  );
}

    if (open) { setMotivo(item?.falhaMotivo || ''); setCategoria(item?.falhaCategoria || 'Bloqueio externo'); }

  if (!open) return null;

  const CATEGORIAS_FALHA = [
    'Bloqueio externo', 'Falta de tempo', 'Dependência não entregue',
    'Erro técnico', 'Falta de informação', 'Repriorizado', 'Outro',
  ];

  return (
    <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal" style={{ width: 480 }}>
        <header className="modal__header">
          <div className="modal__title">Registrar falha</div>
          <button type="button" className="modal__close" onClick={onCancel} title="Fechar"><X size={16}/></button>
        </header>
        <div className="modal__body" style={{ padding: '22px 26px' }}>
          <div className="help-block" style={{ marginBottom: 18 }}>

          </div>
          <div className="form-group">
            <label className="form-group__label">Tipo de falha</label>
            <select className="form-select" value={categoria} onChange={(e) => setCategoria(e.target.value)}>
              {CATEGORIAS_FALHA.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-group__label">O que aconteceu? <span style={{ color: 'var(--color-critical)' }}>*</span></label>
            <textarea className="form-textarea" rows={4}
                      placeholder="Ex: A transportadora não enviou os dados a tempo; reagendado para amanhã."
                      value={motivo} onChange={(e) => setMotivo(e.target.value)}/>
          </div>
        </div>
        <footer className="modal__footer">
          <button className="btn" onClick={onCancel}>Cancelar</button>
          <button className="btn btn--primary"
                  disabled={!motivo.trim()}
                  style={!motivo.trim() ? { opacity: 0.4, cursor: 'not-allowed' } : null}
                  onClick={() => onConfirm({ falhaCategoria: categoria, falhaMotivo: motivo.trim() })}>
            Registrar falha
          </button>
        </footer>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// PAINEL DE NOTIFICAÇÕES — vencimentos, atrasados, rotinas pendentes
// ────────────────────────────────────────────────────────────────────────────
function buildNotifs(items) {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const notifs = [];
  const horaMin = (h) => { if (!h) return null; const [hh, mm] = String(h).split(':').map(Number); return hh*60+mm; };

  items.forEach(it => {
    // ── Atrasados (mais antigo = mais urgente) ──
    if (!D.temDias(it) && D.isAtivo(it) && D.isAtrasado(it)) {
      const dias = Math.abs(D.diasAteHoje(it.prazo));
      notifs.push({ id: 'late-' + it.id, type: 'late', prio: 0, sort: -dias,
        titulo: it.titulo, sub: `Atrasado há ${dias} ${dias === 1 ? 'dia' : 'dias'}`,
        subClass: 'notif-item__sub--critical', item: it });
    }
    // ── Vence hoje (por hora) ──
    else if (!D.temDias(it) && D.isAtivo(it) && D.isHoje(it)) {
      const hm = horaMin(it.hora);
      notifs.push({ id: 'today-' + it.id, type: 'today', prio: 1, sort: hm ?? 9999,
        titulo: it.titulo, sub: it.hora ? `Vence hoje às ${it.hora}` : 'Vence hoje',
        subClass: 'notif-item__sub--warn', item: it });
    }
    // ── Próximos dias (mais próximo primeiro) ──
    else if (!D.temDias(it) && D.isAtivo(it) && it.prazo) {
      const d = D.diasAteHoje(it.prazo);
      if (d > 0 && d <= 7) {
        notifs.push({ id: 'soon-' + it.id, type: 'soon', prio: 2, sort: d,
          titulo: it.titulo,
          sub: `${d === 1 ? 'Vence amanhã' : `Vence em ${d} dias`} — ${D.formatDate(it.prazo)}`,
          subClass: '', item: it });
      }
    }
    // ── Crítica sem prazo ──
    if (!D.temDias(it) && D.isAtivo(it) && it.prioridade === 'Crítica' && !it.prazo) {
      notifs.push({ id: 'critica-' + it.id, type: 'critica', prio: 3, sort: 0,
        titulo: it.titulo, sub: 'Crítica · sem prazo definido', subClass: '', item: it });
    }
    // ── Rotina de hoje (por hora; já passou da hora = mais urgente) ──
    if (D.temDias(it) && D.rotinaNoDia(it, hoje) && !D.rotinaFeitaHoje(it)) {
      const hm = horaMin(it.hora);
      const atrasada = hm !== null && hm < nowMin;
      notifs.push({ id: 'rotina-' + it.id, type: 'rotina', prio: 4, sort: hm ?? 9999,
        titulo: it.titulo,
        sub: it.hora ? (atrasada ? `Pendente desde ${it.hora}` : `Programada para ${it.hora}`) : 'Rotina de hoje',
        subClass: atrasada ? 'notif-item__sub--warn' : '', item: it });
    }
  });

  // Ordenação orgânica: por grupo de urgência, depois por proximidade no tempo
  return notifs.sort((a, b) => a.prio - b.prio || a.sort - b.sort);
}

const NOTIF_GROUPS = {
  late:    { label: 'Atrasados',         accent: 'var(--color-critical)' },
  today:   { label: 'Vencem hoje',       accent: '#e0922b' },
  soon:    { label: 'Próximos dias',     accent: '#c98a2b' },
  critica: { label: 'Crítico sem prazo', accent: 'var(--color-critical)' },
  rotina:  { label: 'Rotinas de hoje',   accent: 'var(--color-neutral-strong)' },
};

function NotifPanel({ items, readIds, onMarkAll, onClose, onEditItem, dismissedIds, onDismiss,
                     alarmEnabled, onEnableAlarm, onDisableAlarm }) {
  const notifs = useMemo(() => buildNotifs(items), [items]);
  const dismissed = dismissedIds || new Set();
  const visible = useMemo(() => notifs.filter(n => !dismissed.has(n.id)), [notifs, dismissed]);
  const unread = visible.filter(n => !readIds.has(n.id));

  const groups = useMemo(() => {
    const map = new Map();
    visible.forEach(n => {
      if (!map.has(n.type)) map.set(n.type, []);
      map.get(n.type).push(n);
    });
    return [...map.entries()].filter(([, list]) => list.length > 0);
  }, [visible]);

  return (
    <div className="notif-panel">
      <div className="notif-panel__head">
        <span className="notif-panel__title">
          <strong>Notificações</strong>
          {unread.length > 0 && `${unread.length} nova${unread.length > 1 ? 's' : ''}`}
        </span>
        {unread.length > 0 && (
          <button className="notif-panel__mark" onClick={onMarkAll}>Marcar lidas</button>
        )}
      </div>
      <button className={`notif-alarm ${alarmEnabled ? 'notif-alarm--on' : ''}`}
              onClick={alarmEnabled ? onDisableAlarm : onEnableAlarm}>
        <span className="notif-alarm__icon">{alarmEnabled ? '🔔' : '🔕'}</span>
        <span className="notif-alarm__text">
          {alarmEnabled ? 'Alarme ativo — toca perto do horário' : 'Ativar alarme de vencimentos'}
        </span>
        <span className="notif-alarm__switch" aria-label={alarmEnabled ? 'Ativado' : 'Desativado'}/>
      </button>
      <div className="notif-panel__body">
        {visible.length === 0 ? (
          <div className="notif-panel__empty">
            <div className="notif-panel__empty-mark">✓</div>
            <div className="notif-panel__empty-title">Tudo em dia</div>
            <div className="notif-panel__empty-sub">Nenhum vencimento ou pendência no radar.</div>
          </div>
        ) : groups.map(([type, list]) => {
          const g = NOTIF_GROUPS[type] || { label: type, accent: 'var(--color-neutral-mid)' };
          return (
            <div key={type} className="notif-group">
              <div className="notif-group__label">
                <span className="notif-group__bar" style={{ background: g.accent }}/>
                {g.label}
                <span className="notif-group__count">{list.length}</span>
              </div>
              {list.map(n => (
                <div key={n.id}
                     className={`notif-item ${!readIds.has(n.id) ? 'notif-item--unread' : ''}`}
                     data-type={n.type}>
                  <button className="notif-item__main"
                          onClick={() => { onEditItem(n.item); onClose(); }}>
                    <span className="notif-item__bar" style={{ background: g.accent }}/>
                    <span className="notif-item__content">
                      <span className="notif-item__title">{n.titulo}</span>
                      <span className={`notif-item__sub ${n.subClass}`}>{n.sub}</span>
                    </span>
                  </button>
                  <button className="notif-item__dismiss"
                          title="Dispensar"
                          onClick={(e) => { e.stopPropagation(); onDismiss && onDismiss(n.id); }}>×</button>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// OCORRÊNCIAS — tarefas com prazo no dia + rotinas recorrentes do dia da semana
// ────────────────────────────────────────────────────────────────────────────
const sameDay = (a, b) =>
  a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

const parseDia = (v) => D.parseLocalDate(v);

// Ocorrência concluída naquele dia específico?
const ocorrenciaFeita = (it, d) => {
  if (D.temDias(it)) return D.rotinaFeitaNoDia(it, d);
  return D.isFeito(it);
};

// Todas as ocorrências de uma data, ordenadas por hora (sem hora ao fim)
const occurrencesForDay = (items, d) => {
  const fixos = items.filter(it => it.prazo && sameDay(parseDia(it.prazo), d) && !D.temDias(it));
  const rotinas = items.filter(it => D.rotinaNoDia(it, d));
  return [...rotinas, ...fixos].sort((a, b) => {
    if (a.hora && b.hora) return a.hora.localeCompare(b.hora);
    if (a.hora) return -1;
    if (b.hora) return 1;
    return 0;
  });
};

// ────────────────────────────────────────────────────────────────────────────
// KANBAN — colunas por status com arrastar e soltar
// ────────────────────────────────────────────────────────────────────────────
const KANBAN_COLS = [
  { status: 'Pendente',     extra: ['Recebido'], mod: '' },
  { status: 'Em Andamento', extra: [],           mod: '' },
  { status: 'Pausado',      extra: [],           mod: '' },
  { status: 'Bloqueado',    extra: [],           mod: 'kanban__col--blocked' },
  { status: 'Concluído',    extra: [],           mod: 'kanban__col--done' },
];

function KanbanView({ items, onEdit, onSetStatus, onToggle, selDate }) {
  const [draggingId, setDraggingId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const dia = selDate || new Date();

  const colItems = (col) =>
    items.filter(it => {
      if (D.temDias(it)) {
        // Rotina: só aparece nos dias em que está programada; coluna pelo estado do dia
        if (!D.rotinaNoDia(it, dia)) return false;
        const alvo = D.rotinaFeitaNoDia(it, dia) ? 'Concluído' : 'Pendente';
        return col.status === alvo;
      }
      return it.status === col.status || col.extra.includes(it.status);
    });

  const handleDrop = (e, col) => {
    e.preventDefault();
    setOverCol(null);
    const id = e.dataTransfer.getData('text/plain') || draggingId;
    setDraggingId(null);
    const item = items.find(it => it.id === id);
    if (!item) return;
    if (D.temDias(item)) {
      // Rotina: arrastar para Concluído = concluir o DIA selecionado; sair = reabrir
      const feita = D.rotinaFeitaNoDia(item, dia);
      if (col.status === 'Concluído' && !feita) onToggle(item, dia);
      else if (col.status !== 'Concluído' && feita) onToggle(item, dia);
      return;
    }
    onSetStatus(item, col.status);
  };

  return (
    <>
      <div className="view-head">
        <div className="view-head__title">Kanban</div>
        <div className="view-head__meta">Arraste os cards entre colunas para mudar o status</div>
      </div>
      <div className="kanban">
        {KANBAN_COLS.map(col => {
          const cards = colItems(col);
          return (
            <div key={col.status}
                 className={`kanban__col ${col.mod} ${overCol === col.status ? 'kanban__col--over' : ''}`}
                 onDragOver={(e) => { e.preventDefault(); setOverCol(col.status); }}
                 onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOverCol(null); }}
                 onDrop={(e) => handleDrop(e, col)}>
              <div className="kanban__col-head">
                <div className="kanban__col-title">
                  <span className="kanban__col-dot"/>
                  {col.status}
                </div>
                <span className="kanban__col-count">{cards.length}</span>
              </div>
              <div className="kanban__cards">
                {cards.length === 0 ? (
                  <div className="kanban__empty">Solte aqui</div>
                ) : cards.map(it => (
                  <div key={it.id}
                       className={`kanban__card ${it.prioridade === 'Crítica' ? 'kanban__card--critica' : it.prioridade === 'Alta' ? 'kanban__card--alta' : it.prioridade === 'Média' ? 'kanban__card--media' : ''} ${draggingId === it.id ? 'kanban__card--dragging' : ''}`}
                       draggable
                       onDragStart={(e) => {
                         e.dataTransfer.setData('text/plain', it.id);
                         e.dataTransfer.effectAllowed = 'move';
                         setDraggingId(it.id);
                       }}
                       onDragEnd={() => { setDraggingId(null); setOverCol(null); }}
                       onDoubleClick={() => onEdit(it)}
                       title="Arraste para mover · Duplo clique para editar">
                    <div className="kanban__card-title">{it.titulo}</div>
                    <div className="kanban__card-meta">
                      <span>{it.origem}</span>
                      {it.prioridade && <span>· {it.prioridade}</span>}
                      {it.prazo && (
                        <span className={D.isAtrasado(it) ? 'late' : ''}>
                          · {D.formatRelative(it.prazo)}
                        </span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// NOTAS — anotações rápidas, salvas localmente no navegador
// ────────────────────────────────────────────────────────────────────────────
function NotesView() {
  const [sub, setSub] = useState('todo'); // todo | notas

  // ── To-do list ──
  const [todos, setTodos] = useState(() => {
    try { const s = localStorage.getItem('villares_planner_todos'); if (s) { const p = JSON.parse(s); if (Array.isArray(p)) return p; } } catch {}
    return [];
  });
  const [todoInput, setTodoInput] = useState('');
  useEffect(() => { try { localStorage.setItem('villares_planner_todos', JSON.stringify(todos)); } catch {} }, [todos]);

  // status: 'afazer' | 'andamento' | 'feito' (compat: t.feito antigo → feito)
  const todoStatus = (t) => t.status || (t.feito ? 'feito' : 'afazer');

  const addTodo = () => {
    const t = todoInput.trim(); if (!t) return;
    setTodos(prev => [{ id: 'T-' + Date.now().toString(36), texto: t, status: 'afazer', criadoEm: D.localISO() }, ...prev]);
    setTodoInput(''); sfx.add();
  };
  const setTodoSt = (id, st) => setTodos(prev => prev.map(t => {
    if (t.id !== id) return t;
    if (st === 'feito') sfx.complete(); else if (st === 'andamento') sfx.add(); else sfx.tick();
    const { feito, ...rest } = t;
    return { ...rest, status: st };
  }));
  // Avança no ciclo: afazer → andamento → feito → afazer
  const cycleTodo = (id) => {
    const t = todos.find(x => x.id === id); if (!t) return;
    const cur = todoStatus(t);
    setTodoSt(id, cur === 'afazer' ? 'andamento' : cur === 'andamento' ? 'feito' : 'afazer');
  };
  const delTodo = (id) => { sfx.remove(); setTodos(prev => prev.filter(t => t.id !== id)); };
  const clearDone = () => setTodos(prev => prev.filter(t => todoStatus(t) !== 'feito'));

  const pendentes  = todos.filter(t => todoStatus(t) === 'afazer');
  const andamento  = todos.filter(t => todoStatus(t) === 'andamento');
  const concluidos = todos.filter(t => todoStatus(t) === 'feito');

  // ── Notas ──
  const [notas, setNotas] = useState(() => {
    try { const s = localStorage.getItem('villares_planner_notas'); if (s) { const p = JSON.parse(s); if (Array.isArray(p)) return p; } } catch {}
    return [];
  });
  useEffect(() => { try { localStorage.setItem('villares_planner_notas', JSON.stringify(notas)); } catch {} }, [notas]);

  const criarNota = () => setNotas(prev => [{ id: 'N-' + Date.now().toString(36), titulo: '', texto: '', fixada: false, criadoEm: new Date().toISOString() }, ...prev]);
  const atualizarNota = (id, patch) => setNotas(prev => prev.map(n => n.id === id ? { ...n, ...patch } : n));
  const excluirNota = (nota) => {
    const vazia = !nota.titulo.trim() && !nota.texto.trim();
    if (!vazia && !window.confirm('Excluir esta nota? Esta ação não pode ser desfeita.')) return;
    setNotas(prev => prev.filter(n => n.id !== nota.id));
  };
  const notasOrdenadas = useMemo(() =>
    [...notas].sort((a, b) => (b.fixada ? 1 : 0) - (a.fixada ? 1 : 0) || new Date(b.criadoEm) - new Date(a.criadoEm))
  , [notas]);

  return (
    <>
      <div className="view-head">
        <div className="view-head__title">Anotações</div>
        <div className="cal-modes">
          <button className={`cal-mode ${sub === 'todo' ? 'cal-mode--active' : ''}`} onClick={() => setSub('todo')}>To-do list</button>
          <button className={`cal-mode ${sub === 'notas' ? 'cal-mode--active' : ''}`} onClick={() => setSub('notas')}>Notas</button>
        </div>
      </div>

      {sub === 'todo' ? (
        <div className="todo2 fade-up">
          {/* Cabeçalho com progresso */}
          <div className="todo2__progress">
            <div className="todo2__progress-info">
              <span className="todo2__progress-pct">{todos.length === 0 ? 0 : Math.round(((concluidos.length + andamento.length * 0.5) / todos.length) * 100)}%</span>
              <span className="todo2__progress-label">
                {concluidos.length} concluídas · {andamento.length} em curso · {pendentes.length} a fazer
              </span>
            </div>
            <div className="todo2__progress-bar">
              <div className="todo2__progress-fill"
                   style={{ width: `${todos.length === 0 ? 0 : ((concluidos.length + andamento.length * 0.5) / todos.length) * 100}%` }}/>
            </div>
          </div>

          {/* Campo de adição em destaque */}
          <div className="todo2__add">
            <span className="todo2__add-icon">+</span>
            <input className="todo2__input" placeholder="O que precisa ser feito?"
                   value={todoInput}
                   onChange={(e) => setTodoInput(e.target.value)}
                   onKeyDown={(e) => { if (e.key === 'Enter') addTodo(); }}/>
            <button className="todo2__add-btn" onClick={addTodo} disabled={!todoInput.trim()}>
              Adicionar
            </button>
          </div>

          {todos.length === 0 ? (
            <div className="todo2__empty">
              <div className="todo2__empty-mark">✓</div>
              <div className="todo2__empty-title">Lista limpa</div>
              <div className="todo2__empty-sub">Adicione tarefas rápidas — ideias e pendências que não precisam de prazo nem categoria.</div>
            </div>
          ) : (
            <div className="todo2__cols">
              {/* A FAZER */}
              <div className="todo2__col">
                <div className="todo2__col-head">
                  <span className="todo2__col-dot"/> A fazer
                  <span className="todo2__col-count">{pendentes.length}</span>
                </div>
                <div className="todo2__list">
                  {pendentes.length === 0 ? (
                    <div className="todo2__col-empty">Vazio</div>
                  ) : pendentes.map(t => (
                    <div key={t.id} className="todo2__card">
                      <button className="todo2__check" onClick={() => cycleTodo(t.id)} title="Iniciar"/>
                      <span className="todo2__text">{t.texto}</span>
                      <button className="todo2__move" onClick={() => setTodoSt(t.id, 'andamento')} title="Mover para Em andamento">→</button>
                      <button className="todo2__del" onClick={() => delTodo(t.id)} title="Remover">×</button>
                    </div>
                  ))}
                </div>
              </div>

              {/* EM ANDAMENTO */}
              <div className="todo2__col">
                <div className="todo2__col-head todo2__col-head--prog">
                  <span className="todo2__col-dot todo2__col-dot--prog"/> Em andamento
                  <span className="todo2__col-count">{andamento.length}</span>
                </div>
                <div className="todo2__list">
                  {andamento.length === 0 ? (
                    <div className="todo2__col-empty">Nada em curso</div>
                  ) : andamento.map(t => (
                    <div key={t.id} className="todo2__card todo2__card--prog">
                      <button className="todo2__check todo2__check--prog" onClick={() => cycleTodo(t.id)} title="Concluir">◐</button>
                      <span className="todo2__text">{t.texto}</span>
                      <button className="todo2__move" onClick={() => setTodoSt(t.id, 'afazer')} title="Voltar para A fazer">←</button>
                      <button className="todo2__del" onClick={() => delTodo(t.id)} title="Remover">×</button>
                    </div>
                  ))}
                </div>
              </div>

              {/* CONCLUÍDO */}
              <div className="todo2__col">
                <div className="todo2__col-head todo2__col-head--done">
                  <span className="todo2__col-dot todo2__col-dot--done"/> Concluído
                  <span className="todo2__col-count">{concluidos.length}</span>
                  {concluidos.length > 0 && (
                    <button className="todo2__clear" onClick={clearDone} title="Limpar concluídos">Limpar</button>
                  )}
                </div>
                <div className="todo2__list">
                  {concluidos.length === 0 ? (
                    <div className="todo2__col-empty">Nada concluído</div>
                  ) : concluidos.map(t => (
                    <div key={t.id} className="todo2__card todo2__card--done">
                      <button className="todo2__check todo2__check--on" onClick={() => setTodoSt(t.id, 'afazer')} title="Reabrir">✓</button>
                      <span className="todo2__text">{t.texto}</span>
                      <button className="todo2__del" onClick={() => delTodo(t.id)} title="Remover">×</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      ) : (
        <>
          <div className="notes-toolbar">
            <button className="topbar__cta" onClick={criarNota}><Plus size={14}/> Nova nota</button>
          </div>
          {notasOrdenadas.length === 0 ? (
            <div className="empty-view fade-up">
              Nenhuma nota ainda. Clique em "Nova nota" para registrar lembretes,<br/>
              ideias e pendências que não precisam virar um item do Planner.
            </div>
          ) : (
            <div className="notes-grid">
              {notasOrdenadas.map(n => (
                <div key={n.id} className={`note fade-up ${n.fixada ? 'note--pinned' : ''}`}>
                  <div className="note__bar">
                    <span className="note__date">
                      {new Date(n.criadoEm).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')}
                    </span>
                    <button className={`note__btn ${n.fixada ? 'note__btn--on' : ''}`}
                            title={n.fixada ? 'Desafixar' : 'Fixar no topo'}
                            onClick={() => atualizarNota(n.id, { fixada: !n.fixada })}>
                      <Pin size={13}/>
                    </button>
                    <button className="note__btn note__btn--danger" title="Excluir nota" onClick={() => excluirNota(n)}>
                      <Trash size={13}/>
                    </button>
                  </div>
                  <input className="note__title" placeholder="Título" value={n.titulo}
                         onChange={(e) => atualizarNota(n.id, { titulo: e.target.value })}/>
                  <textarea className="note__text" placeholder="Escreva sua nota..." value={n.texto}
                            onChange={(e) => atualizarNota(n.id, { texto: e.target.value })}/>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </>
  );
}

// CALENDÁRIO — itens distribuídos por prazo
// ────────────────────────────────────────────────────────────────────────────
// ═══ CALENDÁRIO v2 — modos Agenda / Semana / Mês / Timeline + filtros reais ═══

const CAL_TIPOS    = ['Todas', 'Projetos', 'Rotinas', 'Pedidos'];
const CAL_STATUS   = ['Todos', 'Pendente', 'Em andamento', 'Concluído', 'Atrasado'];
const CAL_PRIOS    = ['Todas', 'Crítica', 'Alta', 'Média', 'Baixa'];
const CAL_PERIODOS = ['Todos', 'Hoje', 'Amanhã', 'Esta semana', 'Próxima semana', 'Este mês'];
const CAL_FILTROS_DEFAULT = { tipo: 'Todas', status: 'Todos', prio: 'Todas', cats: [], periodo: 'Todos' };

function inicioSemana(d) {
  const s = new Date(d); s.setHours(12, 0, 0, 0);
  s.setDate(s.getDate() - ((s.getDay() + 6) % 7)); // segunda
  return s;
}

function periodoRange(periodo) {
  const hoje = new Date(); hoje.setHours(12, 0, 0, 0);
  const mk = (a, b) => [a, b];
  switch (periodo) {
    case 'Hoje':           return mk(hoje, hoje);
    case 'Amanhã':         { const d = new Date(hoje); d.setDate(d.getDate() + 1); return mk(d, d); }
    case 'Esta semana':    { const i = inicioSemana(hoje); const f = new Date(i); f.setDate(i.getDate() + 6); return mk(i, f); }
    case 'Próxima semana': { const i = inicioSemana(hoje); i.setDate(i.getDate() + 7); const f = new Date(i); f.setDate(i.getDate() + 6); return mk(i, f); }
    case 'Este mês':       { const i = new Date(hoje.getFullYear(), hoje.getMonth(), 1, 12); const f = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0, 12); return mk(i, f); }
    default:               return null;
  }
}

function CalFilters({ filters, onChange }) {
  const [openMenu, setOpenMenu] = useState(null);

  useEffect(() => {
    if (!openMenu) return;
    const onClick = (e) => { if (!e.target.closest('.dropdown')) setOpenMenu(null); };
    const onKey = (e) => { if (e.key === 'Escape') setOpenMenu(null); };
    const t = setTimeout(() => {
      document.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);
    }, 0);
    return () => {
      clearTimeout(t);
      document.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [openMenu]);

  const toggle = (m) => setOpenMenu(prev => prev === m ? null : m);
  const set = (patch) => onChange({ ...filters, ...patch });
  const hasActive = filters.tipo !== 'Todas' || filters.status !== 'Todos' ||
                    filters.prio !== 'Todas' || filters.cats.length > 0 || filters.periodo !== 'Todos';

  const single = (menuKey, icon, label, value, options, patchKey, closeOnPick = true) => (
    <ToolbarDropdown icon={icon} label={label} value={value}
                     open={openMenu === menuKey} onToggle={() => toggle(menuKey)}>
      {options.map(o => (
        <button key={o}
                className={`dropdown__item ${value === o ? 'dropdown__item--active' : ''}`}
                onClick={() => { set({ [patchKey]: o }); if (closeOnPick) setOpenMenu(null); }}>
          {o}
          {value === o && <span className="dropdown__check">■</span>}
        </button>
      ))}
    </ToolbarDropdown>
  );

  return (
    <div className="cal-filterbar fade-up">
      {single('tipo',    Box,        'Tipo',       filters.tipo,    CAL_TIPOS,    'tipo')}
      {single('status',  Loader,     'Status',     filters.status,  CAL_STATUS,   'status')}
      {single('prio',    FilterIcon, 'Prioridade', filters.prio,    CAL_PRIOS,    'prio')}
      <ToolbarDropdown icon={Layers} label="Categoria"
                       value={filters.cats.length === 0 ? 'Todas' : `${filters.cats.length} selecionadas`}
                       open={openMenu === 'cats'} onToggle={() => toggle('cats')}>
        <button className={`dropdown__item ${filters.cats.length === 0 ? 'dropdown__item--active' : ''}`}
                onClick={() => set({ cats: [] })}>
          Todas
          {filters.cats.length === 0 && <span className="dropdown__check">■</span>}
        </button>
        {D.getCategorias().map(c => {
          const on = filters.cats.includes(c);
          return (
            <button key={c}
                    className={`dropdown__item ${on ? 'dropdown__item--active' : ''}`}
                    onClick={() => set({ cats: on ? filters.cats.filter(x => x !== c) : [...filters.cats, c] })}>
              <span className="dropdown__check" style={{ marginLeft: 0, marginRight: 2 }}>{on ? '■' : '□'}</span>
              {c}
            </button>
          );
        })}
      </ToolbarDropdown>
      {single('periodo', Cal,        'Período',    filters.periodo, CAL_PERIODOS, 'periodo')}

      {hasActive && (
        <button className="cal-filterbar__clear" onClick={() => onChange({ ...CAL_FILTROS_DEFAULT })}>
          <X size={12}/> Limpar filtros
        </button>
      )}
      <span className="cal-filters__hint">A busca da barra superior também se aplica</span>
    </div>
  );
}

function CalendarView({ items, onEdit, selDate, onSelDate }) {
  const [mode, setMode] = useState('mes'); // agenda | semana | mes | timeline
  const selected = selDate;
  const setSelected = onSelDate;
  const [ym, setYm] = useState({ y: selected.getFullYear(), m: selected.getMonth() });
  const [filters, setFilters] = useState({ ...CAL_FILTROS_DEFAULT });

  // Mantém o mês visível sincronizado quando a data global muda
  useEffect(() => { setYm({ y: selected.getFullYear(), m: selected.getMonth() }); }, [selected]);

  const today = new Date(); today.setHours(12, 0, 0, 0);

  // ── filtro de ocorrência ──
  const range = periodoRange(filters.periodo);
  const dentroDoPeriodo = (d) => !range || (d >= new Date(range[0]).setHours(0,0,0,0) && d <= new Date(range[1]).setHours(23,59,59,999));

  const passaFiltros = (it, d) => {
    if (!dentroDoPeriodo(d)) return false;
    if (filters.tipo !== 'Todas') {
      const origem = { 'Projetos': 'Projeto', 'Rotinas': 'Rotina', 'Pedidos': 'Pedido' }[filters.tipo];
      if (it.origem !== origem) return false;
    }
    if (filters.prio !== 'Todas' && it.prioridade !== filters.prio) return false;
    if (filters.cats.length > 0 && !filters.cats.some(c => D.hasCat(it, c))) return false;
    if (filters.status !== 'Todos') {
      const feita = ocorrenciaFeita(it, d);
      switch (filters.status) {
        case 'Pendente':     if (feita || it.status === 'Em Andamento') return false; break;
        case 'Em andamento': if (it.status !== 'Em Andamento' || feita) return false; break;
        case 'Concluído':    if (!feita) return false; break;
        case 'Atrasado':     if (D.temDias(it) || !D.isAtrasado(it)) return false; break;
      }
    }
    return true;
  };

  const byDay = (d) => occurrencesForDay(items, d).filter(it => passaFiltros(it, d));

  // ── navegação ──
  const goTo = (date) => {
    const d = new Date(date); d.setHours(12, 0, 0, 0);
    setSelected(d);
    setYm({ y: d.getFullYear(), m: d.getMonth() });
  };
  const shiftDay = (delta) => { const d = new Date(selected); d.setDate(d.getDate() + delta); goTo(d); };
  const shiftMonth = (delta) => setYm(({ y, m }) => { const d = new Date(y, m + delta, 1); return { y: d.getFullYear(), m: d.getMonth() }; });

  // ── dados por modo ──
  const monthLabel = new Date(ym.y, ym.m, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  const monthCells = useMemo(() => {
    const first = new Date(ym.y, ym.m, 1);
    const start = new Date(first);
    start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
    return Array.from({ length: 42 }, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i); d.setHours(12, 0, 0, 0);
      return d;
    });
  }, [ym]);

  const weekDays = useMemo(() => {
    const start = inicioSemana(selected);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      return d;
    });
  }, [selected]);

  const agendaDays = useMemo(() => {
    // Período define o intervalo; sem período: 14 dias a partir do selecionado
    let ini, fim;
    if (range) { ini = new Date(range[0]); fim = new Date(range[1]); }
    else { ini = new Date(selected); fim = new Date(selected); fim.setDate(fim.getDate() + 13); }
    const days = [];
    for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) {
      const day = new Date(d); day.setHours(12, 0, 0, 0);
      days.push({ date: day, evs: byDay(day) });
    }
    return days.filter(x => x.evs.length > 0);
  }, [items, selected, filters]);

  const fmtDia = (d) => d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  const selEvents = byDay(selected);

  const renderRow = (it, d) => (
    <button key={it.id + d.toISOString().slice(0, 10)} className="day-panel__row" onClick={() => onEdit(it)}>
      <span className={`day-panel__hora ${!it.hora ? 'day-panel__hora--none' : ''}`}>{it.hora || '—:—'}</span>
      <span className={`day-panel__item-title ${ocorrenciaFeita(it, d) ? 'day-panel__item-title--done' : ''}`}>
        {it.titulo}
        {it.descricao && <span className="day-panel__desc"> — {String(it.descricao).split('\n')[0]}</span>}
      </span>
      <span className="day-panel__badges">
        {D.temDias(it) && <span className="day-panel__badge">Rotina</span>}
        {(it.prioridade === 'Crítica' || it.prioridade === 'Alta') && (
          <span className="day-panel__badge day-panel__badge--alta">{it.prioridade}</span>
        )}
      </span>
    </button>
  );

  return (
    <>
      <div className="view-head">
        <div className="view-head__title">Calendário</div>
        <div className="cal-modes">
          {[['agenda', 'Agenda'], ['semana', 'Semana'], ['mes', 'Mês'], ['timeline', 'Timeline']].map(([k, l]) => (
            <button key={k} className={`cal-mode ${mode === k ? 'cal-mode--active' : ''}`}
                    onClick={() => setMode(k)}>{l}</button>
          ))}
        </div>
      </div>

      <CalFilters filters={filters} onChange={setFilters}/>

      {/* Navegação rápida */}
      <div className="cal-nav fade-up">
        <div className="cal-nav__group">
          {mode === 'semana' ? (
            <>
              <button className="cal__nav-btn" onClick={() => shiftDay(-7)}>← Semana</button>
              <button className="cal__nav-btn cal__nav-btn--strong" onClick={() => goTo(new Date())}>Hoje</button>
              <button className="cal__nav-btn" onClick={() => shiftDay(7)}>Semana →</button>
            </>
          ) : (
            <>
              <button className="cal__nav-btn" onClick={() => shiftDay(-1)}>← Dia anterior</button>
              <button className="cal__nav-btn cal__nav-btn--strong" onClick={() => goTo(new Date())}>Hoje</button>
              <button className="cal__nav-btn" onClick={() => shiftDay(1)}>Próximo dia →</button>
            </>
          )}
        </div>
        <div className="cal-nav__group">
          <label className="cal-nav__label">Ir para:</label>
          <input type="date" className="form-input cal-nav__date"
                 value={D.localISO(selected)}
                 onChange={(e) => { if (e.target.value) goTo(new Date(e.target.value + 'T12:00:00')); }}/>
        </div>
      </div>

      {/* ══ MODO AGENDA ══ */}
      {mode === 'agenda' && (
        <div className="agenda fade-up">
          {agendaDays.length === 0 ? (
            <div className="day-panel__empty">Nenhum item no período selecionado.</div>
          ) : agendaDays.map(({ date, evs }) => (
            <div key={date.toISOString()} className="agenda__day">
              <div className={`agenda__day-head ${sameDay(date, today) ? 'agenda__day-head--today' : ''}`}>
                <span className="agenda__day-name">{sameDay(date, today) ? 'Hoje' : fmtDia(date)}</span>
                <span className="agenda__day-count">{evs.length} {evs.length === 1 ? 'Item' : 'Itens'}</span>
              </div>
              <div className="day-panel__list">{evs.map(it => renderRow(it, date))}</div>
            </div>
          ))}
        </div>
      )}

      {/* ══ MODO SEMANA ══ */}
      {mode === 'semana' && (
        <div className="week fade-up">
          {weekDays.map(d => {
            const evs = byDay(d);
            const isToday = sameDay(d, today);
            return (
              <div key={d.toISOString()} className={`week__col ${isToday ? 'week__col--today' : ''}`}>
                <div className="week__col-head">
                  <span className="week__col-dow">{D.DIAS_SEMANA[d.getDay()]}</span>
                  <span className="week__col-num">{d.getDate()}</span>
                </div>
                <div className="week__col-list">
                  {evs.length === 0 ? (
                    <div className="week__empty">—</div>
                  ) : evs.map(it => (
                    <button key={it.id + d.toISOString().slice(0,10)}
                            className={`cal__ev ${ocorrenciaFeita(it, d) ? 'cal__ev--done' : (!D.temDias(it) && D.isAtrasado(it)) ? 'cal__ev--late' : ''} ${D.temDias(it) ? 'cal__ev--rotina' : ''}`}
                            title={`${it.hora ? it.hora + ' · ' : ''}${it.titulo}${it.descricao ? ' — ' + it.descricao : ''}`}
                            onClick={() => onEdit(it)}>
                      {it.hora && <span className="cal__ev-hora">{it.hora}</span>}{it.titulo}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ══ MODO MÊS ══ */}
      {mode === 'mes' && (<>
        <div className="cal fade-up">
          <div className="cal__bar">
            <div className="cal__month">{monthLabel}</div>
            <div className="cal__nav">
              <button className="cal__nav-btn" onClick={() => shiftMonth(-1)}>← Mês</button>
              <button className="cal__nav-btn" onClick={() => shiftMonth(1)}>Mês →</button>
            </div>
          </div>
          <div className="cal__dows">
            {['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(d => (
              <div key={d} className="cal__dow">{d}</div>
            ))}
          </div>
          <div className="cal__grid">
            {monthCells.map((d, i) => {
              const evs = byDay(d);
              const out = d.getMonth() !== ym.m;
              const isToday = sameDay(d, today);
              const isSel = sameDay(d, selected);
              return (
                <div key={i}
                     className={`cal__cell ${out ? 'cal__cell--out' : ''} ${isToday ? 'cal__cell--today' : ''} ${isSel ? 'cal__cell--selected' : ''}`}
                     onClick={() => setSelected(d)}>
                  <div className="cal__day">{d.getDate()}</div>
                  {evs.slice(0, 3).map(it => (
                    <button key={it.id + i}
                            className={`cal__ev ${ocorrenciaFeita(it, d) ? 'cal__ev--done' : (!D.temDias(it) && D.isAtrasado(it)) ? 'cal__ev--late' : ''} ${D.temDias(it) ? 'cal__ev--rotina' : ''}`}
                            title={`${it.hora ? it.hora + ' · ' : ''}${it.titulo}${it.descricao ? ' — ' + it.descricao : ''}`}
                            onClick={(e) => { e.stopPropagation(); onEdit(it); }}>
                      {it.hora && <span className="cal__ev-hora">{it.hora}</span>}{it.titulo}
                    </button>
                  ))}
                  {evs.length > 3 && <div className="cal__more">+{evs.length - 3} Itens</div>}
                </div>
              );
            })}
          </div>
        </div>

        <div className="day-panel fade-up">
          <div className="day-panel__head">
            <div className="day-panel__title">{sameDay(selected, today) ? 'Hoje' : fmtDia(selected)}</div>
            <div className="day-panel__meta">{selEvents.length} {selEvents.length === 1 ? 'Item' : 'Itens'}</div>
          </div>
          {selEvents.length === 0 ? (
            <div className="day-panel__empty">Nada agendado para este dia.</div>
          ) : (
            <div className="day-panel__list">{selEvents.map(it => renderRow(it, selected))}</div>
          )}
        </div>
      </>)}

      {/* ══ MODO TIMELINE ══ */}
      {mode === 'timeline' && (
        <div className="timeline fade-up">
          {agendaDays.length === 0 ? (
            <div className="day-panel__empty">Nenhum item no período selecionado.</div>
          ) : agendaDays.map(({ date, evs }) => (
            <div key={date.toISOString()} className="timeline__group">
              <div className="timeline__marker">
                <span className={`timeline__dot ${sameDay(date, today) ? 'timeline__dot--today' : ''}`}/>
                <span className="timeline__date">{sameDay(date, today) ? 'Hoje' : fmtDia(date)}</span>
              </div>
              <div className="timeline__items">
                {evs.map(it => (
                  <button key={it.id + date.toISOString().slice(0,10)}
                          className={`timeline__item ${ocorrenciaFeita(it, date) ? 'timeline__item--done' : ''}`}
                          onClick={() => onEdit(it)}>
                    <span className={`day-panel__hora ${!it.hora ? 'day-panel__hora--none' : ''}`}>{it.hora || '—:—'}</span>
                    <span className="timeline__item-title">{it.titulo}</span>
                    {D.temDias(it) && <span className="day-panel__badge">Rotina</span>}
                    {(it.prioridade === 'Crítica' || it.prioridade === 'Alta') && (
                      <span className="day-panel__badge day-panel__badge--alta">{it.prioridade}</span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// RELATÓRIOS — distribuições por status, prioridade, origem e categoria

function ReportBars({ title, icon: IconC, rows, criticalKeys = [], strongKeys = [] }) {
  const max = Math.max(1, ...rows.map(r => r.total));
  return (
    <div className="report-panel fade-up">
      <div className="report-panel__title"><IconC size={12}/> {title}</div>
      {rows.length === 0 ? (
        <div style={{ color: 'var(--color-text-quaternary)', fontFamily: 'var(--font-mono)', fontSize: 11 }}>
          Sem dados disponíveis
        </div>
      ) : rows.map(r => (
        <div key={r.nome} className="report-row">
          <div className="report-row__label" title={r.nome}>{r.nome}</div>
          <div className="report-row__bar">
            <div className={`report-row__fill ${criticalKeys.includes(r.nome) ? 'report-row__fill--critical' : strongKeys.includes(r.nome) ? 'report-row__fill--strong' : ''}`}
                 style={{ width: `${(r.total / max) * 100}%` }}/>
          </div>
          <div className="report-row__num">{r.total} {r.total === 1 ? 'Item' : 'Itens'}</div>
        </div>
      ))}
    </div>
  );
}

function ReportsView({ items, allCats, metrics }) {
  const countBy = (fn) => {
    const map = new Map();
    items.forEach(it => {
      const k = fn(it);
      if (!k) return;
      map.set(k, (map.get(k) || 0) + 1);
    });
    return [...map.entries()].map(([nome, total]) => ({ nome, total }))
                             .sort((a, b) => b.total - a.total);
  };

  const porStatus     = countBy(it => it.status);
  const porPrioridade = ['Crítica', 'Alta', 'Média', 'Baixa']
    .map(p => ({ nome: p, total: items.filter(it => it.prioridade === p).length }))
    .filter(r => r.total > 0);
  const porOrigem     = countBy(it => it.origem);
  const porCategoria  = allCats.map(c => ({ nome: c.nome, total: c.total }));

  return (
    <>
      <div className="view-head">
        <div className="view-head__title">Relatórios</div>
        <div className="view-head__meta">
          {items.length} {items.length === 1 ? 'Item' : 'Itens'} · {Math.round(metrics.pct)}% Concluídos
        </div>
      </div>
      <div className="report-grid">
        <ReportBars title="Distribuição por status" icon={Stats} rows={porStatus}
                    criticalKeys={['Bloqueado']} strongKeys={['Concluído']}/>
        <ReportBars title="Distribuição por prioridade" icon={Warning} rows={porPrioridade}
                    criticalKeys={['Crítica', 'Alta']}/>
        <ReportBars title="Distribuição por origem" icon={Layers} rows={porOrigem}/>
        <ReportBars title="Distribuição por categoria" icon={Box} rows={porCategoria}/>
      </div>
    </>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// EQUIPE — solicitantes dos pedidos
// ────────────────────────────────────────────────────────────────────────────
function WeekView({ items, selDate, onEdit, onToggle, onJumpDay }) {
  const [expandidos, setExpandidos] = useState({}); // índice do dia -> bool
  const toggleExpand = (i) => setExpandidos(e => ({ ...e, [i]: !e[i] }));
  // Semana da data selecionada (domingo a sábado)
  const base = new Date(selDate); base.setHours(12,0,0,0);
  const inicioSemana = new Date(base);
  inicioSemana.setDate(base.getDate() - base.getDay()); // volta ao domingo

  const dias = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(inicioSemana); d.setDate(inicioSemana.getDate() + i); d.setHours(12,0,0,0);
      const ocorr = items.filter(it => D.noDia(it, d));
      const feitos = ocorr.filter(it => D.feitoNoDia(it, d));
      const horaMin = (h) => { if (!h) return 9999; const [hh, mm] = String(h).split(':').map(Number); return hh*60+mm; };
      ocorr.sort((a,b) => horaMin(a.hora) - horaMin(b.hora));
      arr.push({ data: d, ocorr, feitos: feitos.length, total: ocorr.length });
    }
    return arr;
  }, [items, inicioSemana.getTime()]);

  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const totalSemana = dias.reduce((s, d) => s + d.total, 0);
  const feitosSemana = dias.reduce((s, d) => s + d.feitos, 0);
  const pctSemana = totalSemana === 0 ? 0 : Math.round((feitosSemana / totalSemana) * 100);
  const maxCarga = Math.max(1, ...dias.map(d => d.total));

  const NOMES = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const ABREV = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
  const fmtIntervalo = () => {
    const fim = new Date(inicioSemana); fim.setDate(inicioSemana.getDate() + 6);
    const f = (d) => d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
    return `${f(inicioSemana)} – ${f(fim)}`;
  };

  return (
    <div className="week">
      <div className="week__head">
        <div>
          <div className="week__kicker">Visão semanal</div>
          <h2 className="week__heading">{fmtIntervalo()}</h2>
        </div>
        <div className="week__summary">
          <span className="week__summary-pct">{pctSemana}%</span>
          <span className="week__summary-label">{feitosSemana} de {totalSemana} concluídas</span>
        </div>
      </div>

      {/* Mini-gráfico de carga por dia */}
      <div className="week__chart">
        {dias.map((d, i) => {
          const isHoje = D.mesmoDia(d.data, hoje);
          const isSel = D.mesmoDia(d.data, selDate);
          const h = d.total === 0 ? 4 : 8 + (d.total / maxCarga) * 52;
          const pct = d.total === 0 ? 0 : (d.feitos / d.total) * 100;
          return (
            <button key={i} className={`week__bar-wrap ${isSel ? 'week__bar-wrap--sel' : ''}`}
                    onClick={() => onJumpDay(d.data)} title={`${NOMES[i]} · ${d.total} ${d.total === 1 ? 'item' : 'itens'}`}>
              <div className="week__bar-track" style={{ height: 64 }}>
                <div className="week__bar" style={{ height: h }}>
                  <div className="week__bar-done" style={{ height: `${pct}%` }}/>
                </div>
              </div>
              <span className={`week__bar-day ${isHoje ? 'week__bar-day--today' : ''}`}>{ABREV[i]}</span>
              <span className="week__bar-num">{d.total || ''}</span>
            </button>
          );
        })}
      </div>

      {/* Colunas dos dias com tarefas */}
      <div className="week__grid">
        {dias.map((d, i) => {
          const isHoje = D.mesmoDia(d.data, hoje);
          const isSel = D.mesmoDia(d.data, selDate);
          return (
            <div key={i} className={`week__col ${isHoje ? 'week__col--today' : ''} ${isSel ? 'week__col--sel' : ''}`}>
              <button className="week__col-head" onClick={() => onJumpDay(d.data)}>
                <span className="week__col-name">{ABREV[i]}</span>
                <span className="week__col-date">{d.data.getDate()}</span>
                {d.total > 0 && <span className="week__col-ratio">{d.feitos}/{d.total}</span>}
              </button>
              <div className="week__col-body">
                {d.ocorr.length === 0 ? (
                  <div className="week__col-empty">—</div>
                ) : (expandidos[i] ? d.ocorr : d.ocorr.slice(0, 6)).map(it => {
                  const feito = D.feitoNoDia(it, d.data);
                  return (
                    <div key={it.id} className={`week__task ${feito ? 'week__task--done' : ''}`}
                         onClick={() => onEdit(it)} role="button" tabIndex={0}>
                      <button className="week__task-check" onClick={(e) => { e.stopPropagation(); onToggle(it, d.data); }}>
                        {feito ? '✓' : ''}
                      </button>
                      {it.hora && <span className="week__task-hora">{it.hora}</span>}
                      <span className="week__task-title">{it.titulo}</span>
                    </div>
                  );
                })}
                {d.ocorr.length > 6 && (
                  <button className="week__col-more" onClick={() => toggleExpand(i)}>
                    {expandidos[i] ? 'Mostrar menos' : `+${d.ocorr.length - 6} mais`}
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TeamView({ items }) {
  const pessoas = useMemo(() => {
    const map = new Map();
    items.filter(it => it.origem === 'Pedido' && it.solicitante).forEach(it => {
      const k = it.solicitante.trim();
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(it);
    });
    return [...map.entries()]
      .map(([nome, its]) => ({
        nome,
        total: its.length,
        feitos: its.filter(D.isFeito).length,
        abertos: its.filter(D.isAtivo).length,

      .sort((a, b) => b.total - a.total);

  return (

        <div className="team-grid">
          {pessoas.map(p => {

              <div key={p.nome} className="team-card fade-up">

                    <div className="team-card__stat-num">{p.total}</div>

                  </div>
                  <div>
                    <div className="team-card__stat-num">{p.feitos}</div>
                    <div className="team-card__stat-label">Concluídos</div>
                  </div>
                  <div>
                    <div className="team-card__stat-num">{p.abertos}</div>

// ────────────────────────────────────────────────────────────────────────────
// API SERVICE — Google Apps Script backend
// ────────────────────────────────────────────────────────────────────────────
function createApi(url, token) {
  if (!url || !token) return null;

  // JSONP: cria <script> tag — único jeito de chamar Apps Script sem CORS
  // Apps Script precisa ter &callback=xxx e retornar: callback({...})
  const requestGet = (action, data) => new Promise((resolve, reject) => {
    const cbName = '__apscb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const timer = setTimeout(() => {
      delete window[cbName];
      script.remove();
      reject(new Error('Timeout: servidor demorou demais'));
    }, 20000);
    window[cbName] = (json) => {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
      if (!json.ok) reject(new Error(json.error || 'erro desconhecido'));
      else resolve(json);
    };
    const params = new URLSearchParams({ action, token, callback: cbName, ...(data || {}) });
    const script = document.createElement('script');
    script.onerror = () => {
      clearTimeout(timer);
      delete window[cbName];
      reject(new Error('Erro ao carregar script — verifique a URL do Apps Script'));
    };
    script.src = `${url}?${params}`;
    document.head.appendChild(script);
  });

  // POST com text/plain não dispara preflight CORS — Apps Script aceita.
  // Funciona inclusive via file:// (Apps Script responde Access-Control-Allow-Origin: *).
  // Se o XHR falhar mesmo assim (CORS/file://), cai para JSONP via GET com payload.
  const requestPostXhr = (action, data) => new Promise((resolve, reject) => {
    const params = new URLSearchParams({ action, token });
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${url}?${params}`, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    xhr.timeout = 20000;
    xhr.onload = () => {
      try {
        const json = JSON.parse(xhr.responseText);
        if (!json.ok) reject(new Error(json.error || 'erro desconhecido'));
        else resolve(json);
      } catch { reject(new Error('Resposta inválida do servidor')); }
    };
    xhr.onerror = () => { const e = new Error(`HTTP ${xhr.status || 'NetworkError'} — verifique a URL`); e.isNetwork = true; reject(e); };
    xhr.ontimeout = () => reject(new Error('Timeout: servidor demorou demais'));
    xhr.send(JSON.stringify(data || {}));
  });

  const requestPost = async (action, data) => {
    try {
      return await requestPostXhr(action, data);
    } catch (err) {
      // Fallback JSONP (sempre funciona em file://): envia o payload como
      // parâmetro GET `payload`. Requer suporte no doGet do Apps Script.
      if (err.isNetwork) {
        return requestGet(action, { payload: JSON.stringify(data || {}) });
      }
      throw err;
    }
  };

  return {
    async ping()        { const r = await requestGet('list');              return r.items; },
    async list()        { const r = await requestGet('list');              return r.items; },
    async create(item)  { const r = await requestPost('create', item);    return r.item; },
    async update(item)  { const r = await requestPost('update', item);    return r.item; },
    async delete(id)    { const r = await requestPost('delete', { id });  return r.id; },
    async bulk(items)   { const r = await requestPost('bulk', { items }); return r.count; },
    async concluir(p)   { const r = await requestPost('concluir', p);     return r; },
  };
}
