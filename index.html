// Remove espaços, quebras e caracteres invisíveis (zero-width, BOM, NBSP)
// que vêm junto ao copiar/colar e fazem o token parecer certo sem ser
const cleanCred = (s) => String(s || '').replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '').trim();

function SettingsModal({ open, config, items, onClose, onSave, onUploaded, onReplayTour, dayStart, onChangeDayStart }) {
  const { montado, saindo } = usePresence(open, 280);
  const [soundOn, setSoundOn] = useState(() => { try { return localStorage.getItem('villares_sound') !== 'off'; } catch { return true; } });
  const [quickAndamento, setQuickAndamento] = useState(() => { try { return localStorage.getItem('villares_quick_andamento') !== 'off'; } catch { return true; } });
  const [gsCopied, setGsCopied] = useState(false);
  const [showGs, setShowGs] = useState(false);
  const copyCodeGs = async () => {
    try {
      await navigator.clipboard.writeText(CODE_GS_CONTENT);
    } catch {
      // fallback: seleciona um textarea temporário
      const ta = document.createElement('textarea');
      ta.value = CODE_GS_CONTENT; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }
    setGsCopied(true);
    setTimeout(() => setGsCopied(false), 2200);
  };
  const downloadCodeGs = () => {
    const blob = new Blob([CODE_GS_CONTENT], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Code.gs';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const [url, setUrl] = useState(config?.url || '');
  const [token, setToken] = useState(config?.token || '');
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const [uploading, setUploading] = useState(false);

  useEffect(() => {
    if (!open) return;
    setUrl(config?.url || '');
    setToken(config?.token || '');
    setTestResult(null);
  }, [open, config]);

  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!montado) return null;

  const handleTest = async () => {
    setTesting(true);
    setTestResult(null);
    try {
      const api = createApi(cleanCred(url), cleanCred(token));
      const items = await api.list();
      setTestResult({ ok: true, msg: `Conexão estabelecida. ${items.length} ${items.length === 1 ? 'item encontrado' : 'itens encontrados'} na planilha.` });
    } catch (err) {
      setTestResult({ ok: false, msg: `Falha: ${err.message}` });
    } finally {
      setTesting(false);
    }
  };

  const handleSave = () => {
    if (!cleanCred(url) || !cleanCred(token)) return;
    onSave({ url: cleanCred(url), token: cleanCred(token) });
  };

  const handleDisconnect = () => {
    if (window.confirm('Desconectar do Google Sheets? Os dados continuarão disponíveis localmente.')) {
      onSave(null);
    }
  };

  const handleUpload = async () => {
    if (!url.trim() || !token.trim() || !items || items.length === 0) return;
    if (!window.confirm(`Enviar ${items.length} ${items.length === 1 ? 'item local' : 'itens locais'} para a planilha? Isso substitui o conteúdo atual da aba "Items".`)) return;
    setUploading(true);
    setTestResult(null);
    try {
      const api = createApi(cleanCred(url), cleanCred(token));
      const count = await api.bulk(items);
      setTestResult({ ok: true, msg: `${count} ${count === 1 ? 'item enviado' : 'itens enviados'} para a planilha.` });
      if (onUploaded) onUploaded(); // recarrega o dashboard logo após o envio
    } catch (err) {
      setTestResult({ ok: false, msg: `Falha no envio: ${err.message}` });
    } finally {
      setUploading(false);
    }
  };

  return (
    <div className={`modal-backdrop ${saindo ? 'is-closing' : ''}`} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ width: 640 }}>
        <header className="modal__header">
          <div className="modal__title">Configurações · Google Sheets</div>
          <button type="button" className="modal__close" onClick={onClose} title="Fechar">
            <X size={16}/>
          </button>
        </header>

        <div className="modal__body">
          <div className="settings-toggle">
            <div>
              <div className="settings-toggle__title">Sons de interface</div>
              <div className="settings-toggle__sub">Feedback sonoro ao concluir tarefas e alarmes</div>
            </div>
            <button className={`settings-switch ${soundOn ? 'settings-switch--on' : ''}`}
                    onClick={() => { const v = !soundOn; setSoundOn(v); try { localStorage.setItem('villares_sound', v ? 'on' : 'off'); } catch {} if (v) sfx.complete(); }}>
              <span className="settings-switch__knob"/>
            </button>
          </div>

          <div className="settings-toggle">
            <div>
              <div className="settings-toggle__title">Botão "Em andamento" no alerta</div>
              <div className="settings-toggle__sub">Mostrar a opção de marcar em andamento no popup de ação rápida</div>
            </div>
            <button className={`settings-switch ${quickAndamento ? 'settings-switch--on' : ''}`}
                    onClick={() => { const v = !quickAndamento; setQuickAndamento(v); try { localStorage.setItem('villares_quick_andamento', v ? 'on' : 'off'); } catch {} }}>
              <span className="settings-switch__knob"/>
            </button>
          </div>

          <div className="settings-toggle">
            <div>
              <div className="settings-toggle__title">Apresentação inicial</div>
              <div className="settings-toggle__sub">Rever o tour de boas-vindas do Planner</div>
            </div>
            <button className="settings-replay" onClick={onReplayTour}>Rever tour</button>
          </div>

          <div className="settings-toggle settings-toggle--col">
            <div>
              <div className="settings-toggle__title">Início do dia operacional</div>
              <div className="settings-toggle__sub">
                Em operações noturnas o dia não vira à meia-noite. Defina a hora em que seu
                dia começa — tudo <b>antes</b> dela conta como o <b>dia anterior</b> (mesmo turno).
                Ex.: com <b>04:00</b>, uma tarefa às 02h de terça pertence à <b>segunda</b>,
                aparece junto do turno e ordena <b>depois</b> das 22h.
                {dayStart > 0 && <><br/><span style={{ color: 'var(--color-critical)' }}>Ativo: o dia vai das {String(dayStart).padStart(2,'0')}:00 às {String(dayStart).padStart(2,'0')}:00 do dia seguinte.</span></>}
              </div>
            </div>
            <select className="settings-daystart" value={dayStart}
                    onChange={(e) => onChangeDayStart(parseInt(e.target.value, 10))}>
              <option value={0}>Meia-noite — dia normal (padrão)</option>
              <option value={3}>03:00 — vira o dia às 3h</option>
              <option value={4}>04:00 — vira o dia às 4h</option>
              <option value={5}>05:00 — vira o dia às 5h</option>
              <option value={6}>06:00 — vira o dia às 6h</option>
              <option value={7}>07:00 — vira o dia às 7h</option>
            </select>
          </div>

          <div className="settings-shortcuts">
            <div className="settings-shortcuts__title">Atalhos de teclado</div>
            <div className="settings-shortcuts__grid">
              <div className="settings-shortcut"><kbd>N</kbd><span>Novo item</span></div>
              <div className="settings-shortcut"><kbd>/</kbd><span>Buscar</span></div>
              <div className="settings-shortcut"><kbd>T</kbd><span>Ir para hoje</span></div>
              <div className="settings-shortcut"><kbd>←</kbd><span>Dia anterior</span></div>
              <div className="settings-shortcut"><kbd>→</kbd><span>Próximo dia</span></div>
              <div className="settings-shortcut"><kbd>Esc</kbd><span>Fechar janelas</span></div>
            </div>
          </div>

          <div className="help-block" style={{ marginBottom: 14 }}>
            Conecte uma planilha do Google Sheets como banco de dados.
            Você precisará da <b>URL do Web App</b> (terminada em <code>/exec</code>)
            e do <b>token</b> definido no Apps Script. Primeira vez? Abra o guia abaixo.
          </div>

          <details className="setup-guide">
            <summary className="setup-guide__summary">Como configurar · Passo a passo completo</summary>
            <ol className="setup-steps">
              <li className="setup-step">
                <b>Crie a planilha.</b> Acesse <code>sheets.new</code> e crie uma planilha
                em branco no Google Sheets, com qualquer nome (ex: "Villares Planner").
              </li>
              <li className="setup-step">
                <b>Sobre as colunas.</b> O script cria automaticamente a aba <code>Itens</code> com
                as colunas certas na primeira linha. Se preferir criar manualmente, use exatamente
                estes nomes, nesta ordem:
                <div className="setup-cols">
                  Id · Origem · Título · Descrição · Categoria · Prioridade · Status · Prazo ·
                  Hora · Progresso · Solicitante · Recebido Em · Frequência · Dias da Semana ·
                  Última Conclusão · Criado Em
                </div>
                Não renomeie nem reordene as colunas depois de conectar.
              </li>
              <li className="setup-step">
                <b>Instale o script.</b> Na planilha, vá em <code>Extensões → Apps Script</code>,
                apague o conteúdo do editor e cole o <code>Code.gs</code> abaixo por inteiro.
                <div className="gs-actions">
                  <button type="button" className="gs-btn gs-btn--primary" onClick={copyCodeGs}>
                    {gsCopied ? '✓ Copiado!' : 'Copiar Code.gs'}
                  </button>
                  <button type="button" className="gs-btn" onClick={downloadCodeGs}>Baixar Code.gs</button>
                  <button type="button" className="gs-btn" onClick={() => setShowGs(v => !v)}>
                    {showGs ? 'Ocultar código' : 'Ver código'}
                  </button>
                </div>
                {showGs && (
                  <pre className="gs-code"><code>{CODE_GS_CONTENT}</code></pre>
                )}
              </li>
              <li className="setup-step">
                <b>Defina o token.</b> No topo do script, troque o valor de
                <code> SECRET_TOKEN</code> por uma senha longa e aleatória (mínimo 24 caracteres).
                Guarde esse valor: ele será usado aqui no campo abaixo.
              </li>
              <li className="setup-step">
                <b>Publique o Web App.</b> Clique em <code>Implantar → Nova implantação</code>,
                escolha o tipo <b>App da Web</b> e configure:
                executar como <b>Eu</b> · quem pode acessar: <b>Qualquer pessoa</b>.
                Autorize as permissões e copie a URL terminada em <code>/exec</code>.
              </li>
              <li className="setup-step">
                <b>Conecte.</b> Cole a URL e o token nos campos abaixo, clique em
                <b> Testar conexão</b> e depois em <b>Salvar conexão</b>. Se já houver itens
                locais, use "Enviar itens locais" para subir tudo para a planilha.
              </li>
              <li className="setup-step">
                <b>Atualizou o script depois?</b> Toda mudança no <code>Code.gs</code> exige
                <code> Implantar → Gerenciar implantações → ✎ → Nova versão</code> para entrar no ar.
                A URL permanece a mesma.
              </li>
            </ol>
          </details>

          <div className="form-group">
            <label className="form-group__label">URL do Web App</label>
            <input type="text" className="form-input" value={url}
                   onChange={(e) => setUrl(e.target.value)}
                   placeholder="https://script.google.com/macros/s/.../exec"/>
          </div>

          <div className="form-group">
            <label className="form-group__label">Token de autenticação</label>
            <input type="password" className="form-input" value={token}
                   onChange={(e) => setToken(e.target.value)}
                   placeholder="O mesmo SECRET_TOKEN definido no Apps Script"/>
            <div className="form-group__hint">
              Recomenda-se uma string longa e aleatória (mínimo 24 caracteres).
            </div>
          </div>

          <div style={{ display: 'flex', gap: 10, marginTop: 8, marginBottom: 12 }}>
            <button type="button" className="btn" onClick={handleTest}
                    disabled={testing || !url.trim() || !token.trim()}>
              {testing ? 'Testando…' : 'Testar conexão'}
            </button>
            {items && items.length > 0 && (
              <button type="button" className="btn" onClick={handleUpload}
                      disabled={uploading || !url.trim() || !token.trim()}>
                {uploading ? 'Enviando…' : `Enviar ${items.length} itens locais`}
              </button>
            )}
            {config && (
              <button type="button" className="btn btn--danger" onClick={handleDisconnect}
                      style={{ marginLeft: 'auto' }}>
                Desconectar
              </button>
            )}
          </div>

          {testResult && (
            <div className={`test-result ${testResult.ok ? 'test-result--ok' : 'test-result--err'}`}>
              {testResult.ok ? '✓ ' : '✕ '}{testResult.msg}
            </div>
          )}
          {testResult && !testResult.ok && /token/i.test(testResult.msg) && (
            <div className="help-block" style={{ marginTop: 10 }}>
              <b>"Token inválido" com os dados certos?</b> Em 9 de 10 casos a causa é o deploy
              desatualizado: o Apps Script só passa a usar o novo código/token depois de
              <code> Implantar → Gerenciar implantações → ✎ → Versão: Nova versão → Implantar</code>.
              Salvar o arquivo no editor <b>não</b> atualiza o Web App.
              Confira também: (1) se você criou uma <b>Nova implantação</b> em vez de editar a
              existente, a URL mudou — use a URL mais recente; (2) espaços ou quebra de linha
              no valor do <code>SECRET_TOKEN</code> dentro do script.
            </div>
          )}
        </div>

        <footer className="modal__footer">
          <button type="button" className="btn" onClick={onClose}>Cancelar</button>
          <button type="button" className="btn btn--primary" onClick={handleSave}
                  disabled={!url.trim() || !token.trim()}>
            Salvar conexão
          </button>
        </footer>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// MAIN APP
// ────────────────────────────────────────────────────────────────────────────
function App() {
  const [theme, toggleTheme] = useTheme();
  const [query, setQuery] = useState('');
  const [activeTab, setActiveTab] = useState('Hoje');
  const [view, setView] = useState('dashboard'); // dashboard | kanban | notas | calendario | relatorios | equipe | foco
  const [drawerOpen, setDrawerOpen] = useState(false); // menu mobile
  const [viewAnim, setViewAnim] = useState(false); // dispara animação ao trocar de view
  const [workspace, setWorkspace] = useState(() => {
    try { return localStorage.getItem('villares_workspace') || 'logistica'; } catch { return 'logistica'; }
  });
  const [wsSwapping, setWsSwapping] = useState(false);
  const changeWorkspace = (w) => {
    if (w === workspace) return;
    setWorkspace(w);
    try { localStorage.setItem('villares_workspace', w); } catch {}
    setWsSwapping(true);
    setTimeout(() => setWsSwapping(false), 460);
    sfx.tick && sfx.tick();
  };
  const [selDate, setSelDate] = useState(() => { const d = D.operationalDate(new Date()); d.setHours(12, 0, 0, 0); return d; });
  const shiftSelDate = (delta) => {
    setSelDate(prev => { const d = new Date(prev); d.setDate(d.getDate() + delta); return d; });
    setActiveTab('Hoje');
  };
  const [filterPrio, setFilterPrio] = useState('Todas');
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifRead, setNotifRead] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('villares_notif_read') || '[]')); }
    catch { return new Set(); }
  });
  const saveRead = (set) => {
    setNotifRead(set);
    try { localStorage.setItem('villares_notif_read', JSON.stringify([...set])); } catch {}
  };
  const [notifDismissed, setNotifDismissed] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('villares_notif_dismissed') || '[]')); }
    catch { return new Set(); }
  });
  const dismissNotif = (id) => {
    const next = new Set([...notifDismissed, id]);
    setNotifDismissed(next);
    try { localStorage.setItem('villares_notif_dismissed', JSON.stringify([...next])); } catch {}
  };
  const [filterCat, setFilterCat] = useState('Todas');
  const [density, setDensity] = useState(() => {
    try { return localStorage.getItem('villares_planner_density') || 'detalhada'; } catch { return 'detalhada'; }
  });
  const toggleDensity = () => setDensity(prev => {
    const next = prev === 'detalhada' ? 'compacta' : 'detalhada';
    try { localStorage.setItem('villares_planner_density', next); } catch {}
    return next;
  });
  const [lastUpdate, setLastUpdate] = useState('agora');

  // ── API config (Google Sheets) ──
  const [apiConfig, setApiConfig] = useState(() => {
    try {
      const saved = localStorage.getItem('villares_planner_api');
      if (saved) {
        const parsed = JSON.parse(saved);
        // Descarta URLs corrompidas (sem https://)
        if (parsed?.url && !parsed.url.startsWith('https://')) return null;
        return parsed;
      }
    } catch {}
    return null;
  });
  useEffect(() => {
    try {
      if (apiConfig) localStorage.setItem('villares_planner_api', JSON.stringify(apiConfig));
      else localStorage.removeItem('villares_planner_api');
    } catch {}
  }, [apiConfig]);

  const api = useMemo(() => apiConfig ? createApi(apiConfig.url, apiConfig.token) : null, [apiConfig]);

  // syncStatus: 'idle' | 'syncing' | 'synced' | 'error' | 'offline'
  const [syncStatus, setSyncStatus] = useState(apiConfig ? 'syncing' : 'offline');
  const [syncError, setSyncError] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [showOnboarding, setShowOnboarding] = useState(() => {
    try { return localStorage.getItem('villares_onboarded') !== 'sim'; } catch { return true; }
  });
  const [showTypePicker, setShowTypePicker] = useState(false);
  const finishOnboarding = () => {
    setShowOnboarding(false);
    try { localStorage.setItem('villares_onboarded', 'sim'); } catch {}
    // Após a apresentação na primeira vez, oferece a escolha do tipo de planner
    let jaEscolheu = true;
    try { jaEscolheu = localStorage.getItem('villares_type_chosen') === 'sim'; } catch {}
    if (!jaEscolheu) setShowTypePicker(true);
  };
  const chooseType = (w) => {
    changeWorkspace(w);
    setShowTypePicker(false);
    try { localStorage.setItem('villares_type_chosen', 'sim'); } catch {}
  };

  // Items: persistido em localStorage como cache; quando API conectada, sincroniza
  const [items, setItems] = useState(() => {
    try {
      const saved = localStorage.getItem('villares_planner_items');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch {}
    return D.MOCK_ITEMS;
  });

  // Items do workspace ativo. Itens antigos sem campo workspace contam como 'logistica'.
  const wsItems = useMemo(
    () => items.filter(it => (it.workspace || 'logistica') === workspace),
    [items, workspace]
  );
  const notifCount = useMemo(() =>
    buildNotifs(wsItems).filter(n => !notifRead.has(n.id) && !notifDismissed.has(n.id)).length
  , [wsItems, notifRead, notifDismissed]);
  useEffect(() => {
    try { localStorage.setItem('villares_planner_items', JSON.stringify(items)); } catch {}
  }, [items]);

  // ── Carrega da API quando configurada / muda ──
  const pendingWritesRef = useRef(new Map()); // id -> timestamp de escrita local recente

  const loadFromApi = async () => {
    if (!api) { setSyncStatus('offline'); return; }
    setSyncStatus('syncing');
    setSyncError(null);
    try {
      let remoteItems = await api.list();
      if (Array.isArray(remoteItems)) {
        // Normaliza estados por-dia que vieram serializados como JSON string
        remoteItems = remoteItems.map(it => {
          const out = { ...it };
          if (typeof out.andamentos === 'string' && out.andamentos.trim()) {
            try { out.andamentos = JSON.parse(out.andamentos); } catch { out.andamentos = []; }
          }
          if (typeof out.falhas === 'string' && out.falhas.trim()) {
            try { out.falhas = JSON.parse(out.falhas); } catch { out.falhas = []; }
          }
          return out;
        });
        // Reconciliação: a planilha tem atraso de indexação após uma escrita.
        // Para QUALQUER item escrito localmente há <20s, a versão LOCAL vence —
        // mesmo que o id já exista no remoto (senão o remoto antigo sobrescreve a mudança).
        const remoteById = new Map(remoteItems.map(r => [r.id, r]));
        const agora = Date.now();
        setItems(prev => {
          const localById = new Map(prev.map(it => [it.id, it]));
          const pendentesIds = new Set();
          pendingWritesRef.current.forEach((ts, id) => {
            if ((agora - ts) < 20000) pendentesIds.add(id);
          });
          // Começa do remoto, mas sobrescreve com o local onde há escrita pendente recente
          const merged = remoteItems.map(r => (pendentesIds.has(r.id) && localById.has(r.id)) ? localById.get(r.id) : r);
          // Adiciona itens locais pendentes que ainda não voltaram do remoto
          prev.forEach(it => { if (pendentesIds.has(it.id) && !remoteById.has(it.id)) merged.unshift(it); });
          // limpa marcas antigas (>20s) — assume que já sincronizaram
          pendingWritesRef.current.forEach((ts, id) => {
            if ((agora - ts) >= 20000) pendingWritesRef.current.delete(id);
          });
          return merged;
        });
        setSyncStatus('synced');
        setLastUpdate('agora');
      }
    } catch (err) {
      console.error('Sync error:', err);
      setSyncStatus('error');
      setSyncError(err.message);
    }
  };
  // Marca um id como escrito localmente (para a reconciliação preservá-lo)
  const markPending = (id) => { pendingWritesRef.current.set(id, Date.now()); };

  useEffect(() => {
    if (api) loadFromApi();
    else setSyncStatus('offline');
  // eslint-disable-next-line
  }, [api]);

  // Modal item + menu
  const [modalOpen, setModalOpen] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [falhaTarget, setFalhaTarget] = useState(null); // item aguardando motivo de falha
  const [deleteTarget, setDeleteTarget] = useState(null); // { item, dia } aguardando confirmação de exclusão
  const [quickActionItem, setQuickActionItem] = useState(null); // item da notificação para ação rápida
  const [openMenuId, setOpenMenuId] = useState(null);

  // Click outside fecha menu
  useEffect(() => {
    if (!openMenuId) return;
    const onClick = (e) => {
      if (!e.target.closest('.dropdown')) setOpenMenuId(null);
    };
    const onKey = (e) => { if (e.key === 'Escape') setOpenMenuId(null); };
    const t = setTimeout(() => {
      document.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);
    }, 0);
    return () => {
      clearTimeout(t);
      document.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [openMenuId]);

  const handleNavigate = (v) => {
    setView(v);
    setDrawerOpen(false);
    setViewAnim(true);
    setTimeout(() => setViewAnim(false), 360);
  };

  const SYNC_LABELS = {
    'idle':    'Pronto', 'syncing': 'Sincronizando…', 'synced':  'Sincronizado',
    'error':   'Erro de sincronização', 'offline': 'Modo local',
  };
  const SYNC_TITLES = {
    'idle':    'Aguardando', 'syncing': 'Sincronizando com Google Sheets',
    'synced':  'Conectado ao Google Sheets',
    'error':   'Erro ao sincronizar — clique para abrir as configurações',
    'offline': 'Sem conexão com Google Sheets — clique para configurar',
  };

  const [prefillDate, setPrefillDate] = useState(null);
  const handleNew = () => { setEditingItem(null); setPrefillDate(null); setModalOpen(true); };
  const handleNewOnDay = (d) => {
    setEditingItem(null);
    setPrefillDate(D.localISO(new Date(d)));
    setModalOpen(true);
  };

  // Atalhos de teclado (power user) — ignora quando digitando em campo
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      const digitando = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
      const algumModal = modalOpen || settingsOpen || showOnboarding || showTypePicker || !!falhaTarget || !!quickActionItem;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      // "/" foca a busca
      if (e.key === '/' && !digitando && !algumModal) {
        e.preventDefault();
        const el = document.getElementById('topbar-search-input');
        if (el) el.focus();
        return;
      }
      if (digitando || algumModal) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); handleNew(); }
      else if (e.key === 't' || e.key === 'T') { const d = D.operationalDate(new Date()); d.setHours(12,0,0,0); setSelDate(d); setActiveTab('Hoje'); }
      else if (e.key === 'ArrowLeft') shiftSelDate(-1);
      else if (e.key === 'ArrowRight') shiftSelDate(1);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [modalOpen, settingsOpen, showOnboarding, showTypePicker, falhaTarget, quickActionItem]);
  const handleEdit = (item) => { setEditingItem(item); setModalOpen(true); };
  const handleModalClose = () => { setModalOpen(false); setEditingItem(null); };

  const idCounterRef = useRef(0);
  const generateId = (origem) => {
    const prefix = origem === 'Projeto' ? 'P' : origem === 'Rotina' ? 'R' : 'D';
    idCounterRef.current += 1;
    const rand = Math.random().toString(36).slice(2, 6);
    return `${prefix}-${Date.now().toString(36)}-${idCounterRef.current}${rand}`;
  };

  // Sync funciona em http:// e também em file:// (JSONP + POST text/plain)
  const canSync = () => !!api;

  // Prepara um item de rotina para envio: serializa estados por-dia em JSON
  // (a planilha guarda como texto; ao ler de volta, parseamos em loadFromApi)
  const stripEffemeral = (item) => {
    const out = { ...item };
    if (Array.isArray(out.andamentos)) out.andamentos = JSON.stringify(out.andamentos);
    if (Array.isArray(out.falhas)) out.falhas = JSON.stringify(out.falhas);
    return out;
  };

  // Operações: otimistas (atualiza UI primeiro) + sincroniza com API
  const persistItem = async (merged) => {
    // Agenda/limpa a confirmação de "em andamento" de forma central (cobre todos os caminhos)
    if (!D.temDias(merged)) {
      if (merged.status === 'Em Andamento') agendarConfirmacao(merged);
      else limparConfirmacao(merged.id);
    }
    setItems(prev => prev.map(it => it.id === merged.id ? merged : it));
    markPending(merged.id);
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.update(merged); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  const handleModalSave = async (data) => {
    if (editingItem) {
      const merged = { ...editingItem, ...data };
      // Virou Falha agora? Pede o motivo antes de salvar.
      if (data.status === 'Falha' && !data.falhaMotivo) {
        handleModalClose();
        setFalhaTarget(merged);
        return;
      }
      // Saiu de Falha → limpa o motivo
      if (data.status !== 'Falha' && merged.falhaMotivo) {
        merged.falhaMotivo = ''; merged.falhaCategoria = '';
      }
      setItems(prev => prev.map(it => it.id === editingItem.id ? merged : it));
      handleModalClose();
      if (canSync()) {
        setSyncStatus('syncing');
        try {
          await api.update(merged);
          await loadFromApi(); // recarrega da planilha logo após o envio
        } catch (err) {
          setSyncStatus('error'); setSyncError(err.message);
        }
      }
    } else {
      const { conclusoes, ultimaConclusao, ...cleanData } = data;
      const newItem = { id: generateId(data.origem), workspace, ...cleanData };
      setItems(prev => [newItem, ...prev]);
      markPending(newItem.id);
      handleModalClose();
      if (canSync()) {
        setSyncStatus('syncing');
        try {
          await api.create(newItem);
          await loadFromApi(); // recarrega da planilha logo após o envio
        } catch (err) {
          setSyncStatus('error'); setSyncError(err.message);
        }
      }
    }
  };

  // Rotina: marcar/desmarcar EM ANDAMENTO no dia (exclusivo com feito/falha)
  const handleRotinaAndamento = async (item, occDate) => {
    const dia = occDate ? new Date(occDate) : new Date();
    const iso = D.localISO(dia);
    const jaAnd = D.rotinaAndamentoNoDia(item, dia);
    const andamentos = jaAnd
      ? (item.andamentos || []).filter(x => x !== iso)
      : [...(item.andamentos || []), iso];
    // andamento remove conclusão e falha do dia
    const conclusoes = (item.conclusoes || []).filter(x => x !== iso);
    const falhas = (item.falhas || []).filter(f => f.data !== iso);
    const updated = { ...item, andamentos, conclusoes, falhas };
    setItems(prev => prev.map(it => it.id === item.id ? updated : it));
    markPending(item.id);
    if (!jaAnd) sfx.add();
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.update(stripEffemeral(updated)); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  // Rotina: marcar FALHA no dia com motivo (exclusivo)
  const handleRotinaFalha = async (item, occDate, info) => {
    const dia = occDate ? new Date(occDate) : new Date();
    const iso = D.localISO(dia);
    const falhasSemDia = (item.falhas || []).filter(f => f.data !== iso);
    const falhas = [...falhasSemDia, { data: iso, categoria: info.falhaCategoria, motivo: info.falhaMotivo }];
    const conclusoes = (item.conclusoes || []).filter(x => x !== iso);
    const andamentos = (item.andamentos || []).filter(x => x !== iso);
    const updated = { ...item, falhas, conclusoes, andamentos };
    setItems(prev => prev.map(it => it.id === item.id ? updated : it));
    markPending(item.id);
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.update(stripEffemeral(updated)); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  // Rotina: desfazer falha do dia
  const handleRotinaClearFalha = async (item, occDate) => {
    const dia = occDate ? new Date(occDate) : new Date();
    const iso = D.localISO(dia);
    const falhas = (item.falhas || []).filter(f => f.data !== iso);
    const updated = { ...item, falhas };
    setItems(prev => prev.map(it => it.id === item.id ? updated : it));
    markPending(item.id);
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.update(stripEffemeral(updated)); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  // Kanban: mover card de coluna = mudar status (otimista + sync)
  const handleSetStatus = async (item, newStatus) => {
    if (item.status === newStatus) return;
    const updated = { ...item, status: newStatus };
    setItems(prev => prev.map(it => it.id === item.id ? updated : it));
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.update(updated); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  // occDate: a data da OCORRÊNCIA sendo marcada (default: hoje).
  // Para rotinas, cada data tem registro próprio — concluir/reabrir
  // afeta exclusivamente aquele dia.
  const handleToggleComplete = async (item, occDate) => {
    const dia = occDate ? new Date(occDate) : new Date();
    const jaFeito = D.temDias(item) ? D.rotinaFeitaNoDia(item, dia) : D.isFeito(item);
    if (!jaFeito) sfx.complete(); else sfx.tick();
    if (D.temDias(item)) {
      const iso = D.localISO(dia);
      const feitaNoDia = D.rotinaFeitaNoDia(item, dia);
      const lista = Array.isArray(item.conclusoes) ? item.conclusoes : [];
      const conclusoes = feitaNoDia ? lista.filter(x => x !== iso) : [...lista, iso];
      // legado: só limpa "Última Conclusão" se ela apontar para ESTE dia
      const legadoBate = item.ultimaConclusao &&
        D.localISO(D.parseLocalDate(item.ultimaConclusao)) === iso;
      // ao concluir, limpa andamento e falha do mesmo dia (exclusivos)
      const andamentos = (Array.isArray(item.andamentos) ? item.andamentos : []).filter(x => x !== iso);
      const falhas = (Array.isArray(item.falhas) ? item.falhas : []).filter(f => f.data !== iso);
      const updated = { ...item, conclusoes, andamentos, falhas,
        ultimaConclusao: legadoBate ? '' : (item.ultimaConclusao || '') };
      setItems(prev => prev.map(it => it.id === item.id ? updated : it));
      markPending(item.id);
      if (canSync()) {
        setSyncStatus('syncing');
        try {
          await api.concluir({ id: item.id, data: iso, done: !feitaNoDia, titulo: item.titulo });
          await loadFromApi();
        } catch (err) {
          setSyncStatus('error');
          setSyncError(/desconhecida/i.test(err.message)
            ? 'Seu Code.gs publicado é antigo e não grava conclusões por dia. Cole o Code.gs mais recente e faça: Implantar → Gerenciar implantações → ✎ → Nova versão. As abas Segunda–Domingo serão criadas sozinhas.'
            : err.message);
        }
      }
      return;
    }
    const isFeito = D.isFeito(item);
    let updated;
    {
      const newStatus = isFeito
        ? (item.origem === 'Pedido' ? 'Recebido' : 'Pendente')
        : 'Concluído';
      updated = { ...item, status: newStatus };
    }
    setItems(prev => prev.map(it => it.id === item.id ? updated : it));
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.update(updated); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  const handleDuplicate = async (item) => {
    // Remove campos efêmeros que não devem ir para a planilha
    const { conclusoes, ultimaConclusao, falhaMotivo, falhaCategoria, ...base } = item;
    const copy = {
      ...base,
      id: generateId(item.origem),
      titulo: `${item.titulo} (cópia)`,
      criadoEm: D.localISO(),
      status: 'Pendente',
    };
    setItems(prev => [copy, ...prev]);
    markPending(copy.id);
    if (canSync()) {
      setSyncStatus('syncing');
      try {
        await api.create(copy);
        await loadFromApi();
      } catch (err) {
        // Em caso de falha, mantém a cópia local mas avisa
        setSyncStatus('error');
        setSyncError('Não foi possível salvar a cópia na planilha: ' + err.message);
      }
    }
  };

  // Abre o modal de exclusão (escolha dia/geral fica no modal)
  const handleDelete = (item, dia) => {
    setDeleteTarget({ item, dia: dia ? new Date(dia) : new Date() });
  };

  // Exclusão definitiva (rotina inteira ou item normal)
  const handleDeleteAll = async (item) => {
    setDeleteTarget(null);
    setItems(prev => prev.filter(it => it.id !== item.id));
    if (canSync()) {
      setSyncStatus('syncing');
      try { await api.delete(item.id); await loadFromApi(); }
      catch (err) { setSyncStatus('error'); setSyncError(err.message); }
    }
  };

  // Excluir só um dia de uma rotina (adiciona à lista de exceções) — não apaga a rotina
  const handleSkipDay = (item, occDate) => {
    setDeleteTarget(null);
    const dia = occDate ? new Date(occDate) : new Date();
    const iso = D.localISO(dia);
    const excecoes = [...(item.excecoes || [])];
    if (!excecoes.includes(iso)) excecoes.push(iso);
    // limpa estados daquele dia (conclusão/andamento/falha) por consistência
    const limpa = (arr) => (arr || []).filter(x => (typeof x === 'string' ? x !== iso : x.data !== iso));
    persistItem({
      ...item, excecoes,
      conclusoes: limpa(item.conclusoes),
      andamentos: limpa(item.andamentos),
      falhas: limpa(item.falhas),
    });
  };

  const handleSettingsSave = (config) => {
    setApiConfig(config);
    setSettingsOpen(false);
  };

  // Ordenação por header
  const [sortBy, setSortBy] = useState('hora');
  const [sortDir, setSortDir] = useState('asc');
  // "Dia logístico": hora em que o dia começa (0 = meia-noite normal; 18 = turno noturno).
  // Com 18, horários 00:00–17:59 contam como continuação do dia anterior na ordenação.
  const [dayStart, setDayStart] = useState(() => {
    try { return parseInt(localStorage.getItem('villares_day_start') || '0', 10) || 0; } catch { return 0; }
  });
  const changeDayStart = (h) => {
    setDayStart(h);
    try { localStorage.setItem('villares_day_start', String(h)); } catch {}
  };
  const handleSort = (key) => {
    if (sortBy === key) {
      if (sortDir === 'asc') setSortDir('desc');
      else { setSortBy(null); setSortDir('asc'); }
    } else {
      setSortBy(key);
      setSortDir('asc');
    }
  };

  const today = useMemo(() => {
    return new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '');
  }, []);

  // Refresh manual: se tem API, recarrega; senão só atualiza timestamp
  const refresh = () => {
    if (api) loadFromApi();
    else setLastUpdate('agora');
  };

  useEffect(() => {
    let mins = 0;
    const id = setInterval(() => {
      mins += 1;
      setLastUpdate(mins === 1 ? 'há 1 min' : `há ${mins} min`);
    }, 60000);
    return () => clearInterval(id);
  }, [api]);

  // ── Alarme: pede permissão e dispara notificação real perto do horário ──
  const [alarmEnabled, setAlarmEnabled] = useState(() => {
    try { return localStorage.getItem('villares_alarm') === 'on'; } catch { return false; }
  });
  const alarmedRef = useRef(new Set()); // ids já alarmados nesta sessão
  const confirmTimersRef = useRef({});   // timers de confirmação de "em andamento"
  const alarmLoopRef = useRef(null);     // intervalo do alarme tocando em loop (fallback Web Audio)
  const alarmAudioRef = useRef(null);    // elemento <audio> HTML5 (motor principal, robusto após sleep)
  const getAlarmAudio = () => {
    if (!alarmAudioRef.current) {
      const a = new Audio(ALARM_WAV);
      a.loop = true; a.preload = 'auto'; a.volume = 0.9;
      alarmAudioRef.current = a;
    }
    return alarmAudioRef.current;
  };
  const [alarmeAtivo, setAlarmeAtivo] = useState(false); // alarme em loop tocando agora

  // Agenda uma confirmação 10 min após marcar algo "em andamento":
  // o app pergunta se ainda está sendo feito (caso a pessoa tenha esquecido).
  // Marca o momento em que a tarefa entrou em andamento (timestamp real).
  // A verificação é feita no loop 'check' comparando com o relógio — assim
  // funciona mesmo se o PC dormir/bloquear (setTimeout seria pausado).
  const agendarConfirmacao = (it) => {
    if (!it || !it.id) return;
    try {
      const mapa = JSON.parse(localStorage.getItem('villares_andamento_since') || '{}');
      mapa[it.id] = Date.now();
      localStorage.setItem('villares_andamento_since', JSON.stringify(mapa));
    } catch {}
  };
  const limparConfirmacao = (id) => {
    try {
      const mapa = JSON.parse(localStorage.getItem('villares_andamento_since') || '{}');
      if (mapa[id] != null) { delete mapa[id]; localStorage.setItem('villares_andamento_since', JSON.stringify(mapa)); }
    } catch {}
  };

  // AudioContext persistente — criado/destravado por gesto do usuário (ativar alarme)
  const alarmCtxRef = useRef(null);
  const getAlarmCtx = () => {
    try {
      if (!alarmCtxRef.current) {
        alarmCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      // navegadores suspendem o contexto fora de gesto — tenta retomar sempre
      if (alarmCtxRef.current.state === 'suspended') alarmCtxRef.current.resume();
      return alarmCtxRef.current;
    } catch { return null; }
  };

  // Toque curto (confirmações)
  const beep = () => {
    const ctx = getAlarmCtx(); if (!ctx) return;
    const notes = [880, 1175, 1568];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.start(t); o.stop(t + 0.18);
    });
  };

  // ALARME de verdade — padrão repetido, mais alto e insistente
  const alarmTimerRef = useRef(null);
  // Toque base — os três tons originais (lá, ré, sol), limpos e secos
  const toqueBase = (t0, vol = 0.26) => {
    const ctx = getAlarmCtx(); if (!ctx) return;
    const notes = [880, 1175, 1568];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.start(t); o.stop(t + 0.18);
    });
  };

  // ALARME (na hora): repete o toque original 4x — vira um alarme insistente
  // Toca o padrão de alarme UMA vez (uma sequência dos 3 toques)
  const tocarSequencia = (vol = 0.3) => {
    const ctx = getAlarmCtx(); if (!ctx) return;
    toqueBase(ctx.currentTime, vol);
  };
  // ALARME REAL: fica tocando em loop até parar (pararAlarme).
  const tocarAlarme = () => {
    pararAlarme();              // garante que não há outro loop ativo
    setAlarmeAtivo(true);
    // Motor principal: <audio> HTML5 em loop (sobrevive melhor a sleep/lock que o Web Audio)
    try {
      const a = getAlarmAudio();
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {}); // se o navegador bloquear, o Web Audio abaixo cobre
    } catch {}
    // Camada extra (Web Audio) — caso o <audio> seja bloqueado
    tocarSequencia(0.3);
    let ciclos = 0;
    alarmLoopRef.current = setInterval(() => {
      ciclos++;
      if (ciclos > 75) { pararAlarme(); return; }  // trava de segurança (~2,7 min)
      const ctx = getAlarmCtx();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      // só usa o Web Audio se o <audio> não estiver tocando
      const a = alarmAudioRef.current;
      if (!a || a.paused) tocarSequencia(0.3);
    }, 2200);
  };
  // Para o alarme em loop (chamado ao clicar/agir na notificação)
  const pararAlarme = () => {
    if (alarmLoopRef.current) { clearInterval(alarmLoopRef.current); alarmLoopRef.current = null; }
    if (alarmAudioRef.current) { try { alarmAudioRef.current.pause(); alarmAudioRef.current.currentTime = 0; } catch {} }
    setAlarmeAtivo(false);
  };
  // Aviso (10 min antes / confirmação): um único toque suave, NÃO entra em loop
  const tocarAviso = () => {
    const ctx = getAlarmCtx(); if (!ctx) return;
    toqueBase(ctx.currentTime, 0.2);
  };

  const enableAlarm = async () => {
    if (!('Notification' in window)) { alert('Seu navegador não suporta notificações.'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      setAlarmEnabled(true);
      try { localStorage.setItem('villares_alarm', 'on'); } catch {}
      // Destrava o AudioContext E o elemento <audio> AGORA (gesto do usuário),
      // para o alarme tocar depois automaticamente — inclusive após o PC dormir.
      const ctx = getAlarmCtx();
      if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch {} }
      try {
        const a = getAlarmAudio();
        a.volume = 0.9;
        await a.play();          // toca a prévia (gesto válido destrava o autoplay)
        setTimeout(() => { try { a.pause(); a.currentTime = 0; } catch {} }, 900); // só a prévia
      } catch {
        tocarSequencia(0.25);    // fallback se o <audio> não tocar
      }
      new Notification('Villares Planner', { body: 'Alarme ativado ✓ — você ouvirá um toque na hora das tarefas', silent: true });
    } else {
      alert('Permissão de notificação negada. Ative nas configurações do navegador para usar o alarme.');
    }
  };
  const disableAlarm = () => {
    pararAlarme();   // se estiver tocando, silencia imediatamente
    setAlarmEnabled(false);
    try { localStorage.setItem('villares_alarm', 'off'); } catch {}
  };

  // Dispara o alarme (som + notificação), com fallback se a notificação falhar
  const dispararAlarme = (it, momento) => {
    // Som conforme o momento: alarme forte na hora/atraso, aviso suave nos demais
    if (momento === 'agora' || momento === 'atrasado') tocarAlarme();
    else tocarAviso();

    const desc = it.descricao ? ` — ${String(it.descricao).split('\n')[0]}` : '';
    const corpo =
      momento === 'agora'     ? 'Está na hora' + desc :
      momento === 'atrasado'  ? `Passou das ${it.hora} — ainda pendente` + desc :
      momento === 'confirmar' ? 'Ainda está em andamento? Toque para atualizar.' :
                                'Começa em 10 minutos' + desc;
    const emoji =
      momento === 'agora' ? '⏰' : momento === 'atrasado' ? '⚠️' :
      momento === 'confirmar' ? '🔄' : '🔔';
    const forte = momento === 'agora' || momento === 'atrasado' || momento === 'confirmar';
    let mostrou = false;
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        const n = new Notification(`${emoji} ${it.hora} · ${it.titulo}`, {
          body: corpo, tag: it.id + '-' + momento,
          requireInteraction: forte,
        });
        n.onclick = () => { window.focus(); pararAlarme(); setQuickActionItem(it); n.close(); };
        mostrou = true;
      }
    } catch {}
    // Alarme real (na hora/atraso): SEMPRE abre o popup in-app — é onde fica o "Silenciar".
    // Para avisos ('breve'/'confirmar'): só abre o popup se a notificação do navegador falhou.
    const ehAlarme = momento === 'agora' || momento === 'atrasado';
    if (ehAlarme || (!mostrou && forte)) setQuickActionItem(it);
  };

  // Verifica a cada 20s: avisa 10min antes E na hora exata (eventos independentes)
  useEffect(() => {
    if (!alarmEnabled) return;
    const check = () => {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const opNow = D.operationalDate(now);  // dia operacional (madrugada conta como dia anterior)
      const iso = D.localISO(opNow);
      items.forEach(it => {
        if (!it.hora || !/^\d{1,2}:\d{2}$/.test(it.hora)) return;
        const relevante = D.temDias(it)
          ? (D.rotinaNoDia(it, opNow) && !D.rotinaFeitaNoDia(it, opNow) && !D.rotinaFalhaNoDia(it, opNow))
          : (D.isAtivo(it) && it.status !== 'Falha' && it.prazo && D.diasAteHoje(it.prazo) === 0);
        if (!relevante) return;
        const [h, m] = String(it.hora).split(':').map(Number);
        const faltam = (h * 60 + m) - nowMin;

        // Aviso antecipado: janela 8–10 min antes (uma vez)
        const kPre = it.id + ':' + iso + ':pre';
        if (faltam >= 8 && faltam <= 10 && !alarmedRef.current.has(kPre)) {
          alarmedRef.current.add(kPre);
          dispararAlarme(it, 'breve');
        }
        // Alarme na hora (e recuperação): dispara na hora exata OU se já passou
        // há até 2h e ainda não foi avisado (ex.: app estava fechado). Uma vez só.
        const kNow = it.id + ':' + iso + ':now';
        if (faltam <= 0 && faltam >= -120 && !alarmedRef.current.has(kNow)) {
          alarmedRef.current.add(kNow);
          // se já passou muito da hora, marca como "atrasado", senão "agora"
          dispararAlarme(it, faltam <= -2 ? 'atrasado' : 'agora');
        }
      });

      // ── Confirmação de "em andamento" por timestamp (resistente a sleep) ──
      let mapa = {};
      try { mapa = JSON.parse(localStorage.getItem('villares_andamento_since') || '{}'); } catch {}
      Object.keys(mapa).forEach(id => {
        const desde = mapa[id];
        const atual = items.find(x => x.id === id);
        // se a tarefa sumiu ou não está mais em andamento, limpa
        if (!atual || D.STATUS_BUCKET[atual.status] !== 'andamento') { limparConfirmacao(id); return; }
        // passou 10 min desde que entrou em andamento? confirma (uma vez)
        if (Date.now() - desde >= 10 * 60 * 1000) {
          const kConf = id + ':conf:' + Math.floor(desde / 60000);
          if (!alarmedRef.current.has(kConf)) {
            alarmedRef.current.add(kConf);
            dispararAlarme(atual, 'confirmar');
          }
          limparConfirmacao(id); // não repete; se continuar em andamento, nova marcação seria preciso
        }
      });
    };
    check();
    const id = setInterval(check, 20000);
    // Ao voltar de bloqueio/sleep ou trocar de aba, verifica IMEDIATAMENTE
    const onVis = () => { if (!document.hidden) check(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('focus', onVis); };
  }, [alarmEnabled, items]);

  // ── filtros ──
  const queryFiltered = useMemo(() => {
    let arr = wsItems;
    if (query.trim()) {
      const q = query.toLowerCase();
      arr = arr.filter(it => {
        const blob = `${it.titulo} ${it.descricao || ''} ${it.categoria} ${it.origem} ${it.prazo || ''} ${it.hora || ''} ${it.dias || ''} ${it.status || ''}`.toLowerCase();
        return blob.includes(q);
      });
    }
    if (filterPrio !== 'Todas') arr = arr.filter(it => it.prioridade === filterPrio);
    if (filterCat !== 'Todas') arr = arr.filter(it => D.hasCat(it, filterCat));
    return arr;
  }, [wsItems, query, filterPrio, filterCat]);

  const viewFiltered = queryFiltered;

  const isTodaySel = D.diasAteHoje(selDate) === 0;

  // ── Estado POR DATA SELECIONADA ──
  // Rotinas recorrentes: ativo/concluído sempre relativo à data escolhida no
  // seletor — mudar a data muda o que cada aba mostra, de forma coerente.
  const ativoNoDia = (it) =>
    D.temDias(it)
      ? (D.rotinaNoDia(it, selDate) && !D.rotinaFeitaNoDia(it, selDate))
      : D.isAtivo(it);
  const feitoNoDia = (it) =>
    D.temDias(it) ? D.rotinaFeitaNoDia(it, selDate) : D.isFeito(it);
  // "Resolvido" = saiu da fila: concluído OU falha/não-comparecimento.
  const resolvidoNoDia = (it) =>
    D.temDias(it)
      ? (D.rotinaFeitaNoDia(it, selDate) || D.rotinaFalhaNoDia(it, selDate))
      : (D.isFeito(it) || D.isFalha(it));

  const tabFiltered = useMemo(() => {
    switch (activeTab) {
      case 'Hoje':
        // Hoje real: ativos do dia + atrasados. Outra data: tudo agendado nela.
        return isTodaySel
          ? viewFiltered.filter(it => D.isAtivo(it) && (D.isHoje(it) || D.isAtrasado(it)))
          : occurrencesForDay(viewFiltered, selDate);
      case 'Todos':     return viewFiltered.filter(it => ativoNoDia(it));
      case 'Projeto':   return viewFiltered.filter(it => it.origem === 'Projeto' && D.isAtivo(it));
      // Rotina: TODAS as rotinas (visão de gestão); o status mostrado é o do dia selecionado
      case 'Rotina':    return viewFiltered.filter(it => it.origem === 'Rotina');
      case 'Pedido':    return viewFiltered.filter(it => it.origem === 'Pedido'  && D.isAtivo(it));
      case 'Atrasados': return viewFiltered.filter(D.isAtrasado);
      case 'Andamento': return viewFiltered.filter(it => D.temDias(it)
        ? D.rotinaAndamentoNoDia(it, selDate)
        : (it.origem === 'Demanda' && D.STATUS_BUCKET[it.status] === 'andamento'));
      case 'AndamentoPedido': return viewFiltered.filter(it => it.origem === 'Pedido' && D.STATUS_BUCKET[it.status] === 'andamento');
      case 'AndamentoProjeto': return viewFiltered.filter(it => it.origem === 'Projeto' && D.STATUS_BUCKET[it.status] === 'andamento');
      case 'Concluidos': return viewFiltered.filter(resolvidoNoDia);
      default: return viewFiltered;
    }
  }, [viewFiltered, activeTab, selDate]);

  const tabCounts = useMemo(() => ({
    Hoje:       isTodaySel
                  ? viewFiltered.filter(it => D.isAtivo(it) && (D.isHoje(it) || D.isAtrasado(it))).length
                  : occurrencesForDay(viewFiltered, selDate).length,
    Todos:      viewFiltered.filter(it => ativoNoDia(it)).length,
    Projeto:    viewFiltered.filter(it => it.origem === 'Projeto' && D.isAtivo(it)).length,
    Rotina:     viewFiltered.filter(it => it.origem === 'Rotina').length,
    Pedido:     viewFiltered.filter(it => it.origem === 'Pedido'  && D.isAtivo(it)).length,
    Atrasados:  viewFiltered.filter(D.isAtrasado).length,
    Concluidos: viewFiltered.filter(resolvidoNoDia).length,
  }), [viewFiltered, selDate]);

  // ── ordenação: por urgência (default) ou por coluna selecionada ──
  const rank = (it) => {
    if (D.isAtrasado(it)) return 0;
    if (D.isHoje(it)) return 1;
    if (D.isProximos48h(it)) return 2;
    if (D.isEstaSemana(it)) return 3;
    return 4;
  };
  const prioRank = { 'Crítica': 0, Alta: 1, 'Média': 2, Baixa: 3 };
  const statusRank = { 'Bloqueado': 0, 'Pausado': 1, 'Em Andamento': 2, 'Pendente': 3, 'Recebido': 4, 'Concluído': 5, 'Recusado': 6, 'Cancelado': 7 };

  const sorted = useMemo(() => {
    const arr = [...tabFiltered];
    if (!sortBy) {
      // Default: urgência
      return arr.sort((a, b) => {
        const ra = rank(a), rb = rank(b);
        if (ra !== rb) return ra - rb;
        if (a.prazo && b.prazo) return new Date(a.prazo) - new Date(b.prazo);
        if (a.prazo) return -1;
        if (b.prazo) return 1;
        return 0;
      });
    }
    const dir = sortDir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      let av, bv;
      switch (sortBy) {
        case 'titulo':
          av = (a.titulo || '').toLowerCase();
          bv = (b.titulo || '').toLowerCase();
          break;
        case 'categoria':
          av = (a.categoria || '').toLowerCase();
          bv = (b.categoria || '').toLowerCase();
          break;
        case 'prioridade':
          av = prioRank[a.prioridade] ?? 99;
          bv = prioRank[b.prioridade] ?? 99;
          break;
        case 'criadoEm':
          av = a.criadoEm ? new Date(a.criadoEm).getTime() : 0;
          bv = b.criadoEm ? new Date(b.criadoEm).getTime() : 0;
          break;
        case 'prazo':
          av = a.prazo ? new Date(a.prazo).getTime() : Number.POSITIVE_INFINITY;
          bv = b.prazo ? new Date(b.prazo).getTime() : Number.POSITIVE_INFINITY;
          break;
        case 'hora': {
          // Itens sem hora NUNCA entram no comparador normal — são tratados
          // depois (sempre no fim, independente da direção). Aqui só comparamos
          // os que têm hora, aplicando o offset do "dia logístico".
          const temHora = (h) => h && /^\d{1,2}:\d{2}$/.test(String(h).trim());
          const toMin = (h) => {
            const [hh, mm] = String(h).trim().split(':').map(Number);
            let min = hh * 60 + mm;
            // Dia logístico: horas antes do início do dia "rolam" para o fim.
            // Ex: início 18h → 02:00 vira 26:00, sortando depois de 23:00.
            if (dayStart > 0 && min < dayStart * 60) min += 1440;
            return min;
          };
          const aTem = temHora(a.hora), bTem = temHora(b.hora);
          if (!aTem && !bTem) return 0;
          if (!aTem) return 1;   // a sem hora → fim (sempre, ignora dir)
          if (!bTem) return -1;  // b sem hora → fim
          av = toMin(a.hora);
          bv = toMin(b.hora);
          break;
        }
        case 'status':
          av = statusRank[a.status] ?? 99;
          bv = statusRank[b.status] ?? 99;
          break;
        default:
          return 0;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    // Dedupe por id (proteção contra key duplicada → crash de render)
    const seen = new Set();
    return arr.filter(it => {
      const id = it && it.id;
      if (!id || seen.has(id)) return false;
      seen.add(id); return true;
    });
  }, [tabFiltered, sortBy, sortDir]);

  // ── métricas globais (sobre TODOS os items, não só do tab) ──
  const metrics = useMemo(() => {
    const ehHoje = D.diasAteHoje(selDate) === 0;
    // Itens que "acontecem" na data selecionada
    const doDia = wsItems.filter(it => D.noDia(it, selDate));
    const feitos = doDia.filter(it => D.feitoNoDia(it, selDate));
    const ativos = doDia.filter(it => D.ativoNoDia(it, selDate));
    // Em andamento: coerente com a data selecionada.
    // - rotinas: em andamento NAQUELE dia (estado por dia)
    // - não-rotinas: status 'andamento' E (sem prazo, ou prazo >= dia selecionado)
    //   para não arrastar itens de dias passados que já saíram do radar.
    const andamento = wsItems.filter(it => {
      // O "Em andamento" principal considera APENAS Rotina e Demanda (operacional do dia).
      // Pedido e Projeto têm cards próprios e não entram aqui.
      if (D.temDias(it)) return D.rotinaAndamentoNoDia(it, selDate);
      if (it.origem !== 'Demanda') return false;
      return D.STATUS_BUCKET[it.status] === 'andamento';
    });
    // Em andamento separado por tipo
    const andamentoPedidos = wsItems.filter(it => it.origem === 'Pedido' && D.STATUS_BUCKET[it.status] === 'andamento');
    const andamentoProjetos = wsItems.filter(it => it.origem === 'Projeto' && D.STATUS_BUCKET[it.status] === 'andamento');
    // Vencimentos do dia selecionado (não-rotina com prazo nesse dia, ainda ativos)
    const hoje = wsItems.filter(it => !D.temDias(it) && D.isAtivo(it) && it.prazo && D.mesmoDia(it.prazo, selDate));
    // Atrasados: sempre relativo a hoje real (faz sentido independente da data vista)
    const atrasados = wsItems.filter(D.isAtrasado);
    const total = doDia.length;
    const pct   = total === 0 ? 0 : (feitos.length / total) * 100;
    return { ativos, feitos, atrasados, hoje, andamento, andamentoPedidos, andamentoProjetos, total, pct, ehHoje };
  }, [wsItems, selDate]);

  // ── aside ──
  const upcoming = useMemo(() =>
    wsItems.filter(it => D.isAtivo(it) && it.prazo && D.diasAteHoje(it.prazo) <= 7)
         .sort((a,b) => new Date(a.prazo) - new Date(b.prazo))
         .slice(0, 6)
  , [wsItems]);

  const allCats = useMemo(() =>
    D.getCategorias().map(cat => {
      const cs = wsItems.filter(it => D.hasCat(it, cat) && D.noDia(it, selDate));
      const feitos = cs.filter(it => D.feitoNoDia(it, selDate)).length;
      const total = cs.length;
      return { nome: cat, feitos, total, pct: total === 0 ? 0 : (feitos / total) * 100 };
    }).filter(r => r.total > 0).sort((a, b) => b.total - a.total)
  , [wsItems, selDate, workspace]);

  return (
    <div className="app">
      <div className="ambience"/>
      <Sidebar theme={theme} view={view} onNavigate={handleNavigate}
               onToggleTheme={toggleTheme} onOpenSettings={() => setSettingsOpen(true)}/>

      <MobileDrawer open={drawerOpen} view={view} workspace={workspace}
                    onNavigate={handleNavigate}
                    onChangeWorkspace={(w) => { changeWorkspace(w); setDrawerOpen(false); }}
                    onToggleTheme={toggleTheme} theme={theme}
                    onOpenSettings={() => { setSettingsOpen(true); setDrawerOpen(false); }}
                    onClose={() => setDrawerOpen(false)}/>

      <div className={`main ${wsSwapping ? 'main--ws-swap' : ''}`}>
        <Topbar query={query} onQueryChange={setQuery} onNew={handleNew}
                onOpenDrawer={() => setDrawerOpen(true)}
                workspace={workspace} onChangeWorkspace={changeWorkspace}
                syncStatus={syncStatus} syncLabels={SYNC_LABELS} syncTitles={SYNC_TITLES}
                lastUpdate={lastUpdate} onRefresh={refresh}
                onOpenSettings={() => setSettingsOpen(true)}
                selDate={selDate}
                onDateShift={shiftSelDate}
                onDateToday={() => { const d = D.operationalDate(new Date()); d.setHours(12,0,0,0); setSelDate(d); }}
                onDateSet={(d) => { setSelDate(d); setActiveTab('Hoje'); }}
                notifOpen={notifOpen} setNotifOpen={setNotifOpen}
                notifCount={notifCount} items={wsItems} notifRead={notifRead}
                saveRead={saveRead} handleEdit={handleEdit}
                notifDismissed={notifDismissed} dismissNotif={dismissNotif}
                alarmEnabled={alarmEnabled} onEnableAlarm={enableAlarm} onDisableAlarm={disableAlarm}/>

        <div className="page">
          <PageHeader today={today} workspace={workspace} view={view}
            headerDate={D.diasAteHoje(selDate) === 0
              ? today
              : selDate.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '')}/>

          <div className="view-stage" key={view}>

          {syncStatus === 'error' && syncError && (
            <div className="banner banner--error">
              <Warning size={16} className="banner__icon"/>
              <div className="banner__body">
                <div className="banner__title">Erro de sincronização com Google Sheets</div>
                <div className="banner__text">
                  {syncError.includes('403')
                    ? 'Acesso negado (403). No Apps Script, republique o deploy com "Who has access: Anyone" (sem exigir login Google).'
                    : syncError.includes('NetworkError') || syncError.includes('network')
                    ? 'Sem conexão com o servidor. Verifique a URL do Apps Script nas configurações.'
                    : `${syncError}. Os dados continuam disponíveis localmente.`}
                </div>
              </div>
              <button className="banner__action" onClick={() => setSettingsOpen(true)}>
                Abrir configurações
              </button>
              <button className="banner__close" onClick={() => setSyncError(null)} title="Fechar">
                <X size={14}/>
              </button>
            </div>
          )}

          {!apiConfig && (
            <div className="banner">
              <Layers size={16} className="banner__icon"/>
              <div className="banner__body">
                <div className="banner__title">Modo local</div>
                <div className="banner__text">
                  Os dados estão salvos apenas no navegador. Conecte uma planilha Google Sheets para sincronizar com a equipe.
                </div>
              </div>
              <button className="banner__action" onClick={() => setSettingsOpen(true)}>
                Configurar Google Sheets
              </button>
            </div>
          )}

          {/* HERO: 4 KPI tiles em linha + faixa de conclusão geral abaixo */}
          {view === 'dashboard' && (<>
          <section className="hero">
            <KPI label="Concluídos"  value={metrics.feitos.length}
                 sub={`${Math.round(metrics.pct)}% de taxa de conclusão`}
                 icon={Check} variant="positive"/>
            <KPI label="Em andamento"  value={metrics.andamento.length}
                 onClick={() => setActiveTab('Andamento')}
                 sub={metrics.andamento.length === 0 ? 'Nada em curso' : metrics.andamento.length === 1 ? 'Tarefa em curso' : 'Tarefas em curso'}
                 icon={Loader} variant="info"/>
            <KPI label={metrics.ehHoje ? 'Vencimentos hoje' : 'Vencimentos do dia'}  value={metrics.hoje.length}
                 sub={metrics.hoje.length === 0 ? 'Nenhum vencimento' : 'Concluir no dia'}
                 icon={Clock} variant="warning"/>
            <KPI label="Atrasados"  value={metrics.atrasados.length}
                 sub={metrics.atrasados.length === 0 ? 'Sem atrasos' : 'Requer atenção'}
                 icon={Warning}
                 variant={metrics.atrasados.length > 0 ? "negative" : ""}/>
          </section>
          <section className="hero hero--secondary">
            <KPI label="Pedidos em andamento" value={metrics.andamentoPedidos.length}
                 onClick={() => setActiveTab('AndamentoPedido')}
                 sub={metrics.andamentoPedidos.length === 0 ? 'Nenhum pedido em curso' : metrics.andamentoPedidos.length === 1 ? 'Pedido em curso' : 'Pedidos em curso'}
                 icon={Box} variant="info"/>
            <KPI label="Projetos em andamento" value={metrics.andamentoProjetos.length}
                 onClick={() => setActiveTab('AndamentoProjeto')}
                 sub={metrics.andamentoProjetos.length === 0 ? 'Nenhum projeto em curso' : metrics.andamentoProjetos.length === 1 ? 'Projeto em curso' : 'Projetos em curso'}
                 icon={Layers} variant="info"/>
          </section>
          <section className="hero-bottom">
            <Conclusion
              pct={metrics.pct}
              feitos={metrics.feitos.length}
              ativos={metrics.ativos.length}
              total={metrics.total}
              categorias={allCats}
              rotinasHoje={items.filter(it => D.temDias(it) && D.rotinaNoDia(it, selDate)).length}
            />
          </section>
          </>)}

          {view === 'dashboard' && (<>
          {/* Tabs estilo ML */}
          <Tabs active={activeTab} onChange={setActiveTab} counts={tabCounts}
                selDate={selDate}/>

          {/* Toolbar */}
          <NextUp items={wsItems} onAbrir={handleEdit}/>
          <StatusBar items={tabFiltered} selDate={selDate}/>

          <Toolbar count={sorted.length}
                   sortBy={sortBy}
                   onSortSelect={(key) => { setSortBy(key); setSortDir('asc'); }}
                   prio={filterPrio} onPrio={setFilterPrio}
                   cat={filterCat} onCat={setFilterCat}
                   catList={D.WORKSPACES[workspace].categorias}
                   density={density} onToggleDensity={toggleDensity}/>

          {/* List header + list */}
          <ListHeader sortBy={sortBy} sortDir={sortDir} onSort={handleSort}/>
          {sorted.length === 0 ? (
            <div className="list-empty">
              {activeTab === 'Hoje'
                ? 'Nada para hoje. Aproveite para adiantar o que está vindo nos próximos dias.'
                : 'Nenhum item nesta visualização'}
            </div>
          ) : (
            <div className={`list ${density === 'compacta' ? 'list--compact' : ''}`} key={activeTab + selDate.toISOString().slice(0,10)}>
              {sorted.map(item => (
                <ListRow key={item.id} item={item}
                         occDate={selDate}
                         menuOpen={openMenuId === item.id}
                         onMenuToggle={(id) => setOpenMenuId(prev => prev === id ? null : id)}
                         onEdit={handleEdit}
                         onToggleComplete={handleToggleComplete}
                         onDuplicate={handleDuplicate}
                         onDelete={handleDelete}
                         onSkipDay={handleSkipDay}
                         onMarkFalha={(it, occ) => { if (D.temDias(it)) { setFalhaTarget({ item: it, occDate: occ || selDate }); } else { setFalhaTarget(it); } }}
                         onClearFalha={(it, occ) => { if (D.temDias(it)) handleRotinaClearFalha(it, occ || selDate); else persistItem({ ...it, status: 'Pendente', falhaMotivo: '', falhaCategoria: '' }); }}
                         onSetAndamento={(it, occ) => { if (D.temDias(it)) handleRotinaAndamento(it, occ || selDate); else { persistItem({ ...it, status: 'Em Andamento' }); agendarConfirmacao(it); } }}/>
              ))}
            </div>
          )}

          </>)}

          {/* Aside grid — só no dashboard */}
          {view === 'dashboard' && (
            <div className="aside-grid">
              <UpcomingPanel items={upcoming}/>
              <CategoriesPanel data={allCats}/>
            </div>
          )}

          {view === 'dashboard' && <InsightsPanel items={wsItems} selDate={selDate}/>}
          {view === 'dashboard' && <HabitsPanel items={wsItems}/>}

          {view === 'kanban' && (
            <KanbanView items={queryFiltered} onEdit={handleEdit} onSetStatus={handleSetStatus}
                        onToggle={handleToggleComplete} selDate={selDate}/>
          )}
          {view === 'notas' && <NotesView/>}
          {view === 'calendario' && <CalendarView items={queryFiltered} onEdit={handleEdit}
                                                   selDate={selDate} onSelDate={setSelDate}/>}
          {view === 'relatorios' && <ReportsView items={wsItems} allCats={allCats} metrics={metrics} selDate={selDate}/>}
          {view === 'equipe' && <TeamView items={wsItems} onEdit={handleEdit}/>}

          {view === 'semana' && <WeekView items={wsItems} selDate={selDate} onEdit={handleEdit}
                                          onToggle={handleToggleComplete}
                                          onAddDay={handleNewOnDay}
                                          onJumpDay={(d) => { const x = new Date(d); x.setHours(12,0,0,0); setSelDate(x); setView('dashboard'); setActiveTab('Hoje'); }}/>}
          </div>{/* view-stage */}

          <footer className="footer">
            <span>Villares · Planner v7.2</span>
            <span>
              {items.length} {items.length === 1 ? 'Item total' : 'Itens totais'} · {Math.round(metrics.pct)}% de taxa de conclusão{view === 'dashboard' ? ` · Aba ativa: ${activeTab}` : ''}
            </span>
          </footer>
        </div>
      </div>

      <ItemModal
        open={modalOpen}
        item={editingItem}
        prefillDate={prefillDate}
        onClose={handleModalClose}
        onSave={handleModalSave}
      />

      <SettingsModal
        open={settingsOpen}
        config={apiConfig}
        items={items}
        onClose={() => setSettingsOpen(false)}
        onSave={handleSettingsSave}
        onUploaded={loadFromApi}
        onReplayTour={() => { setSettingsOpen(false); setShowOnboarding(true); }}
        dayStart={dayStart}
        onChangeDayStart={changeDayStart}
      />

      <FalhaModal
        open={!!falhaTarget}
        item={falhaTarget && falhaTarget.item ? falhaTarget.item : falhaTarget}
        onCancel={() => setFalhaTarget(null)}
        onConfirm={(info) => {
          const alvo = falhaTarget;
          setFalhaTarget(null);
          if (alvo && alvo.item && D.temDias(alvo.item)) {
            // Rotina: falha POR DIA
            handleRotinaFalha(alvo.item, alvo.occDate, info);
          } else {
            const it = alvo && alvo.item ? alvo.item : alvo;
            persistItem({ ...it, status: 'Falha', ...info });
          }
        }}
      />

      <DeleteModal
        target={deleteTarget}
        onCancel={() => setDeleteTarget(null)}
        onSkipDay={handleSkipDay}
        onDeleteAll={handleDeleteAll}
      />

      <QuickActionPopup
        item={quickActionItem}
        selDate={selDate}
        alarmeAtivo={alarmeAtivo}
        onSilenciar={pararAlarme}
        onClose={() => { pararAlarme(); setQuickActionItem(null); }}
        onConcluir={(itSnap) => {
          pararAlarme();
          setQuickActionItem(null);
          const it = items.find(x => x.id === itSnap.id) || itSnap; // versão atual
          if (D.temDias(it)) {
            const d = new Date(); d.setHours(12,0,0,0);
            if (!D.rotinaFeitaNoDia(it, d)) handleToggleComplete(it, d);
          } else {
            persistItem({ ...it, status: 'Concluído' });
            sfx.complete();
          }
        }}
        onAndamento={(itSnap) => {
          pararAlarme();
          setQuickActionItem(null);
          const it = items.find(x => x.id === itSnap.id) || itSnap;
          if (D.temDias(it)) {
            const d = new Date(); d.setHours(12,0,0,0);
            handleRotinaAndamento(it, d);
          } else {
            persistItem({ ...it, status: 'Em Andamento' });
          }
        }}
        onFalha={(itSnap) => { pararAlarme(); setQuickActionItem(null); const it = items.find(x => x.id === itSnap.id) || itSnap; setFalhaTarget(it); }}
        onAbrir={(itSnap) => { pararAlarme(); setQuickActionItem(null); const it = items.find(x => x.id === itSnap.id) || itSnap; handleEdit(it); }}
      />

      {showOnboarding && <Onboarding onFinish={finishOnboarding}/>}
      {showTypePicker && !showOnboarding && <TypePicker onChoose={chooseType}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
