.week-intel__value { font-family: var(--font-sans); font-size: 22px; font-weight: 600; color: var(--color-text-primary); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.week-intel__card--accent .week-intel__value { color: var(--color-critical); }
.week-intel__hint { font-size: 11.5px; color: var(--color-text-tertiary); line-height: 1.35; }
.week-warn { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 13px 16px; margin-bottom: 18px; cursor: pointer;
  background: var(--color-critical-soft); border: 1px solid rgba(220,34,34,0.3); color: var(--color-text-secondary); font-size: 13px; line-height: 1.4;
  transition: border-color 200ms, transform 200ms cubic-bezier(0.16,1,0.3,1); }
.week-warn:hover { border-color: var(--color-critical); transform: translateY(-1px); }
.week-warn svg { color: var(--color-critical); flex-shrink: 0; }
.week-warn b { color: var(--color-text-primary); font-weight: 600; }
@media (max-width: 880px) { .week-intel { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .week-intel { grid-template-columns: 1fr; } }

/* Botão "+ tarefa" no fim da coluna do dia (programação direta) */
.week__col-add { width: 100%; margin-top: 6px; padding: 7px; cursor: pointer;
  background: transparent; border: 1px dashed var(--color-border-default); color: var(--color-text-quaternary);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
  transition: color 160ms, border-color 160ms, background 160ms; }
.week__col-add:hover { color: var(--color-text-secondary); border-color: var(--color-border-strong); background: rgba(255,255,255,0.02); }

/* ── Ajustes mobile para componentes novos (NextUp, week-intel, habits) ── */
@media (max-width: 640px) {
  .nextup { flex-wrap: wrap; gap: 10px 14px; padding: 13px 14px; }
  .nextup__mid { flex: 1 1 100%; order: 3; }
  .nextup__right { order: 2; margin-left: auto; }
  .week-intel { grid-template-columns: 1fr 1fr; }
  .habit-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .habit-row__grid { flex-wrap: wrap; gap: 4px; }
  .habit-cell { width: 16px; height: 16px; }
  .del-option { padding: 13px 14px; }
  .hero--secondary { grid-template-columns: 1fr; }
  /* a faixa "próximo" e barras não estouram */
  .nextup__bar { width: 100%; }
  /* tabs roláveis horizontalmente sem quebrar layout */
  .tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; }
}
@media (max-width: 420px) {
  .week-intel { grid-template-columns: 1fr; }
}

/* ── Resumo inteligente do dia (topo das notificações) ── */
.notif-digest { padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle); background: linear-gradient(180deg, var(--color-bg-surface-2), var(--color-bg-surface-1)); }
.notif-digest__title { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-text-quaternary); margin-bottom: 10px; }
.notif-digest__line { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--color-text-secondary); line-height: 1.35; }
.notif-digest__line--clickable { cursor: pointer; transition: color 140ms; }
.notif-digest__line--clickable:hover { color: var(--color-text-primary); }
.notif-digest__dot { width: 6px; height: 6px; flex-shrink: 0; background: var(--color-text-quaternary); border-radius: 50% !important; }
.notif-digest__line--foco .notif-digest__dot { background: var(--color-text-primary); }
.notif-digest__line--foco { color: var(--color-text-primary); font-weight: 500; }
.notif-digest__line--late .notif-digest__dot { background: var(--color-critical); }
.notif-digest__line--late { color: var(--color-text-primary); }
.notif-digest__line--rotina .notif-digest__dot { background: #e0922b; }
.notif-digest__line--ok .notif-digest__dot { background: var(--color-positive); }

/* ── Relatórios: tendência de conclusão + insights ── */
.report-trend { border: 1px solid var(--color-border-subtle); background: linear-gradient(180deg, var(--color-bg-surface-2), var(--color-bg-surface-1)); padding: 20px 22px; margin-bottom: 18px; animation: fadeSlideUp 480ms cubic-bezier(0.16,1,0.3,1) both; }
.report-trend__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.report-trend__title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-secondary); }
.report-trend__delta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.03em; }
.report-trend__delta.is-up { color: var(--color-positive); }
.report-trend__delta.is-down { color: var(--color-critical); }
.report-trend__chart { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; }
.report-trend__col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.report-trend__bar-track { width: 100%; height: 110px; display: flex; align-items: flex-end; background: var(--color-bg-surface-3); }
.report-trend__bar { width: 100%; background: linear-gradient(180deg, var(--color-neutral-strong), rgba(229,229,231,0.5)); transition: height 700ms cubic-bezier(0.16,1,0.3,1); }
.report-trend__col:last-child .report-trend__bar { background: linear-gradient(180deg, var(--color-critical), rgba(220,34,34,0.55)); }
.report-trend__pct { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
.report-trend__col:last-child .report-trend__pct { color: var(--color-text-primary); }
.report-trend__label { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-quaternary); letter-spacing: 0.04em; }
.report-insights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--color-border-subtle); border: 1px solid var(--color-border-subtle); margin-bottom: 18px; }
.report-insight { background: var(--color-bg-surface-1); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; position: relative; animation: fadeSlideUp 520ms cubic-bezier(0.16,1,0.3,1) both; }
.report-insight--warn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--color-critical); }
.report-insight__label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-quaternary); }
.report-insight__value { font-family: var(--font-sans); font-size: 20px; font-weight: 600; color: var(--color-text-primary); letter-spacing: -0.01em; }
.report-insight--warn .report-insight__value { color: var(--color-critical); }
.report-insight__hint { font-size: 11.5px; color: var(--color-text-tertiary); line-height: 1.4; }
@media (max-width: 760px) { .report-insights { grid-template-columns: 1fr; } .report-trend__chart { gap: 5px; } .report-trend__label { font-size: 8px; } }

/* ── Solicitantes (TeamView) enriquecido ── */
.team-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--color-border-subtle); border: 1px solid var(--color-border-subtle); margin-bottom: 18px; }

  <main style="max-width:880px;margin:0 auto;padding:48px 24px;font-family:sans-serif;line-height:1.7;color:#222">
    <h1>Villares Planner — Gestor de Tarefas, Rotinas e Calendário Operacional Online</h1>
    <p>O <strong>Villares Planner</strong> é um dashboard operacional completo para <strong>gestão de tarefas, rotinas recorrentes, pedidos e prazos</strong>, criado em <strong>Bauru, interior de São Paulo, Brasil</strong>, e pensado para quem precisa organizar o dia a dia de operações com velocidade e clareza. Diferente de planilhas soltas ou aplicativos genéricos de listas, o Villares Planner nasceu dentro da rotina real de <strong>logística e business intelligence</strong>: torres de controle, fechamentos de turno, indicadores de SLA, pedidos de outras áreas e rotinas que se repetem todos os dias úteis. É uma ferramenta de produtividade construída por quem vive operação, para quem vive operação.</p>

    <h2>O que é o Villares Planner</h2>
    <p>O Villares Planner é um <strong>organizador de tarefas online e gratuito</strong>, em português do Brasil, que funciona direto no navegador — inclusive aberto localmente, sem necessidade de servidor. Ele reúne em uma única tela tudo o que um profissional de operações, um analista ou uma pequena equipe precisa para planejar o dia: <strong>painel de indicadores</strong> com taxa de conclusão, itens em andamento, vencimentos do dia e atrasados; <strong>lista de tarefas</strong> com busca global, filtros por prioridade e categoria, ordenação por urgência e visualização compacta ou detalhada; <strong>quadro Kanban</strong> com arrastar e soltar entre colunas de status; <strong>calendário</strong> com quatro modos de visualização; e <strong>notas rápidas</strong> para registrar ideias que ainda não viraram tarefa.</p>

    <h2>Rotinas recorrentes de verdade</h2>
    <p>O grande diferencial do Villares Planner está nas <strong>rotinas recorrentes por dia da semana</strong>. Ao criar uma rotina, você marca em quais dias ela deve acontecer — segunda, terça, quarta, quinta, sexta, sábado ou domingo — e o sistema cuida do resto. A rotina <strong>reaparece automaticamente</strong> em cada dia configurado, sem que você precise recriá-la manualmente. Concluir uma rotina vale apenas para o dia atual: no dia seguinte, ela volta como pendente, exatamente como uma checklist operacional deve funcionar. Conferências diárias de base, dailies, fechamentos de turno, relatórios semanais de KPI, reuniões fixas: tudo se organiza sozinho, e a taxa de conclusão acompanha o ritmo real da operação.</p>

    <h2>Tarefas com hora, prazo e prioridade</h2>
    <p>Cada tarefa pode receber <strong>hora opcional</strong>, exibida no formato 09:30 | Título | Descrição, prazo de entrega com atalhos por dia da semana ("quero isso pronto até sexta"), descrição com quebras de linha preservadas e botão "ver mais", múltiplas categorias simultâneas e quatro níveis de prioridade — <strong>Crítica, Alta, Média e Baixa</strong> — com indicadores visuais imediatos. Pedidos de outras áreas ganham campo de solicitante, permitindo enxergar quem demanda o quê e acompanhar o volume por pessoa na visão de equipe.</p>

    <h2>Calendário com Agenda, Semana, Mês e Timeline</h2>
    <p>O <strong>calendário de tarefas</strong> do Villares Planner foi projetado como ferramenta de planejamento, não como enfeite. São quatro modos: <strong>Agenda</strong>, em lista cronológica agrupada por dia; <strong>Semana</strong>, com sete colunas e os compromissos de cada dia ordenados por hora; <strong>Mês</strong>, na grade tradicional com painel detalhado do dia selecionado; e <strong>Timeline</strong>, uma linha do tempo vertical para enxergar a sequência de entregas. Uma barra de filtros real permite combinar <strong>tipo</strong> (projetos, rotinas, pedidos), <strong>status</strong> (pendente, em andamento, concluído, atrasado), <strong>prioridade</strong>, <strong>categorias com multi-seleção</strong> e <strong>período</strong> — hoje, amanhã, esta semana, próxima semana ou este mês — além de navegação rápida entre datas com botões de dia anterior, próximo dia e "ir para qualquer data".</p>

    <h2>Sincronização com Google Sheets</h2>
    <p>Os dados do Villares Planner podem viver onde sua equipe já trabalha: numa <strong>planilha do Google Sheets</strong>. A integração usa o Google Apps Script como backend gratuito — você cria a planilha, cola o script fornecido, define um token secreto e publica como Web App. Pronto: cada tarefa criada, editada ou concluída no Planner é gravada na planilha em tempo real, com colunas nomeadas em português (Id, Origem, Título, Descrição, Categoria, Prioridade, Status, Prazo, Hora, Dias da Semana, Última Conclusão e mais). Isso significa <strong>backup automático, dados auditáveis e zero dependência de servidores pagos</strong>. Sem conexão configurada, o aplicativo funciona em modo local, salvando tudo no próprio navegador.</p>

    <h2>Para quem é</h2>
    <p>O Villares Planner atende <strong>analistas de logística e supply chain</strong>, profissionais de <strong>torre de controle</strong>, times de <strong>business intelligence</strong>, assistentes administrativos, coordenadores de operação, freelancers e qualquer pessoa que precise de um <strong>planner diário online</strong> sério, rápido e sem mensalidade. Empresas de Bauru, da região de São Paulo e de todo o Brasil podem usar a ferramenta para padronizar rotinas de equipe, acompanhar pedidos internos entre áreas e medir a taxa de conclusão por categoria — de operações diárias a relatórios de KPI, análise de dados, transportadoras, estoque e desenvolvimento de pessoas.</p>

    <h2>Design e experiência</h2>
    <p>A interface segue um <strong>design system escuro, minimalista e tipográfico</strong>, com hierarquia clara, espaçamentos generosos e estados de interação cuidadosos. O resultado é um ambiente de trabalho silencioso e profissional, que carrega instantaneamente por ser um único arquivo HTML — sem instalação, sem cadastro, sem rastreadores e sem anúncios. Tema claro e escuro, atalhos visuais e responsividade para uso em notebooks e desktops da operação.</p>

    <h2>Como começar</h2>
    <p>Começar leva menos de um minuto: abra o Villares Planner no navegador, clique em "Novo" e crie sua primeira tarefa ou rotina. Para trabalhar em equipe, acesse as configurações, siga o passo a passo de integração com o Google Sheets — criação da planilha, instalação do script e publicação do Web App — e conecte a URL com o seu token. A partir daí, todo o planejamento do time fica centralizado, versionado e acessível de qualquer computador, mantendo a simplicidade de uma planilha com a experiência de um aplicativo profissional de gestão de tarefas e produtividade.</p>

    <h2>Alarme, hábitos e análise da semana</h2>
    <p>O Villares Planner vai além do registro: tem <strong>alarme com som</strong> que toca em loop até ser silenciado, com aviso dez minutos antes e confirmação de tarefas em andamento; <strong>notificações inteligentes</strong> que abrem com um resumo do dia (próxima tarefa, rotinas pendentes e itens atrasados); um painel de <strong>hábitos e rotinas</strong> com grade de consistência dos últimos quatorze dias e contagem de sequência; e uma <strong>análise semanal</strong> que aponta o dia mais carregado, o melhor dia para encaixar novas demandas, a carga média por dia e o horário de pico — ajudando no balanceamento de carga e na programação da semana. Há ainda o tipo <strong>Demanda</strong> para tarefas avulsas feitas uma ou duas vezes, separado de projetos e pedidos.</p>

    <h2>Villares Planner em resumo</h2>
    <p>Gestor de tarefas online gratuito e em português; rotinas recorrentes automáticas por dia da semana; demandas e pedidos avulsos; Kanban com arrastar e soltar; calendário com quatro visualizações e filtros combináveis; alarme com som e notificações inteligentes; hábitos com grade de consistência; análise semanal de carga; notas rápidas; relatórios de distribuição por status, prioridade, origem e categoria; estatísticas de produtividade; busca global por título, descrição, categoria, data e hora; sincronização opcional com Google Sheets via Apps Script; e funcionamento local sem servidor. Desenvolvido por <strong>Willian Villares</strong> em <strong>Bauru/SP, Brasil</strong>, como parte do ecossistema Villares de ferramentas de produtividade e finanças. Ative o JavaScript do navegador para usar o aplicativo completo nesta página.</p>

  "Concluído":    "feito",
  "Cancelado":    "feito",
  "Falha":        "falha",
  // Rotina (já tratado acima)
  // Pedidos
  "Recebido":     "aberto",
  "Recusado":     "feito",
};

// ── Rotinas recorrentes por dia da semana ──
// Uma rotina com `dias` ("Seg, Ter, Qua") reaparece automaticamente em cada
// dia configurado. Concluir só vale para o dia: `ultimaConclusao` guarda a
// última data concluída; no dia seguinte a rotina volta como pendente sozinha.
const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const splitDias = (s) => String(s || '').split(',').map(x => x.trim()).filter(Boolean);

// Dias efetivos da rotina: os marcados; ou, para rotinas antigas criadas só com
// frequência "Diária" (sem dias), todos os 7 dias — evita o modo legado por status
const diasEfetivos = (item) => {
  if (item.origem !== 'Rotina') return [];
  const d = splitDias(item.dias);
  if (d.length > 0) return d;
  if (/di[áa]ria/i.test(String(item.frequencia || ''))) return [...DIAS_SEMANA];
  return [];
};
const temDias = (item) => diasEfetivos(item).length > 0;
const rotinaNoDia = (item, date) => {
  if (!diasEfetivos(item).includes(DIAS_SEMANA[date.getDay()])) return false;
  // exceções: dias específicos removidos pontualmente ("excluir só hoje")
  const exc = item.excecoes || [];
  return !exc.includes(localISO(date));
};

// Datas 'yyyy-mm-dd' DEVEM ser interpretadas no fuso local (não UTC),
// senão tudo desloca um dia no Brasil (UTC-3)
const parseLocalDate = (v) => {
  if (v instanceof Date) return new Date(v);
  const s = String(v);
  return new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T12:00:00' : s);
};

// Data de hoje (ou de d) como 'yyyy-mm-dd' no fuso LOCAL
// (toISOString é UTC: à noite no Brasil já devolve o dia seguinte)
const localISO = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// ── DIA OPERACIONAL ──
// Em operações noturnas, o dia não vira à meia-noite. Se o início do dia é às 4h,
// uma tarefa às 02h ainda pertence ao dia anterior. getDayStart() lê a preferência
// do usuário (0 = meia-noite padrão; 4 = vira às 4h; etc).
const getDayStart = () => {
  try { return parseInt(localStorage.getItem('villares_day_start') || '0', 10) || 0; } catch { return 0; }
};
// Converte um Date real para a DATA OPERACIONAL a que ele pertence.
// Ex.: dayStart=4 → 02:00 de terça conta como segunda (volta 1 dia).
const operationalDate = (d = new Date()) => {
  const ds = getDayStart();
  const x = new Date(d);
  if (ds > 0 && x.getHours() < ds) x.setDate(x.getDate() - 1);
  return x;
};
// 'yyyy-mm-dd' do dia operacional de agora (ou de d).
const operationalISO = (d = new Date()) => localISO(operationalDate(d));

const diasAteHoje = (date) => {
  if (!date) return null;
  const d = parseLocalDate(date); d.setHours(0,0,0,0);
  const t = operationalDate(); t.setHours(0,0,0,0);
  return Math.round((d - t) / (1000 * 60 * 60 * 24));
};

// Conclusões de rotina por DIA: lista de datas 'yyyy-mm-dd' em item.conclusoes.
// Concluir hoje afeta SÓ hoje — cada dia tem seu próprio registro.
const rotinaFeitaNoDia = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  if (Array.isArray(item.conclusoes) && item.conclusoes.includes(iso)) return true;
  // fallback legado (registros antigos em "Última Conclusão")
  if (item.ultimaConclusao) {
    const u = parseLocalDate(item.ultimaConclusao);
    const dd = parseLocalDate(d);
    return u.getFullYear() === dd.getFullYear() && u.getMonth() === dd.getMonth() && u.getDate() === dd.getDate();
  }
  return false;
};

const rotinaFeitaHoje = (item) => rotinaFeitaNoDia(item, operationalDate());

// Rotina EM ANDAMENTO num dia: lista item.andamentos = ['yyyy-mm-dd', ...]
const rotinaAndamentoNoDia = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  return Array.isArray(item.andamentos) && item.andamentos.includes(iso);
};
// Rotina em FALHA num dia: lista item.falhas = [{ data, categoria, motivo }, ...]
const rotinaFalhaNoDia = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  return Array.isArray(item.falhas) && item.falhas.some(f => f.data === iso);
};
const rotinaFalhaInfo = (item, d) => {
  const iso = localISO(parseLocalDate(d));
  return Array.isArray(item.falhas) ? item.falhas.find(f => f.data === iso) : null;
};
// Estado da rotina no dia: 'feito' | 'andamento' | 'falha' | 'pendente' | 'naoprog'
const rotinaEstadoNoDia = (item, d) => {
  if (!rotinaNoDia(item, d)) return 'naoprog';
  if (rotinaFeitaNoDia(item, d)) return 'feito';
  if (rotinaFalhaNoDia(item, d)) return 'falha';
  if (rotinaAndamentoNoDia(item, d)) return 'andamento';
  return 'pendente';
};

const isAtivo = (item) => {
  if (temDias(item)) return !rotinaFeitaHoje(item);
  const b = STATUS_BUCKET[item.status];
  return b === "aberto" || b === "andamento";
};

const isFeito = (item) => {
  if (temDias(item)) return rotinaFeitaHoje(item);
  return STATUS_BUCKET[item.status] === "feito" && item.status !== "Cancelado" && item.status !== "Recusado";
};

const isFalha = (item) => !temDias(item) && item.status === "Falha";

const horaParaMin = (h) => {
  if (!h || !/^\d{1,2}:\d{2}$/.test(String(h).trim())) return null;
  const [hh, mm] = String(h).trim().split(':').map(Number);
  return hh * 60 + mm;
};
const isAtrasado = (item) => {
  if (temDias(item)) return false; // rotina recorrente nunca "atrasa": reaparece no próximo dia
  if (!isAtivo(item) || !item.prazo) return false;
  const dias = diasAteHoje(item.prazo);
  if (dias < 0) return true;                 // prazo em dia anterior → atrasado
  if (dias === 0) {                          // prazo é HOJE: checa a hora
    const alvo = horaParaMin(item.hora);
    if (alvo === null) return false;         // sem hora → só atrasa amanhã
    // "agora" em minutos no dia operacional (madrugada conta como continuação)
    const now = new Date();
    let nowMin = now.getHours() * 60 + now.getMinutes();
    const ds = getDayStart();
    if (ds > 0 && now.getHours() < ds) nowMin += 1440; // madrugada do mesmo turno
    let alvoOp = alvo;
    if (ds > 0 && alvo < ds * 60) alvoOp += 1440;
    return nowMin > alvoOp;                   // já passou da hora marcada hoje
  }
  return false;
};

const isHoje = (item) => {
  if (temDias(item)) return rotinaNoDia(item, operationalDate()) && isAtivo(item);
  if (!isAtivo(item) || !item.prazo) return false;
  return diasAteHoje(item.prazo) === 0;
};

// ── Estado relativo a uma DATA específica (selecionada no topo) ──
const mesmoDia = (a, b) => {
  const x = parseLocalDate(a), y = b instanceof Date ? b : parseLocalDate(b);
  return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
};
// Pertence ao dia? (rotina programada no dia, ou item com prazo naquele dia)
const noDia = (item, d) => {
  if (temDias(item)) return rotinaNoDia(item, d);
  return !!item.prazo && mesmoDia(item.prazo, d);
};
// Concluído NAQUELE dia?
const feitoNoDia = (item, d) => {
  if (temDias(item)) return rotinaFeitaNoDia(item, d);
  return isFeito(item);
};
// Ativo (pendente/andamento) NAQUELE dia?
const ativoNoDia = (item, d) => {
  if (temDias(item)) return rotinaNoDia(item, d) && !rotinaFeitaNoDia(item, d);
  return isAtivo(item) && !!item.prazo && mesmoDia(item.prazo, d);
};

const isProximos48h = (item) => {
  if (!isAtivo(item) || !item.prazo) return false;
  const d = diasAteHoje(item.prazo);
  return d >= 0 && d <= 2;
};

const isEstaSemana = (item) => {
  if (!isAtivo(item) || !item.prazo) return false;
  const d = diasAteHoje(item.prazo);
  return d >= 0 && d <= 7;
};

const isConcluidoRecente = (item) => {
  if (!isFeito(item)) return false;
  // Considera concluído nos últimos 7 dias (usa prazo como aproximação se não houver concluidoEm)
  if (item.prazo) {
    const d = diasAteHoje(item.prazo);
    return d >= -7 && d <= 0;
  }
  if (item.ultimaConclusao) {
    const d = diasAteHoje(item.ultimaConclusao);
    return d >= -7 && d <= 0;
  }
  return false;
};

const formatDate = (d) => {
  if (!d) return "—";
  const date = parseLocalDate(d);
  return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
};

const formatRelative = (d) => {
  if (!d) return "—";
  const dias = diasAteHoje(d);
  if (dias === 0) return "hoje";
  if (dias === 1) return "amanhã";
  if (dias === -1) return "ontem";
  if (dias > 0 && dias <= 6) return `em ${dias}d`;
  if (dias < 0 && dias >= -6) return `${Math.abs(dias)}d atrás`;
  return formatDate(d);
};

// Multi-categoria: armazenada como string separada por vírgula ("A, B")
const splitCats = (c) => String(c || '').split(',').map(s => s.trim()).filter(Boolean);
const hasCat = (item, cat) => splitCats(item.categoria).includes(cat);

window.PLANNER_DATA = {
  MOCK_ITEMS,
  CATEGORIAS,
  WORKSPACES, TODAS_CATEGORIAS, getWorkspace, getCategorias,
  STATUS_BUCKET,
  isAtivo, isFeito, isAtrasado, isHoje, isProximos48h, isEstaSemana, isConcluidoRecente,
  diasAteHoje, formatDate, formatRelative,
  parseLocalDate, localISO, getDayStart, operationalDate, operationalISO,
  splitCats, hasCat,
  DIAS_SEMANA, splitDias, diasEfetivos, temDias, rotinaNoDia, rotinaFeitaHoje, rotinaFeitaNoDia,
  rotinaAndamentoNoDia, rotinaFalhaNoDia, rotinaFalhaInfo, rotinaEstadoNoDia,
  mesmoDia, noDia, feitoNoDia, ativoNoDia, isFalha,
};

</script>

const CODE_GS_CONTENT = `/**
 * VILLARES | PLANNER — Backend Google Apps Script
 * ------------------------------------------------
 * Colunas da planilha com nomes corretos (Id, Título, Descrição...),
 * mapeadas para as chaves internas usadas pelo app.
 *
 * Como publicar:
 *  1. Extensões → Apps Script → cole este arquivo inteiro.
 *  2. Defina o SECRET_TOKEN abaixo (o mesmo usado nas configurações do app).
 *  3. Implantar → Nova implantação → App da Web:
 *       Executar como: Eu  ·  Quem pode acessar: Qualquer pessoa
 *  4. Copie a URL terminada em /exec para as configurações do Planner.
 *
 * Conclusões de rotinas são registradas POR DIA em abas separadas
 * (Segunda ... Domingo), criadas automaticamente: concluir hoje
 * nunca afeta os outros dias da semana.
 */

const SECRET_TOKEN = 'TROQUE-POR-UMA-STRING-LONGA-E-ALEATORIA';
const SHEET_NAME   = 'Rotina';

// Coluna na planilha (label) ↔ chave interna do app (key)
const COLUNAS = [
  { label: 'Id',           key: 'id' },

  { label: 'Criado Em',        key: 'criadoEm' },
];

// ─────────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────

const TOKEN_ERR = 'Token inválido — confira se a implantação foi atualizada (Implantar → Gerenciar implantações → Nova versão)';

function tokenOk_(t) {
  return String(t || '').trim() === String(SECRET_TOKEN).trim();
}

function doGet(e) {
  const p = (e && e.parameter) || {};
  // Quando chamado direto no editor (sem requisição), explica o que fazer
  if (!e || !e.parameter) return reply_({ ok: false,
    error: 'Execute via URL do Web App (/exec), não pelo botão Executar do editor.' });
  if (!tokenOk_(p.token)) return reply_({ ok: false, error: TOKEN_ERR }, p.callback);

  try {
    const action = p.action || 'list';

    // Fallback file:// — escrita via GET com ?payload={json} (JSONP)
    if (p.payload) {
      const data = JSON.parse(p.payload);
      return reply_(executar_(action, data), p.callback);
    }

    if (action === 'list') {
      return reply_({ ok: true, items: listar_() }, p.callback);
    }
    return reply_({ ok: false, error: 'Ação desconhecida: ' + action }, p.callback);
  } catch (err) {
    return reply_({ ok: false, error: String(err) }, p.callback);
  }
}

function doPost(e) {
  const p = (e && e.parameter) || {};
  if (!e || !e.parameter) return reply_({ ok: false,
    error: 'Execute via URL do Web App (/exec), não pelo botão Executar do editor.' });
  if (!tokenOk_(p.token)) return reply_({ ok: false, error: TOKEN_ERR });

  try {
    const data = JSON.parse((e.postData && e.postData.contents) || '{}');
    return reply_(executar_(p.action, data));
  } catch (err) {
    return reply_({ ok: false, error: String(err) });
  }
}

// ─────────────────────────────────────────────────────────────────────────────

function executar_(action, data) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    switch (action) {
      case 'list':   return { ok: true, items: listar_() };
      case 'create': return { ok: true, item: criar_(data) };
      case 'update': return { ok: true, item: atualizar_(data) };
      case 'delete': return { ok: true, id: excluir_(data.id) };
      case 'bulk':   return { ok: true, count: emMassa_(data.items || []) };
      case 'concluir': return concluir_(data);
      default:       return { ok: false, error: 'Ação desconhecida: ' + action };
    }
  } finally {
    lock.releaseLock();
  }
}

function listar_() {
  const sheet = aba_();
  const tz = SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone();
  const values = sheet.getDataRange().getValues();
  if (values.length < 2) return [];
  const headers = values[0];
  const idx = mapaIndices_(headers);
  const conclusoes = lerConclusoes_(tz);

  return values.slice(1)
    .filter(function (row) { return String(row[idx.id] || '').trim() !== ''; })
    .map(function (row) {
      const item = {};
      COLUNAS.forEach(function (c) {
        if (idx[c.key] === undefined) return;
        var v = row[idx[c.key]];
        if (v === '' || v === null) return;
        if (v instanceof Date) {
          // tz da planilha evita o bug clássico de +6 min em horas
          // (datas-âncora de 1899 usavam o fuso LMT -03:06:28 em São Paulo)
          v = c.key === 'hora'
            ? Utilities.formatDate(v, tz, 'HH:mm')
            : Utilities.formatDate(v, tz, 'yyyy-MM-dd');
        }
        item[c.key] = v;
      });
      if (conclusoes[item.id]) item.conclusoes = conclusoes[item.id];
      return item;
    });
}

// Lê todas as abas de dia e monta { idDaRotina: ['yyyy-mm-dd', ...] }
function lerConclusoes_(tz) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const map = {};
  ABAS_DIAS.forEach(function (nome) {
    const sh = ss.getSheetByName(nome);
    if (!sh || sh.getLastRow() < 2) return;
    const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();
    rows.forEach(function (r) {
      let data = r[0]; const id = String(r[1] || '').trim();
      if (!id || !data) return;
      if (data instanceof Date) data = Utilities.formatDate(data, tz, 'yyyy-MM-dd');
      data = String(data).slice(0, 10);
      if (!map[id]) map[id] = [];
      if (map[id].indexOf(data) === -1) map[id].push(data);
    });
  });
  return map;
}

// Registra ou remove a conclusão de uma rotina em UM dia específico.
// data: 'yyyy-mm-dd' · done: true (concluir) / false (reabrir)
function concluir_(p) {
  const id = String(p.id || '').trim();
  const data = String(p.data || '').slice(0, 10);
  if (!id || !/^\\d{4}-\\d{2}-\\d{2}$/.test(data)) {
    return { ok: false, error: 'Parâmetros inválidos para concluir (id, data)' };
  }
  const partes = data.split('-');
  const dow = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12).getDay();
  const sh = abaDia_(ABAS_DIAS[dow]);

  // Procura registro existente (Data na col A, Id na col B)
  const tz = SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone();
  let achou = -1;
  if (sh.getLastRow() > 1) {
    const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();
    for (let i = 0; i < rows.length; i++) {
      let d = rows[i][0];
      if (d instanceof Date) d = Utilities.formatDate(d, tz, 'yyyy-MM-dd');
      if (String(d).slice(0, 10) === data && String(rows[i][1]).trim() === id) { achou = i + 2; break; }
    }
  }

  if (p.done) {
    if (achou === -1) sh.appendRow([data, id, String(p.titulo || '')]);
  } else {
    if (achou !== -1) sh.deleteRow(achou);
  }
  return { ok: true, id: id, data: data, done: !!p.done };
}

// Garante a aba do dia com cabeçalho e coluna de data como texto
function abaDia_(nome) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(nome);
  if (!sh) {
    sh = ss.insertSheet(nome);
    sh.getRange(1, 1, 1, 3).setValues([['Data', 'Id', 'Título']]).setFontWeight('bold');
    sh.setFrozenRows(1);
    sh.getRange(1, 1, sh.getMaxRows(), 1).setNumberFormat('@');
  }
  return sh;
}

function criar_(item) {
  const sheet = aba_();
  sheet.appendRow(linha_(item));
  return item;
}

function atualizar_(item) {
  const sheet = aba_();
  const row = acharLinha_(sheet, item.id);
  if (row === -1) throw new Error('Item não encontrado: ' + item.id);
  sheet.getRange(row, 1, 1, COLUNAS.length).setValues([linha_(item)]);
  return item;
}

function excluir_(id) {
  const sheet = aba_();
  const row = acharLinha_(sheet, id);
  if (row === -1) throw new Error('Item não encontrado: ' + id);
  sheet.deleteRow(row);
  return id;
}

function emMassa_(items) {
  const sheet = aba_();
  const last = sheet.getLastRow();
  if (last > 1) sheet.getRange(2, 1, last - 1, sheet.getLastColumn()).clearContent();
  if (items.length > 0) {
    const rows = items.map(linha_);
    sheet.getRange(2, 1, rows.length, COLUNAS.length).setValues(rows);
  }
  return items.length;
}

// ─────────────────────────────────────────────────────────────────────────────
// Infraestrutura
// ─────────────────────────────────────────────────────────────────────────────

function aba_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) sheet = ss.insertSheet(SHEET_NAME);

  // ── Migração segura de cabeçalho ──
  // Em vez de sobrescrever a linha 1 (o que desalinharia dados antigos),
  // INSERE colunas que faltam na posição correta, preservando todas as linhas.
  const lastCol = Math.max(sheet.getLastColumn(), 1);
  let headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(String);
  const vazia = headers.every(function (h) { return h.trim() === ''; });

  if (vazia) {
    // Planilha nova: escreve todos os cabeçalhos de uma vez
    sheet.getRange(1, 1, 1, COLUNAS.length)
         .setValues([COLUNAS.map(function (c) { return c.label; })])
         .setFontWeight('bold');
    sheet.setFrozenRows(1);
  } else {
    let mudou = false;
    COLUNAS.forEach(function (c, i) {
      const atual = headers[i] !== undefined ? String(headers[i]).trim() : '';
      if (atual === c.label) return;
      if (atual.toLowerCase() === c.key.toLowerCase() || atual.toLowerCase() === c.label.toLowerCase()) {
        // Mesmo campo com grafia antiga (ex: "titulo"): só renomeia no lugar
        sheet.getRange(1, i + 1).setValue(c.label).setFontWeight('bold');
        headers[i] = c.label; mudou = true;
      } else {
        // Coluna nova (ex: "Hora" entre "Prazo" e "Progresso"): insere SEM mover dados
        if (i === 0) sheet.insertColumnBefore(1); else sheet.insertColumnAfter(i);
        sheet.getRange(1, i + 1).setValue(c.label).setFontWeight('bold');
        headers.splice(i, 0, c.label); mudou = true;
      }
    });
    if (mudou) sheet.setFrozenRows(1);
  }

  // Coluna Hora como texto puro: impede o Sheets de converter "08:30" em
  // data de 1899 (origem do desvio de +6 minutos)
  const colHora = COLUNAS.findIndex(function (c) { return c.key === 'hora'; });
  if (colHora !== -1) {
    const fmt = sheet.getRange(1, colHora + 1, sheet.getMaxRows(), 1);
    if (fmt.getNumberFormat() !== '@') fmt.setNumberFormat('@');
  }
  return sheet;
}

// Aceita tanto os cabeçalhos novos ("Título") quanto os antigos ("titulo")
function mapaIndices_(headers) {
  const idx = {};
  COLUNAS.forEach(function (c) {
    var i = headers.indexOf(c.label);
    if (i === -1) i = headers.indexOf(c.key);
    if (i !== -1) idx[c.key] = i;
  });
  return idx;
}

function linha_(item) {
  return COLUNAS.map(function (c) {
    const v = item[c.key];
    return v === undefined || v === null ? '' : v;
  });
}

function acharLinha_(sheet, id) {
  const ids = sheet.getRange(2, 1, Math.max(sheet.getLastRow() - 1, 1), 1).getValues();
  for (var i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2;
  }
  return -1;
}

// Resposta JSON ou JSONP (quando há ?callback= — usado pelo app em file://)
function reply_(obj, callback) {
  const json = JSON.stringify(obj);
  if (callback) {
    return ContentService
      .createTextOutput(callback + '(' + json + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService
    .createTextOutput(json)
    .setMimeType(ContentService.MimeType.JSON);
}
`;

const { useState, useEffect, useMemo, useRef } = React;

// Hook de presença: mantém o elemento montado durante a animação de SAÍDA.
// Retorna { montado, saindo } — renderize enquanto `montado`, e aplique a
// classe de saída quando `saindo` for true.
function usePresence(aberto, duracao = 300) {
  const [montado, setMontado] = useState(aberto);
  const [saindo, setSaindo] = useState(false);
  useEffect(() => {
    let t;
    if (aberto) {
      setMontado(true);
      setSaindo(false);
    } else if (montado) {
      setSaindo(true);                       // dispara animação de saída
      t = setTimeout(() => { setMontado(false); setSaindo(false); }, duracao);
    }
    return () => clearTimeout(t);
  }, [aberto]);
  return { montado, saindo };
}

const playTone = (freqs, { dur = 0.12, gain = 0.12, type = 'sine' } = {}) => {
  if (!uiSoundOn()) return;
  try {
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    (Array.isArray(freqs) ? freqs : [freqs]).forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.06;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    });
  } catch {}
};

function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('ops_theme') || 'dark'; } catch { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme);
    try { localStorage.setItem('ops_theme', theme); } catch {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
}

// DONUT SVG
// ────────────────────────────────────────────────────────────────────────────
function Donut({ pct, size, stroke }) {
  const [drawn, setDrawn] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setDrawn(pct), 80);
    return () => clearTimeout(t);
  }, [pct]);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (drawn / 100) * c;
  const color = drawn >= 70 ? 'var(--color-positive)'
              : drawn >= 40 ? 'var(--color-warning)'
              : drawn > 0   ? 'var(--color-negative)'
              : 'var(--color-text-quaternary)';
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)', display: 'block' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
              stroke="var(--color-bg-surface-3)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
              stroke={color} strokeWidth={stroke}
              strokeDasharray={c} strokeDashoffset={off}
              style={{ transition: 'stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1), stroke 250ms' }}/>
    </svg>
  );
}

function Topbar({ query, onQueryChange, onNew, onOpenDrawer, workspace, onChangeWorkspace,
                  syncStatus, syncLabels, syncTitles, lastUpdate, onRefresh, onOpenSettings,
                  selDate, onDateShift, onDateToday, onDateSet,
                  notifOpen, setNotifOpen, notifCount, items, notifRead, saveRead, handleEdit,
                  notifDismissed, dismissNotif,
                  alarmEnabled, onEnableAlarm, onDisableAlarm }) {
  const [wsOpen, setWsOpen] = useState(false);
  useEffect(() => {
    if (!wsOpen) return;
    const close = (e) => { if (!e.target.closest('.ws-switch')) setWsOpen(false); };
    const t = setTimeout(() => document.addEventListener('click', close), 0);
    return () => { clearTimeout(t); document.removeEventListener('click', close); };
  }, [wsOpen]);
  const [refreshing, setRefreshing] = useState(false);
  const handleRefresh = () => {
    setRefreshing(true); onRefresh();
    setTimeout(() => setRefreshing(false), 700);
  };
  const isTodaySel = D.diasAteHoje(selDate) === 0;
  useEffect(() => {
    if (!notifOpen) return;
    const close = (e) => { if (!e.target.closest('.notif-panel') && !e.target.closest('.topbar__btn--bell')) setNotifOpen(false); };
    const t = setTimeout(() => document.addEventListener('click', close), 0);
    return () => { clearTimeout(t); document.removeEventListener('click', close); };
  }, [notifOpen]);
  const ws = D.WORKSPACES[workspace] || D.WORKSPACES.logistica;
  return (
    <header className="topbar">
      <button className="topbar__burger" onClick={onOpenDrawer} title="Menu"><Menu size={18}/></button>
      <div className="topbar__title">
        VILLARES<span className="topbar__title-accent"> | </span>PLANNER
      </div>

      {/* Switcher de modo de trabalho */}
      <div className="ws-switch">
        <button className="ws-switch__btn" onClick={() => setWsOpen(v => !v)} title="Modo de trabalho">
          <span className="ws-switch__dot"/>
          <span className="ws-switch__label">{ws.label}</span>
          <Chevron size={12}/>
        </button>
        {wsOpen && (
          <div className="ws-switch__menu">
            {Object.entries(D.WORKSPACES).map(([key, w]) => (
              <button key={key}
                      className={`ws-switch__item ${workspace === key ? 'ws-switch__item--active' : ''}`}
                      onClick={() => { onChangeWorkspace(key); setWsOpen(false); }}>
                <span className="ws-switch__item-name">{w.label}</span>
                <span className="ws-switch__item-sub">{w.sub}</span>
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="topbar__search">
        <Search size={14} className="topbar__search-icon"/>
        <input type="text" placeholder="Buscar item...  ( / )" id="topbar-search-input"
               value={query} onChange={(e) => onQueryChange(e.target.value)} aria-label="Buscar item"/>
      </div>
      <div className="topbar__actions">
        {/* Sincronizado | Atualizado | Refresh */}
        <button className={`sync-indicator sync-indicator--${syncStatus}`}
                onClick={onOpenSettings} title={syncTitles[syncStatus]}>
          <span className="sync-indicator__dot"/>
          <span>{syncLabels[syncStatus]}</span>
        </button>
        <span className="topbar__updated">Atualizado {lastUpdate}</span>
        <button className="topbar__btn" style={{ width: 30, height: 30 }} onClick={handleRefresh} title="Atualizar" aria-label="Atualizar dados">
          <Refresh size={13} style={refreshing ? { animation: 'spin 700ms linear' } : null}/>
        </button>
        {/* Seletor de data */}
        <span className="topbar__sep"/>
        <div className="topbar__date">
          <button className="date-nav__btn" title="Dia anterior" aria-label="Dia anterior"
                  onClick={() => onDateShift(-1)}>←</button>
          <button className={`date-nav__today ${isTodaySel ? 'date-nav__today--active' : ''}`}
                  onClick={onDateToday}>Hoje</button>
          <button className="date-nav__btn" title="Próximo dia" aria-label="Próximo dia"
                  onClick={() => onDateShift(1)}>→</button>
          <input type="date" className="date-nav__input" title="Ir para qualquer data"
                 value={D.localISO(selDate)}
                 onChange={(e) => { if (e.target.value) onDateSet(new Date(e.target.value + 'T12:00:00')); }}/>
        </div>
        <span className="topbar__sep"/>
        <div style={{ position: 'relative' }}>
          <button className="topbar__btn topbar__btn--bell" title="Notificações" aria-label="Notificações"
                  onClick={() => {
                    setNotifOpen(v => !v);
                    if (!notifOpen) {
                      const ids = buildNotifs(items).filter(n => !notifDismissed.has(n.id)).map(n => n.id);
                      saveRead(new Set([...notifRead, ...ids]));
                    }
                  }}>
            <Bell size={15}/>
            {notifCount > 0 && <span className="notif-badge">{notifCount > 9 ? '9+' : notifCount}</span>}
          </button>
          {notifOpen && (
            <NotifPanel items={items} readIds={notifRead}
                        onMarkAll={() => saveRead(new Set(buildNotifs(items).filter(n => !notifDismissed.has(n.id)).map(n => n.id)))}
                        onClose={() => setNotifOpen(false)}
                        onEditItem={handleEdit}
                        dismissedIds={notifDismissed}
                        onDismiss={dismissNotif}
                        alarmEnabled={alarmEnabled}
                        onEnableAlarm={onEnableAlarm}
                        onDisableAlarm={onDisableAlarm}/>
          )}
        </div>
        <button className="topbar__cta" onClick={onNew} aria-label="Criar novo item">
          <Plus size={14}/> Novo
        </button>
      </div>
    </header>
  );
}

function Toolbar({ count, sortBy, onSortSelect, prio, onPrio, cat, onCat, density, onToggleDensity, catList = D.CATEGORIAS }) {
  const [openMenu, setOpenMenu] = useState(null); // 'sort' | 'prio' | 'cat' | null

  useEffect(() => {
    if (!openMenu) return;
    const onClick = (e) => { if (!e.target.closest('.dropdown')) setOpenMenu(null); };
    const onKey = (e) => { if (e.key === 'Escape') setOpenMenu(null); };
    const t = setTimeout(() => {
      document.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);
    }, 0);
    return () => {
      clearTimeout(t);
      document.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [openMenu]);

  const toggle = (m) => setOpenMenu(prev => prev === m ? null : m);
  const sortLabel = (SORT_OPTIONS.find(o => o.key === sortBy) || SORT_OPTIONS[0]).label;

  return (
    <div className="toolbar">
      <ToolbarDropdown icon={SortIcon} label="Ordenar" value={sortLabel}
                       open={openMenu === 'sort'} onToggle={() => toggle('sort')}>
        {SORT_OPTIONS.map(o => (
          <button key={String(o.key)}
                  className={`dropdown__item ${sortBy === o.key ? 'dropdown__item--active' : ''}`}
                  onClick={() => { onSortSelect(o.key); setOpenMenu(null); }}>
            {o.label}
            {sortBy === o.key && <span className="dropdown__check">■</span>}
          </button>
        ))}
      </ToolbarDropdown>

      <ToolbarDropdown icon={FilterIcon} label="Prioridade" value={prio}
                       open={openMenu === 'prio'} onToggle={() => toggle('prio')}>
        {['Todas', 'Crítica', 'Alta', 'Média', 'Baixa'].map(p => (
          <button key={p}
                  className={`dropdown__item ${prio === p ? 'dropdown__item--active' : ''}`}
                  onClick={() => { onPrio(p); setOpenMenu(null); }}>
            {p}
            {prio === p && <span className="dropdown__check">■</span>}
          </button>
        ))}
      </ToolbarDropdown>

      <ToolbarDropdown icon={Layers} label="Categoria" value={cat}
                       open={openMenu === 'cat'} onToggle={() => toggle('cat')}>
        {['Todas', ...catList].map(c => (
          <button key={c}
                  className={`dropdown__item ${cat === c ? 'dropdown__item--active' : ''}`}
                  onClick={() => { onCat(c); setOpenMenu(null); }}>
            {c}
            {cat === c && <span className="dropdown__check">■</span>}
          </button>
        ))}
      </ToolbarDropdown>

      <button className="toolbar__select" onClick={onToggleDensity}
              title={density === 'compacta' ? 'Mudar para lista detalhada' : 'Mudar para lista compacta'}>
        <Layers size={13}/>
        <span>{density === 'compacta' ? 'Compacta' : 'Detalhada'}</span>
      </button>
      <span className="toolbar__count">{count} {count === 1 ? 'Item' : 'Itens'}</span>
    </div>
  );
}

function statusKey(status) {
  if (status === 'Falha') return 'falha';
  return {
    'Pendente': 'pendente', 'Recebido': 'pendente',
    'Em Andamento': 'andamento',
    'Pausado': 'pausado',
    'Concluído': 'concluido',
    'Bloqueado': 'bloqueado',
    'Cancelado': 'pendente', 'Recusado': 'pendente',
  }[status] || 'pendente';
}

function RowDesc({ text }) {

  return (
    <div className="list-row__desc-wrap">
      <div className={`list-row__desc ${expanded ? 'list-row__desc--expanded' : ''}`}>{text}</div>

        <button className="list-row__desc-toggle"

      )}

  );
}

function ListRow({ item, occDate, menuOpen, onMenuToggle, onEdit, onToggleComplete, onDuplicate, onDelete, onMarkFalha, onClearFalha, onSetAndamento, onSkipDay }) {
  const menuBtnRef = useRef(null);
  const [flipUp, setFlipUp] = useState(false);
  useEffect(() => {
    if (!menuOpen || !menuBtnRef.current) return;
    const rect = menuBtnRef.current.getBoundingClientRect();
    const espacoAbaixo = window.innerHeight - rect.bottom;
    setFlipUp(espacoAbaixo < 320);   // se faltar espaço, abre para cima
  }, [menuOpen]);
  const origemClass = item.origem === 'Projeto' ? 'projeto'
                    : item.origem === 'Rotina'  ? 'rotina'
                    : item.origem === 'Demanda' ? 'demanda' : 'pedido';
  const origemLetter = item.origem === 'Projeto' ? 'PJ'
                     : item.origem === 'Rotina'  ? 'RT'
                     : item.origem === 'Demanda' ? 'DM' : 'PD';

  // — Coluna "Recebido em" (data de criação) —
  const criadoEm = item.criadoEm || item.recebidoEm;
  const criadoDate = criadoEm
    ? D.parseLocalDate(criadoEm).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')
    : null;
  const criadoDias = criadoEm ? D.diasAteHoje(criadoEm) : null;
  const criadoSub = criadoDias === null ? null
    : criadoDias === 0 ? 'Hoje'
    : criadoDias === -1 ? 'Ontem'
    : criadoDias < 0 ? `há ${Math.abs(criadoDias)} dias`
    : `em ${criadoDias} dias`;

  // — Coluna "Prazo" —
  const isLate = D.isAtrasado(item);
  const isToday = D.isHoje(item);
  const prazoDate = item.prazo
    ? new Date(item.prazo).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')
    : null;
  const prazoDias = item.prazo ? D.diasAteHoje(item.prazo) : null;
  const prazoSub = prazoDias === null ? null
    : prazoDias === 0 ? 'Hoje'
    : prazoDias === 1 ? 'Amanhã'
    : prazoDias < 0 ? `${Math.abs(prazoDias)} dias atrás`
    : `em ${prazoDias} dias`;
  const prazoPrimaryCls = isLate ? 'date-cell__primary--late'
                        : isToday ? 'date-cell__primary--today' : '';
  const prazoSubCls = isLate ? 'date-cell__sub--late' : '';

  // Para rotinas recorrentes, o estado exibido é o da DATA da ocorrência
  const dia = occDate || new Date();
  const recorrente = D.temDias(item);
  const programada = recorrente ? D.rotinaNoDia(item, dia) : true;
  const feitaNoDia = recorrente ? D.rotinaFeitaNoDia(item, dia) : D.isFeito(item);
  const ehHoje = D.diasAteHoje(dia) === 0;
  // Estado por-dia da rotina: feito | andamento | falha | pendente | naoprog
  const rotEstado = recorrente ? D.rotinaEstadoNoDia(item, dia) : null;
  const rotAndamento = recorrente && rotEstado === 'andamento';
  const rotFalha = recorrente && rotEstado === 'falha';
  const rotFalhaInfo = rotFalha ? D.rotinaFalhaInfo(item, dia) : null;
  const statusK = recorrente
    ? (rotEstado === 'feito' ? 'feito'
       : rotEstado === 'andamento' ? 'andamento'
       : rotEstado === 'falha' ? 'falha'
       : rotEstado === 'naoprog' ? 'pausado' : 'aberto')
    : statusKey(item.status);
  const isFeito = feitaNoDia;

  return (
    <div className={`list-row fade-up ${menuOpen ? 'list-row--menu-open' : ''}`}>
      <div className={`list-row__origem list-row__origem--${origemClass}`}>{origemLetter}</div>

      <div className="list-row__hora-cell">
        {item.hora ? item.hora : <span className="list-row__hora-none">—</span>}
      </div>

      <div className="list-row__main">
        <div className="list-row__title">
          {item.titulo}
        </div>
        {item.descricao && <RowDesc text={item.descricao}/>}
        {!recorrente && item.status === 'Falha' && item.falhaMotivo && (
          <div className="list-row__falha-motivo" title={item.falhaMotivo}>
            {item.falhaCategoria ? `${item.falhaCategoria}: ` : ''}{item.falhaMotivo}
          </div>
        )}
        {recorrente && rotFalha && rotFalhaInfo && rotFalhaInfo.motivo && (
          <div className="list-row__falha-motivo" title={rotFalhaInfo.motivo}>
            {rotFalhaInfo.categoria ? `${rotFalhaInfo.categoria}: ` : ''}{rotFalhaInfo.motivo}
          </div>
        )}
        <div className="list-row__sub">
          <span>{item.origem}</span>
          {item.solicitante && (
            <>
              <span className="list-row__sub-dot"/>
              <span>de {item.solicitante}</span>
            </>
          )}
          {D.temDias(item) ? (
            <>
              <span className="list-row__sub-dot"/>
              <span>{item.dias}</span>
            </>
          ) : item.frequencia && (
            <>
              <span className="list-row__sub-dot"/>
              <span>{item.frequencia}</span>
            </>
          )}
        </div>
      </div>

      <div className="tag-cat" title={item.categoria}>{item.categoria}</div>

      <div>
        {item.prioridade === 'Crítica' && <span className="tag-prio tag-prio--critica">Crítica</span>}
        {item.prioridade === 'Alta' && <span className="tag-prio tag-prio--alta">Alta</span>}
        {item.prioridade === 'Média' && <span className="tag-prio tag-prio--media">Média</span>}
        {item.prioridade === 'Baixa' && <span className="tag-prio">Baixa</span>}
      </div>

      <div className="date-cell">
        {criadoDate ? (
          <>
            <span className="date-cell__primary">{criadoDate}</span>
            <span className="date-cell__sub">{criadoSub}</span>
          </>
        ) : (
          <span className="date-cell__none">—</span>
        )}
      </div>

      <div className="date-cell">
        {prazoDate ? (
          <>
            <span className={`date-cell__primary ${prazoPrimaryCls}`}>{prazoDate}</span>
            <span className={`date-cell__sub ${prazoSubCls}`}>{prazoSub}</span>
          </>
        ) : (
          <span className="date-cell__none">Sem prazo</span>
        )}
      </div>

      <div>
        <div className={`status status--${statusK}`}>
          <span className="status__dot"/>
          <span>{recorrente
            ? (rotEstado === 'feito' ? 'Concluído'
               : rotEstado === 'andamento' ? 'Em Andamento'
               : rotEstado === 'falha' ? 'Falha'
               : rotEstado === 'naoprog' ? 'Não programada' : 'Pendente')
            : item.status}</span>
        </div>
      </div>

      <div className="dropdown">
        <button className="list-row__action" title="Mais ações"
                ref={menuBtnRef}
                onClick={(e) => { e.stopPropagation(); onMenuToggle(item.id); }}>
          <More size={14}/>
        </button>
        {menuOpen && (
          <div className={`dropdown__menu ${flipUp ? 'dropdown__menu--up' : ''}`} onClick={(e) => e.stopPropagation()}>
            <button className="dropdown__item" onClick={() => { onEdit(item); onMenuToggle(null); }}>
              <Edit size={14}/> Editar
            </button>
            {(!recorrente || programada || feitaNoDia) && (
            <button className="dropdown__item" onClick={() => { onToggleComplete(item, dia); onMenuToggle(null); }}>
              {recorrente
                ? (feitaNoDia
                    ? <><Undo size={14}/> Reabrir {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]} ${String(dia.getDate()).padStart(2, '0')}/${String(dia.getMonth() + 1).padStart(2, '0')})`}</>
                    : <><CheckDouble size={14}/> Concluir {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]} ${String(dia.getDate()).padStart(2, '0')}/${String(dia.getMonth() + 1).padStart(2, '0')})`}</>)
                : (isFeito ? <><Undo size={14}/> Reabrir</> : <><CheckDouble size={14}/> Marcar Concluído</>)}
            </button>
            )}
            {/* EM ANDAMENTO — tarefas e rotinas (rotina: por dia, só se programada) */}
            {!recorrente
              ? (item.status !== 'Em Andamento' && !isFeito && item.status !== 'Falha' && (
                  <button className="dropdown__item dropdown__item--andamento" onClick={() => { onSetAndamento(item); onMenuToggle(null); }}>
                    <Loader size={14}/> Marcar em andamento
                  </button>
                ))
              : (programada && !feitaNoDia && (
                  rotAndamento
                    ? <button className="dropdown__item dropdown__item--andamento" onClick={() => { onSetAndamento(item, dia); onMenuToggle(null); }}>
                        <Undo size={14}/> Tirar de andamento {ehHoje ? '' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                    : <button className="dropdown__item dropdown__item--andamento" onClick={() => { onSetAndamento(item, dia); onMenuToggle(null); }}>
                        <Loader size={14}/> Em andamento {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                ))}
            {/* FALHA — tarefas e rotinas (rotina: por dia) */}
            {!recorrente
              ? (item.status === 'Falha'
                  ? <button className="dropdown__item" onClick={() => { onClearFalha(item); onMenuToggle(null); }}>
                      <Undo size={14}/> Desfazer falha
                    </button>
                  : <button className="dropdown__item dropdown__item--warn" onClick={() => { onMarkFalha(item); onMenuToggle(null); }}>
                      <Warning size={14}/> Marcar falha
                    </button>)
              : (programada && (
                  rotFalha
                    ? <button className="dropdown__item" onClick={() => { onClearFalha(item, dia); onMenuToggle(null); }}>
                        <Undo size={14}/> Desfazer falha {ehHoje ? '' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                    : <button className="dropdown__item dropdown__item--warn" onClick={() => { onMarkFalha(item, dia); onMenuToggle(null); }}>
                        <Warning size={14}/> Marcar falha {ehHoje ? 'hoje' : `(${D.DIAS_SEMANA[dia.getDay()]})`}
                      </button>
                ))}
            <button className="dropdown__item" onClick={() => { onDuplicate(item); onMenuToggle(null); }}>
              <Copy size={14}/> Duplicar
            </button>
            <div className="dropdown__divider"/>
            <button className="dropdown__item dropdown__item--danger" onClick={() => { onDelete(item, dia); onMenuToggle(null); }}>
              <Trash size={14}/> Excluir
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Ícone seta pra sort
const SortArrow = (p) => <Icon {...p}><path d="M12 5v14M5 12l7 7 7-7"/></Icon>;

function NextUp({ items, onAbrir }) {
  const [, tick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => tick(t => t + 1), 30000); // atualiza a cada 30s
    return () => clearInterval(id);
  }, []);

  // Próxima tarefa/rotina de HOJE (operacional) com hora, ainda ativa, no futuro
  const proxima = useMemo(() => {
    const now = new Date();
    const opNow = D.operationalDate(now);
    let nowMin = now.getHours() * 60 + now.getMinutes();
    const ds = D.getDayStart();
    if (ds > 0 && now.getHours() < ds) nowMin += 1440;
    const cands = items
      .filter(it => it.hora && /^\d{1,2}:\d{2}$/.test(it.hora))
      .filter(it => D.temDias(it)
        ? (D.rotinaNoDia(it, opNow) && !D.rotinaFeitaNoDia(it, opNow) && !D.rotinaFalhaNoDia(it, opNow))
        : (D.isAtivo(it) && it.prazo && D.diasAteHoje(it.prazo) === 0))
      .map(it => {
        const [h, m] = it.hora.split(':').map(Number);
        let alvo = h * 60 + m;
        if (ds > 0 && alvo < ds * 60) alvo += 1440;
        return { it, alvo, faltam: alvo - nowMin };
      })
      .filter(x => x.faltam >= 0)
      .sort((a, b) => a.faltam - b.faltam);
    return cands[0] || null;
  }, [items, typeof window !== 'undefined' ? Math.floor(Date.now() / 30000) : 0]);

  if (!proxima) return null;
  const { it, faltam } = proxima;
  const horas = Math.floor(faltam / 60), mins = faltam % 60;
  const tempo = faltam === 0 ? 'agora' : horas > 0 ? `${horas}h ${mins}min` : `${mins}min`;
  const iminente = faltam <= 15;

  return (
    <button className={`nextup ${iminente ? 'nextup--soon' : ''}`} onClick={() => onAbrir(it)}>
      <div className="nextup__left">
        <span className="nextup__label">Próximo</span>
        <span className="nextup__hora">{it.hora}</span>
      </div>
      <div className="nextup__mid">
        <div className="nextup__title">{it.titulo}</div>
        <div className="nextup__cats">{D.getCategorias && (it.categoria || '').split(',')[0]}</div>
      </div>
      <div className="nextup__right">
        <span className="nextup__count">{tempo === 'agora' ? 'AGORA' : `em ${tempo}`}</span>
        <span className="nextup__bar"><span className="nextup__bar-fill" style={{ width: `${Math.max(4, 100 - Math.min(100, (faltam / 180) * 100))}%` }}/></span>
      </div>
    </button>
  );
}

function StatusBar({ items, selDate, onJump }) {
  // Distribuição dos itens visíveis por estado (relativo à data)
  const buckets = useMemo(() => {
    let pend = 0, prog = 0, feito = 0, falha = 0;
    items.forEach(it => {
      if (D.temDias(it)) {
        if (!D.rotinaNoDia(it, selDate)) return;
        if (D.rotinaFeitaNoDia(it, selDate)) feito++;
        else if (it.status === 'Em Andamento') prog++;
        else pend++;
      } else {
        if (it.status === 'Falha') falha++;
        else if (D.isFeito(it)) feito++;
        else if (it.status === 'Em Andamento') prog++;
        else pend++;
      }
    });
    return { pend, prog, feito, falha };
  }, [items, selDate]);

  const total = buckets.pend + buckets.prog + buckets.feito + buckets.falha;
  if (total === 0) return null;

  const segs = [
    { key: 'pend',  label: 'Pendentes',    val: buckets.pend,  cls: 'statusbar__seg--pend' },
    { key: 'prog',  label: 'Em andamento', val: buckets.prog,  cls: 'statusbar__seg--prog' },
    { key: 'feito', label: 'Concluídos',   val: buckets.feito, cls: 'statusbar__seg--feito' },
    { key: 'falha', label: 'Falhas',       val: buckets.falha, cls: 'statusbar__seg--falha' },
  ].filter(s => s.val > 0);

  const pctFeito = Math.round((buckets.feito / total) * 100);
  return (
    <div className="statusbar fade-up">
      <div className="statusbar__top">
        <span className="statusbar__heading">Resumo do dia</span>
        <span className="statusbar__total"><b>{pctFeito}%</b> concluído · {total} {total === 1 ? 'item' : 'itens'}</span>
      </div>
      <div className="statusbar__track">
        {segs.map(s => (
          <div key={s.key} className={`statusbar__seg ${s.cls}`}
               style={{ flexGrow: s.val }}
               title={`${s.val} ${s.label}`}/>
        ))}
      </div>
      <div className="statusbar__legend">
        {segs.map(s => (
          <span key={s.key} className="statusbar__item">
            <span className={`statusbar__dot statusbar__dot--${s.key}`}/>
            <span className="statusbar__num">{s.val}</span>
            <span className="statusbar__meta">
              <span className="statusbar__label">{s.label}</span>
            </span>
          </span>
        ))}
      </div>
    </div>
  );
}

// ── INSIGHTS: análises e hábitos abaixo das tarefas ──
function InsightsPanel({ items, selDate }) {
  const stats = useMemo(() => {
    const hoje = D.operationalDate(new Date()); hoje.setHours(12,0,0,0);
    // Tendência dos últimos 7 dias: % de conclusão por dia
    const dias = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(hoje); d.setDate(d.getDate() - i);
      const doDia = items.filter(it => D.noDia(it, d));
      const feitos = doDia.filter(it => D.feitoNoDia(it, d)).length;
      const total = doDia.length;
      dias.push({
        label: ['D','S','T','Q','Q','S','S'][d.getDay()],
        dataLabel: d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }),
        total, feitos,
        pct: total === 0 ? 0 : Math.round((feitos / total) * 100),
        ehHoje: i === 0,
      });
    }
    // Sequência (streak): dias consecutivos (até ontem) com 100% de conclusão e ao menos 1 tarefa
    let streak = 0;
    for (let i = 1; i < 60; i++) {
      const d = new Date(hoje); d.setDate(d.getDate() - i);
      const doDia = items.filter(it => D.noDia(it, d));
      if (doDia.length === 0) continue;            // dia sem nada não quebra
      const todos = doDia.every(it => D.feitoNoDia(it, d));
      if (todos) streak++; else break;
    }
    // Stats da semana corrente (últimos 7 dias)
    const total7 = dias.reduce((s,d) => s + d.total, 0);
    const feitos7 = dias.reduce((s,d) => s + d.feitos, 0);
    const media = total7 === 0 ? 0 : Math.round((feitos7 / total7) * 100);
    // Falhas na semana
    let falhas7 = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(hoje); d.setDate(d.getDate() - i);
      falhas7 += items.filter(it => D.temDias(it) ? D.rotinaFalhaNoDia(it, d) : (it.status === 'Falha' && it.prazo && D.mesmoDia(it.prazo, d))).length;
    }
    // Categoria mais ativa na semana
    const catCount = {};
    items.forEach(it => {
      for (let i = 0; i < 7; i++) {
        const d = new Date(hoje); d.setDate(d.getDate() - i);
        if (D.noDia(it, d)) { (it.categoria||'').split(',').forEach(c => { c=c.trim(); if(c) catCount[c]=(catCount[c]||0)+1; }); break; }
      }
    });
    const topCat = Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0];
    return { dias, streak, media, total7, feitos7, falhas7, topCat: topCat ? topCat[0] : '—' };
  }, [items, selDate]);

  const maxPct = 100;

  return (
    <div className="insights">
      <div className="insights__head">
        <span className="insights__kicker">Análise dos últimos 7 dias</span>
      </div>

      <div className="insights__grid">
        {/* Tendência de conclusão */}
        <div className="insight-card insight-card--wide">
          <div className="insight-card__label">Conclusão por dia</div>
          <div className="insight-trend">
            {stats.dias.map((d, i) => (
              <div key={i} className={`insight-bar ${d.ehHoje ? 'insight-bar--today' : ''}`} title={`${d.dataLabel}: ${d.pct}% (${d.feitos}/${d.total})`}>
                <div className="insight-bar__track">
                  <div className="insight-bar__fill" style={{ height: `${Math.max(3, (d.pct/maxPct)*100)}%` }}/>
                </div>
                <span className="insight-bar__pct">{d.total === 0 ? '·' : d.pct}</span>
                <span className="insight-bar__day">{d.label}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Sequência / hábito */}
        <div className="insight-card insight-card--metric">
          <div className="insight-card__label">Sequência</div>
          <div className="insight-metric">
            <span className="insight-metric__value">{stats.streak}</span>
            <span className="insight-metric__unit">{stats.streak === 1 ? 'dia' : 'dias'}</span>
          </div>
          <div className="insight-metric__sub">
            {stats.streak === 0 ? 'Conclua tudo de um dia para iniciar' : 'Dias seguidos com tudo concluído'}
          </div>
          <div className="insight-flames">
            {Array.from({length: Math.min(7, Math.max(1, stats.streak))}).map((_,i) => (
              <span key={i} className={`insight-flame ${i < stats.streak ? 'insight-flame--on' : ''}`}/>
            ))}
          </div>
        </div>

        {/* Resumo da semana */}
        <div className="insight-card insight-card--metric">
          <div className="insight-card__label">Média da semana</div>
          <div className="insight-metric">
            <span className="insight-metric__value">{stats.media}<span className="insight-metric__pct">%</span></span>
          </div>
          <div className="insight-stats">
            <div className="insight-stat"><span className="insight-stat__n">{stats.feitos7}</span><span className="insight-stat__l">concluídas</span></div>
            <div className="insight-stat"><span className="insight-stat__n insight-stat__n--bad">{stats.falhas7}</span><span className="insight-stat__l">falhas</span></div>
            <div className="insight-stat"><span className="insight-stat__n">{stats.total7}</span><span className="insight-stat__l">no total</span></div>
          </div>
          <div className="insight-metric__sub">Foco: {stats.topCat}</div>
        </div>
      </div>
    </div>
  );
}

function HabitsPanel({ items }) {
  const habitos = useMemo(() => {
    const hoje = D.operationalDate(new Date()); hoje.setHours(12,0,0,0);
    const rotinas = items.filter(it => D.temDias(it));
    return rotinas.map(it => {
      // últimos 14 dias: estado por dia (feito / falha / pendente-programado / nao-programado)
      const dias = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date(hoje); d.setDate(d.getDate() - i);
        let estado = 'naoprog';
        if (D.rotinaNoDia(it, d)) {
          if (D.rotinaFeitaNoDia(it, d)) estado = 'feito';
          else if (D.rotinaFalhaNoDia(it, d)) estado = 'falha';
          else estado = d < hoje ? 'perdido' : (D.mesmoDia(d, hoje) ? 'hoje' : 'futuro');
        }
        dias.push({ estado, ehHoje: D.mesmoDia(d, hoje) });
      }
      // sequência atual (dias programados consecutivos concluídos, terminando em hoje/ontem)
      let streak = 0;
      for (let i = 0; i < 90; i++) {
        const d = new Date(hoje); d.setDate(d.getDate() - i);
        if (!D.rotinaNoDia(it, d)) continue;
        if (D.rotinaFeitaNoDia(it, d)) streak++;
        else { if (i === 0) continue; break; } // hoje ainda pendente não quebra
      }
      // consistência nos últimos 14 dias programados
      const prog = dias.filter(x => x.estado !== 'naoprog' && x.estado !== 'futuro' && x.estado !== 'hoje');
      const ok = dias.filter(x => x.estado === 'feito').length;
      const consist = prog.length === 0 ? 0 : Math.round((ok / (prog.length || 1)) * 100);
      return { it, dias, streak, consist };
    }).sort((a, b) => b.streak - a.streak);
  }, [items]);

  if (habitos.length === 0) return null;

  return (
    <div className="habits">
      <div className="habits__head">
        <span className="habits__kicker">Hábitos & Rotinas</span>
        <span className="habits__sub">Consistência nos últimos 14 dias</span>
      </div>
      <div className="habits__list">
        {habitos.map(({ it, dias, streak, consist }) => (
          <div key={it.id} className="habit-row">
            <div className="habit-row__info">
              <div className="habit-row__name">{it.titulo}</div>
              <div className="habit-row__meta">
                <span className="habit-row__streak">{streak > 0 ? `${streak} seguido${streak > 1 ? 's' : ''}` : 'sem sequência'}</span>
                <span className="habit-row__consist">{consist}% consistência</span>
              </div>
            </div>
            <div className="habit-row__grid">
              {dias.map((d, i) => (
                <span key={i} className={`habit-cell habit-cell--${d.estado} ${d.ehHoje ? 'habit-cell--today' : ''}`}
                      title={d.estado}/>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
