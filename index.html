// ITEM MODAL — criar/editar item
// ────────────────────────────────────────────────────────────────────────────
function ItemModal({ open, item, onClose, onSave, prefillDate }) {
  const { montado, saindo } = usePresence(open, 280);
  const isEdit = !!item;
  const todayISO = new Date().toISOString().slice(0, 10);

  const [origem, setOrigem] = useState('Projeto');
  const [titulo, setTitulo] = useState('');
  const [descricao, setDescricao] = useState('');
  const wsCats = D.getCategorias();
  const [categorias, setCategorias] = useState([wsCats[0]]);
  const [prioridade, setPrioridade] = useState('Média');
  const [status, setStatus] = useState('Pendente');
  const [prazo, setPrazo] = useState('');
  const [hora, setHora] = useState('');
  const [solicitante, setSolicitante] = useState('');
  const [frequencia, setFrequencia] = useState('Diária');
  const [dias, setDias] = useState(['Seg', 'Ter', 'Qua', 'Qui', 'Sex']);
  const [error, setError] = useState('');

  // Reset state quando abre / muda item
  useEffect(() => {
    if (!open) return;
    setOrigem(item?.origem || 'Projeto');
    setTitulo(item?.titulo || '');
    setDescricao(item?.descricao || '');
    const cats = D.splitCats(item?.categoria);
    setCategorias(cats.length > 0 ? cats : [wsCats[0]]);
    setPrioridade(item?.prioridade || 'Média');
    setStatus(item?.status || (item?.origem === 'Pedido' ? 'Recebido' : 'Pendente'));
    setPrazo(item?.prazo ? String(item.prazo).slice(0, 10) : (prefillDate || ''));
    setHora(item?.hora || '');
    setSolicitante(item?.solicitante || '');
    setFrequencia(item?.frequencia || 'Diária');
    const d = D.splitDias(item?.dias);
    setDias(d.length > 0 ? d : ['Seg', 'Ter', 'Qua', 'Qui', 'Sex']);
    setError('');
  }, [open, item, prefillDate]);

  // Quando muda origem, ajusta status default e limpa campos específicos
  useEffect(() => {
    if (!open || isEdit) return;
    if (origem === 'Pedido') setStatus('Recebido');
    else if (origem === 'Rotina') setStatus('Pendente');
    else setStatus('Pendente');
  }, [origem, open, isEdit]);

  // ESC fecha
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!montado) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!titulo.trim()) {
      setError('O título é obrigatório');
      return;
    }
    if (categorias.length === 0) {
      setError('Selecione ao menos uma categoria');
      return;
    }
    if (origem === 'Rotina' && dias.length === 0) {
      setError('Selecione ao menos um dia da semana para a rotina');
      return;
    }
    const data = {
      origem,
      titulo: titulo.trim(),
      descricao: descricao.trim() || undefined,
      categoria: categorias.join(', '),
      prioridade,
      status,
      criadoEm: item?.criadoEm || todayISO,
    };
    if (prazo) data.prazo = prazo;
    if (hora) data.hora = hora;
    if (origem === 'Rotina') data.dias = dias.join(', ');
    if (origem === 'Pedido') {
      if (solicitante.trim()) data.solicitante = solicitante.trim();
      data.recebidoEm = item?.recebidoEm || todayISO;
    }
    if (origem === 'Rotina' && item?.frequencia) {
      data.frequencia = frequencia; // preserva valor legado ao editar
    }
    if (origem === 'Projeto' && item?.progresso !== undefined) {
      data.progresso = item.progresso;
    }
    onSave(data);
  };

  const statusOpts = origem === 'Pedido'
    ? ['Recebido', 'Em Andamento', 'Concluído', 'Falha', 'Recusado']
    : origem === 'Rotina'
      ? ['Pendente', 'Em Andamento', 'Concluído', 'Falha']
      : origem === 'Demanda'
        ? ['Pendente', 'Em Andamento', 'Concluído', 'Falha', 'Cancelado']
        : ['Pendente', 'Em Andamento', 'Pausado', 'Bloqueado', 'Concluído', 'Falha', 'Cancelado'];

  return (
    <div className={`modal-backdrop ${saindo ? 'is-closing' : ''}`} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal modal--form">
        <header className="modal__header">
          <div className="modal__title">{isEdit ? 'Editar item' : 'Novo item'}</div>
          <button type="button" className="modal__close" onClick={onClose} title="Fechar">
            <X size={16}/>
          </button>
        </header>

        <form onSubmit={handleSubmit}>
          <div className="modal__body">
            {/* Origem */}
            <div className="form-section__title">Identificação</div>
            <div className="form-group">
              <label className="form-group__label">Origem</label>
              <div className="form-segmented">
                {['Projeto', 'Demanda', 'Pedido', 'Rotina'].map(o => (
                  <button key={o} type="button"
                          className={`form-segmented__item ${origem === o ? 'form-segmented__item--active' : ''}`}
                          onClick={() => setOrigem(o)}>
                    {o}
                  </button>
                ))}
              </div>
            </div>

            {/* Título */}
            <div className="form-group">
              <label className="form-group__label">
                Título<span className="form-group__label-req">*</span>
              </label>
              <input type="text" className="form-input" value={titulo}
                     onChange={(e) => { setTitulo(e.target.value); setError(''); }}
                     placeholder="Ex: Revisar tabela de fretes regional Sul"
                     autoFocus/>
              {error && <div className="form-group__hint" style={{ color: 'var(--color-critical)' }}>{error}</div>}
            </div>

            {/* Descrição */}
            <div className="form-group">
              <label className="form-group__label">Descrição</label>
              <textarea className="form-textarea" value={descricao}
                        onChange={(e) => setDescricao(e.target.value)}
                        placeholder="Detalhes adicionais (opcional)"
                        rows={2}/>
            </div>

            <div className="form-section__title form-section__title--gap">Classificação</div>

            {/* Categorias (multi-seleção) */}
            <div className="form-group">
              <label className="form-group__label">
                Categorias <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· Selecione uma ou mais</span>
              </label>
              <div className="form-chips">
                {wsCats.map(c => {
                  const active = categorias.includes(c);
                  return (
                    <button key={c} type="button"
                            className={`form-chip ${active ? 'form-chip--active' : ''}`}
                            onClick={() => setCategorias(prev =>
                              active ? prev.filter(x => x !== c) : [...prev, c]
                            )}>
                      <span className="form-chip__mark">{active ? '■' : '□'}</span>
                      {c}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Prioridade */}
            <div className="form-row">
              <div className="form-group">
                <label className="form-group__label">Prioridade</label>
                <div className="form-segmented">
                  {['Crítica', 'Alta', 'Média', 'Baixa'].map(p => (
                    <button key={p} type="button"
                            className={`form-segmented__item ${prioridade === p ? 'form-segmented__item--active' : ''}`}
                            onClick={() => setPrioridade(p)}>
                      {p}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="form-section__title form-section__title--gap">Agendamento</div>

            {/* Status + Hora (opcional) */}
            <div className="form-row">
              <div className="form-group">
                <label className="form-group__label">Status</label>
                <select className="form-select" value={status}
                        onChange={(e) => setStatus(e.target.value)}>
                  {statusOpts.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-group__label">
                  Hora <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· Opcional</span>
                </label>
                <input type="time" className="form-input" value={hora}
                       onChange={(e) => setHora(e.target.value)}/>
              </div>
            </div>

            {/* Rotina: dias da semana em que se repete */}
            {origem === 'Rotina' && (
              <div className="form-group">
                <label className="form-group__label">
                  Dias da semana <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· A rotina reaparece automaticamente nesses dias</span>
                </label>
                <div className="day-chips">
                  {['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(d => {
                    const active = dias.includes(d);
                    return (
                      <button key={d} type="button"
                              className={`day-chip ${active ? 'day-chip--active' : ''}`}
                              onClick={() => setDias(prev =>
                                active ? prev.filter(x => x !== d) : [...prev, d]
                              )}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Prazo com atalho de dia da semana */}
            {origem !== 'Rotina' && (
              <div className="form-group">
                <label className="form-group__label">
                  Prazo de entrega <span style={{ color: 'var(--color-text-quaternary)', fontWeight: 400 }}>· Ou escolha o dia abaixo</span>
                </label>
                <input type="date" className="form-input" value={prazo}
                       onChange={(e) => setPrazo(e.target.value)}/>
                <div className="day-chips" style={{ marginTop: 6 }}>
                  {['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map((d, i) => {
                    const targetDow = (i + 1) % 7; // Seg=1 ... Dom=0
                    const selDow = prazo ? new Date(prazo + 'T12:00:00').getDay() : null;
                    return (
                      <button key={d} type="button"
                              className={`day-chip ${selDow === targetDow ? 'day-chip--active' : ''}`}
                              title={`Próxima ${d === 'Sáb' || d === 'Dom' ? '' : ''}${d}`}
                              onClick={() => {
                                const t = new Date(); t.setHours(12, 0, 0, 0);
                                const diff = (targetDow - t.getDay() + 7) % 7 || 7;
                                t.setDate(t.getDate() + (D.DIAS_SEMANA[t.getDay()] === d ? 0 : diff));
                                setPrazo(t.toISOString().slice(0, 10));
                              }}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Campos específicos */}
            {origem === 'Pedido' && (
              <div className="form-group">
                <label className="form-group__label">Solicitante</label>
                <input type="text" className="form-input" value={solicitante}
                       onChange={(e) => setSolicitante(e.target.value)}
                       placeholder="Ex: Gestor, Cliente interno, Outra área"/>
              </div>
            )}
          </div>

          <footer className="modal__footer">
            <button type="button" className="btn" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn btn--primary">
              {isEdit ? 'Salvar alterações' : 'Adicionar item'}
            </button>
          </footer>
        </form>
      </div>
    </div>
  );
}

function Onboarding({ onFinish }) {
  const [step, setStep] = useState(0);
  const [leaving, setLeaving] = useState(false);
  const total = ONBOARDING_STEPS.length;
  const s = ONBOARDING_STEPS[step];
  const IconC = ONB_ICONS[s.icon] || Layers;
  const last = step === total - 1;

  const go = (n) => { if (n >= 0 && n < total) setStep(n); };
  const avancar = () => last ? sair() : go(step + 1);
  const sair = () => { setLeaving(true); setTimeout(onFinish, 420); };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') sair();
      else if (e.key === 'ArrowRight' || e.key === 'Enter') avancar();
      else if (e.key === 'ArrowLeft') go(step - 1);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [step]);

  return (
    <div className={`onb ${leaving ? 'onb--leaving' : ''}`}>
      {/* Painel esquerdo — editorial */}
      <div className="onb__left">
        <div className="onb__brand">
          <span className="onb__brand-mark">
            <VillaresMark size={17}/>
          </span>
          VILLARES<span className="onb__brand-sep"> | </span>PLANNER
        </div>

        <div className="onb__left-body" key={step}>
          <div className="onb__index">
            <span className="onb__index-num">{String(step + 1).padStart(2, '0')}</span>
            <span className="onb__index-sep">/</span>
            <span className="onb__index-total">{String(total).padStart(2, '0')}</span>
          </div>
          <div className="onb__tag">{s.tag}</div>
          <h1 className="onb__title">{s.title}</h1>
          <p className="onb__text">{s.text}</p>
        </div>

        <div className="onb__footer">
          <div className="onb__nav">
            <div className="onb__dots">
              {ONBOARDING_STEPS.map((_, i) => (
                <button key={i}
                        className={`onb__dot ${i === step ? 'onb__dot--active' : ''} ${i < step ? 'onb__dot--done' : ''}`}
                        onClick={() => go(i)} aria-label={`Passo ${i + 1}`}/>
              ))}
            </div>
            <div className="onb__actions">
              {step > 0 && <button className="onb__btn onb__btn--ghost" onClick={() => go(step - 1)}>Voltar</button>}
              <button className="onb__btn onb__btn--primary" onClick={avancar}>
                {last ? 'Entrar no Planner' : 'Avançar'}
                {!last && <span className="onb__btn-arrow">→</span>}
              </button>
            </div>
          </div>
          <button className="onb__skip" onClick={sair}>Pular apresentação</button>
        </div>
      </div>

      {/* Painel direito — visual */}
      <div className="onb__right" key={'v' + step}>
        <div className="onb__stage">
          <div className="onb__rings">
            <span className="onb__ring onb__ring--1"/>
            <span className="onb__ring onb__ring--2"/>
            <span className="onb__ring onb__ring--3"/>
          </div>
          <div className="onb__grid-bg"/>
          <div className="onb__icon-wrap">
            <div className="onb__icon"><IconC size={44}/></div>
            <div className="onb__icon-glow"/>
          </div>
        </div>
        <div className="onb__progress"><div className="onb__progress-fill" style={{ width: `${((step + 1) / total) * 100}%` }}/></div>
      </div>
    </div>
  );
}


function QuickActionPopup({ item, selDate, onClose, onConcluir, onAndamento, onFalha, onAbrir, alarmeAtivo, onSilenciar }) {
  const { montado, saindo } = usePresence(!!item, 280);
  const lastRef = useRef(item);
  if (item) lastRef.current = item;          // segura o último item durante a saída
  useEffect(() => {
    if (!item) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [item]);

  if (!montado) return null;
  const itemAtivo = item || lastRef.current;
  if (!itemAtivo) return null;
  const recorrente = D.temDias(itemAtivo);
  let mostrarAndamento = true;
  try { mostrarAndamento = localStorage.getItem('villares_quick_andamento') !== 'off'; } catch {}

  return (
    <div className={`qa-backdrop ${saindo ? 'is-closing' : ''}`} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>

// ────────────────────────────────────────────────────────────────────────────
// PAINEL DE NOTIFICAÇÕES — vencimentos, atrasados, rotinas pendentes
// ────────────────────────────────────────────────────────────────────────────
function buildNotifs(items) {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const notifs = [];
  const horaMin = (h) => { if (!h) return null; const [hh, mm] = String(h).split(':').map(Number); return hh*60+mm; };

  items.forEach(it => {
    // ── Atrasados (mais antigo = mais urgente) ──
    if (!D.temDias(it) && D.isAtivo(it) && D.isAtrasado(it)) {
      const dias = Math.abs(D.diasAteHoje(it.prazo));
      const sub = dias === 0 && it.hora
        ? `Passou da hora (${it.hora}) — pendente`
        : `Atrasado há ${dias} ${dias === 1 ? 'dia' : 'dias'}`;
      notifs.push({ id: 'late-' + it.id, type: 'late', prio: 0, sort: dias === 0 ? -0.5 : -dias,
        titulo: it.titulo, sub,
        subClass: 'notif-item__sub--critical', item: it });
    }
    // ── Vence hoje (por hora) ──
    else if (!D.temDias(it) && D.isAtivo(it) && D.isHoje(it)) {
      const hm = horaMin(it.hora);
      notifs.push({ id: 'today-' + it.id, type: 'today', prio: 1, sort: hm ?? 9999,
        titulo: it.titulo, sub: it.hora ? `Vence hoje às ${it.hora}` : 'Vence hoje',
        subClass: 'notif-item__sub--warn', item: it });
    }
    // ── Próximos dias (mais próximo primeiro) ──
    else if (!D.temDias(it) && D.isAtivo(it) && it.prazo) {
      const d = D.diasAteHoje(it.prazo);
      if (d > 0 && d <= 7) {
        notifs.push({ id: 'soon-' + it.id, type: 'soon', prio: 2, sort: d,
          titulo: it.titulo,
          sub: `${d === 1 ? 'Vence amanhã' : `Vence em ${d} dias`} — ${D.formatDate(it.prazo)}`,
          subClass: '', item: it });
      }
    }
    // ── Crítica sem prazo ──
    if (!D.temDias(it) && D.isAtivo(it) && it.prioridade === 'Crítica' && !it.prazo) {
      notifs.push({ id: 'critica-' + it.id, type: 'critica', prio: 3, sort: 0,
        titulo: it.titulo, sub: 'Crítica · sem prazo definido', subClass: '', item: it });
    }
    // ── Rotina de hoje (por hora; já passou da hora = mais urgente) ──
    if (D.temDias(it) && D.rotinaNoDia(it, hoje) && !D.rotinaFeitaHoje(it)) {
      const hm = horaMin(it.hora);
      const atrasada = hm !== null && hm < nowMin;
      notifs.push({ id: 'rotina-' + it.id, type: 'rotina', prio: 4, sort: hm ?? 9999,
        titulo: it.titulo,
        sub: it.hora ? (atrasada ? `Pendente desde ${it.hora}` : `Programada para ${it.hora}`) : 'Rotina de hoje',
        subClass: atrasada ? 'notif-item__sub--warn' : '', item: it });
    }
  });

  // Ordenação orgânica: por grupo de urgência, depois por proximidade no tempo
  return notifs.sort((a, b) => a.prio - b.prio || a.sort - b.sort);
}

// Resumo inteligente do dia — frases acionáveis, não só listas.
function buildDigest(items) {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const opNow = D.operationalDate(new Date());
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const horaMin = (h) => { if (!h || !/^\d{1,2}:\d{2}$/.test(h)) return null; const [a,b]=h.split(':').map(Number); return a*60+b; };
  const linhas = [];

  // 1) Próxima tarefa com hora ainda por vir hoje
  const comHora = items
    .filter(it => it.hora && horaMin(it.hora) !== null)
    .filter(it => D.temDias(it)
      ? (D.rotinaNoDia(it, opNow) && !D.rotinaFeitaNoDia(it, opNow) && !D.rotinaFalhaNoDia(it, opNow))
      : (D.isAtivo(it) && it.prazo && D.diasAteHoje(it.prazo) === 0))
    .map(it => ({ it, m: horaMin(it.hora) }))
    .filter(x => x.m >= nowMin)
    .sort((a,b) => a.m - b.m);
  if (comHora.length) {
    const p = comHora[0];
    const faltam = p.m - nowMin;
    const quando = faltam <= 0 ? 'agora' : faltam < 60 ? `em ${faltam}min` : `às ${p.it.hora}`;
    linhas.push({ tipo: 'foco', texto: `Próxima: ${p.it.titulo} ${quando}`, item: p.it });
  }

  // 2) Rotinas de hoje ainda pendentes (sequência em risco)
  const rotinasHoje = items.filter(it => D.temDias(it) && D.rotinaNoDia(it, opNow));
  const rotinasPend = rotinasHoje.filter(it => !D.rotinaFeitaNoDia(it, opNow) && !D.rotinaFalhaNoDia(it, opNow));
  if (rotinasHoje.length > 0 && rotinasPend.length > 0) {
    linhas.push({ tipo: 'rotina', texto: `${rotinasPend.length} de ${rotinasHoje.length} rotinas ainda pendentes hoje` });
  } else if (rotinasHoje.length > 0 && rotinasPend.length === 0) {
    linhas.push({ tipo: 'ok', texto: `Todas as ${rotinasHoje.length} rotinas de hoje concluídas` });
  }

  // 3) Atrasados acumulados
  const atrasados = items.filter(it => !D.temDias(it) && D.isAtivo(it) && D.isAtrasado(it));
  if (atrasados.length > 0) {
    linhas.push({ tipo: 'late', texto: `${atrasados.length} ${atrasados.length===1?'item atrasado':'itens atrasados'} aguardando ação` });
  }

  // 4) Carga do dia
  const doDia = items.filter(it => D.temDias(it) ? D.rotinaNoDia(it, opNow) : (D.isAtivo(it) && it.prazo && D.diasAteHoje(it.prazo) === 0));
  if (doDia.length === 0 && atrasados.length === 0) {
    linhas.push({ tipo: 'ok', texto: 'Dia tranquilo — nada vencendo hoje' });
  }

  return linhas;
}

const NOTIF_GROUPS = {
  late:    { label: 'Atrasados',         accent: 'var(--color-critical)' },
  today:   { label: 'Vencem hoje',       accent: '#e0922b' },
  soon:    { label: 'Próximos dias',     accent: '#c98a2b' },
  critica: { label: 'Crítico sem prazo', accent: 'var(--color-critical)' },
  rotina:  { label: 'Rotinas de hoje',   accent: 'var(--color-neutral-strong)' },
};

function NotifPanel({ items, readIds, onMarkAll, onClose, onEditItem, dismissedIds, onDismiss,
                     alarmEnabled, onEnableAlarm, onDisableAlarm }) {
  const notifs = useMemo(() => buildNotifs(items), [items]);
  const digest = useMemo(() => buildDigest(items), [items]);
  const dismissed = dismissedIds || new Set();
  const visible = useMemo(() => notifs.filter(n => !dismissed.has(n.id)), [notifs, dismissed]);
  const unread = visible.filter(n => !readIds.has(n.id));

  const groups = useMemo(() => {
    const map = new Map();
    visible.forEach(n => {
      if (!map.has(n.type)) map.set(n.type, []);
      map.get(n.type).push(n);
    });
    return [...map.entries()].filter(([, list]) => list.length > 0);
  }, [visible]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div className="notif-panel" role="dialog" aria-label="Notificações">
      <div className="notif-panel__head">
        <span className="notif-panel__title">
          <strong>Notificações</strong>
          {unread.length > 0 && `${unread.length} nova${unread.length > 1 ? 's' : ''}`}
        </span>
        {unread.length > 0 && (
          <button className="notif-panel__mark" onClick={onMarkAll}>Marcar lidas</button>
        )}
      </div>
      <button className={`notif-alarm ${alarmEnabled ? 'notif-alarm--on' : ''}`}
              onClick={alarmEnabled ? onDisableAlarm : onEnableAlarm}>
        <span className="notif-alarm__icon">{alarmEnabled ? '🔔' : '🔕'}</span>
        <span className="notif-alarm__text">
          {alarmEnabled ? 'Alarme ativo — toca perto do horário' : 'Ativar alarme de vencimentos'}
        </span>
        <span className="notif-alarm__switch" aria-label={alarmEnabled ? 'Ativado' : 'Desativado'}/>
      </button>
      <div className="notif-panel__body">
        {digest.length > 0 && (
          <div className="notif-digest">
            <div className="notif-digest__title">Resumo do dia</div>
            {digest.map((l, i) => (
              <div key={i} className={`notif-digest__line notif-digest__line--${l.tipo} ${l.item ? 'notif-digest__line--clickable' : ''}`}
                   onClick={l.item ? () => onEditItem(l.item) : undefined}>
                <span className="notif-digest__dot"/>
                <span>{l.texto}</span>
              </div>
            ))}
          </div>
        )}
        {visible.length === 0 ? (
          <div className="notif-panel__empty">
            <div className="notif-panel__empty-mark">✓</div>
            <div className="notif-panel__empty-title">Tudo em dia</div>
            <div className="notif-panel__empty-sub">Nenhum vencimento ou pendência no radar.</div>
          </div>
        ) : groups.map(([type, list]) => {
          const g = NOTIF_GROUPS[type] || { label: type, accent: 'var(--color-neutral-mid)' };
          return (
            <div key={type} className="notif-group">
              <div className="notif-group__label">
                <span className="notif-group__bar" style={{ background: g.accent }}/>
                {g.label}
                <span className="notif-group__count">{list.length}</span>
              </div>
              {list.map(n => (
                <div key={n.id}
                     className={`notif-item ${!readIds.has(n.id) ? 'notif-item--unread' : ''}`}
                     data-type={n.type}>
                  <button className="notif-item__main"
                          onClick={() => { onEditItem(n.item); onClose(); }}>
                    <span className="notif-item__bar" style={{ background: g.accent }}/>
                    <span className="notif-item__content">
                      <span className="notif-item__title">{n.titulo}</span>
                      <span className={`notif-item__sub ${n.subClass}`}>{n.sub}</span>
                    </span>
                  </button>
                  <button className="notif-item__dismiss"
                          title="Dispensar"
                          onClick={(e) => { e.stopPropagation(); onDismiss && onDismiss(n.id); }}>×</button>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// OCORRÊNCIAS — tarefas com prazo no dia + rotinas recorrentes do dia da semana
// ────────────────────────────────────────────────────────────────────────────
const sameDay = (a, b) =>
  a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

const parseDia = (v) => D.parseLocalDate(v);

// Ocorrência concluída naquele dia específico?
const ocorrenciaFeita = (it, d) => {
  if (D.temDias(it)) return D.rotinaFeitaNoDia(it, d);
  return D.isFeito(it);
};

// Todas as ocorrências de uma data, ordenadas por hora (sem hora ao fim)
const occurrencesForDay = (items, d) => {
  const fixos = items.filter(it => it.prazo && sameDay(parseDia(it.prazo), d) && !D.temDias(it));
  const rotinas = items.filter(it => D.rotinaNoDia(it, d));
  return [...rotinas, ...fixos].sort((a, b) => {
    if (a.hora && b.hora) return a.hora.localeCompare(b.hora);
    if (a.hora) return -1;
    if (b.hora) return 1;
    return 0;
  });
};

// ────────────────────────────────────────────────────────────────────────────
// KANBAN — colunas por status com arrastar e soltar
// ────────────────────────────────────────────────────────────────────────────
const KANBAN_COLS = [
  { status: 'Pendente',     extra: ['Recebido'], mod: '' },
  { status: 'Em Andamento', extra: [],           mod: '' },
  { status: 'Pausado',      extra: [],           mod: '' },
  { status: 'Bloqueado',    extra: [],           mod: 'kanban__col--blocked' },
  { status: 'Concluído',    extra: [],           mod: 'kanban__col--done' },
];

function KanbanView({ items, onEdit, onSetStatus, onToggle, selDate }) {
  const [draggingId, setDraggingId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const dia = selDate || new Date();

  const colItems = (col) =>
    items.filter(it => {
      if (D.temDias(it)) {
        // Rotina: só aparece nos dias em que está programada; coluna pelo estado do dia
        if (!D.rotinaNoDia(it, dia)) return false;
        const alvo = D.rotinaFeitaNoDia(it, dia) ? 'Concluído' : 'Pendente';
        return col.status === alvo;
      }
      return it.status === col.status || col.extra.includes(it.status);
    });

  const handleDrop = (e, col) => {
    e.preventDefault();
    setOverCol(null);
    const id = e.dataTransfer.getData('text/plain') || draggingId;
    setDraggingId(null);
    const item = items.find(it => it.id === id);
    if (!item) return;
    if (D.temDias(item)) {
      // Rotina: arrastar para Concluído = concluir o DIA selecionado; sair = reabrir
      const feita = D.rotinaFeitaNoDia(item, dia);
      if (col.status === 'Concluído' && !feita) onToggle(item, dia);
      else if (col.status !== 'Concluído' && feita) onToggle(item, dia);
      return;
    }
    onSetStatus(item, col.status);
  };

  // Mover por BOTÃO (funciona no touch/mobile, onde arrastar não funciona)
  const colIndex = (it) => {
    if (D.temDias(it)) return D.rotinaFeitaNoDia(it, dia) ? KANBAN_COLS.length - 1 : 0;
    const i = KANBAN_COLS.findIndex(c => c.status === it.status || c.extra.includes(it.status));
    return i < 0 ? 0 : i;
  };
  const moverItem = (it, dir) => {
    const atual = colIndex(it);
    const alvo = Math.max(0, Math.min(KANBAN_COLS.length - 1, atual + dir));
    if (alvo === atual) return;
    const colAlvo = KANBAN_COLS[alvo];
    if (D.temDias(it)) {
      const feita = D.rotinaFeitaNoDia(it, dia);
      if (colAlvo.status === 'Concluído' && !feita) onToggle(it, dia);
      else if (colAlvo.status !== 'Concluído' && feita) onToggle(it, dia);
      return;
    }
    onSetStatus(it, colAlvo.status);
  };

  return (
    <>
      <div className="view-head">
        <div className="view-head__title">Kanban</div>
        <div className="view-head__meta">Arraste os cards ou use as setas para mudar o status</div>
      </div>
      <div className="kanban">
        {KANBAN_COLS.map(col => {
          const cards = colItems(col);
          return (
            <div key={col.status}
                 className={`kanban__col ${col.mod} ${overCol === col.status ? 'kanban__col--over' : ''}`}
                 onDragOver={(e) => { e.preventDefault(); setOverCol(col.status); }}
                 onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOverCol(null); }}
                 onDrop={(e) => handleDrop(e, col)}>
              <div className="kanban__col-head">
                <div className="kanban__col-title">
                  <span className="kanban__col-dot"/>
                  {col.status}
                </div>
                <span className="kanban__col-count">{cards.length}</span>
              </div>
              <div className="kanban__cards">
                {cards.length === 0 ? (
                  <div className="kanban__empty">Solte aqui</div>
                ) : cards.map(it => (
                  <div key={it.id}
                       className={`kanban__card ${it.prioridade === 'Crítica' ? 'kanban__card--critica' : it.prioridade === 'Alta' ? 'kanban__card--alta' : it.prioridade === 'Média' ? 'kanban__card--media' : ''} ${draggingId === it.id ? 'kanban__card--dragging' : ''}`}
                       draggable
                       onDragStart={(e) => {
                         e.dataTransfer.setData('text/plain', it.id);
                         e.dataTransfer.effectAllowed = 'move';
                         setDraggingId(it.id);
                       }}
                       onDragEnd={() => { setDraggingId(null); setOverCol(null); }}
                       onDoubleClick={() => onEdit(it)}
                       title="Arraste para mover · Duplo clique para editar">
                    <div className="kanban__card-title">{it.titulo}</div>
                    <div className="kanban__card-meta">
                      <span>{it.origem}</span>
                      {it.prioridade && <span>· {it.prioridade}</span>}
                      {it.prazo && (
                        <span className={D.isAtrasado(it) ? 'late' : ''}>
                          · {D.formatRelative(it.prazo)}
                        </span>
                      )}
                    </div>
                    <div className="kanban__card-move">
                      <button className="kanban__move-btn" disabled={colIndex(it) === 0}
                              onClick={(e) => { e.stopPropagation(); moverItem(it, -1); }}
                              title="Voltar status" aria-label="Voltar status"><ChevLeft size={13}/></button>
                      <button className="kanban__move-btn" disabled={colIndex(it) === KANBAN_COLS.length - 1}
                              onClick={(e) => { e.stopPropagation(); moverItem(it, 1); }}
                              title="Avançar status" aria-label="Avançar status"><ChevRight size={13}/></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// NOTAS — anotações rápidas, salvas localmente no navegador
// ────────────────────────────────────────────────────────────────────────────
function NotesView() {
  const [sub, setSub] = useState('todo'); // todo | notas

  // ── To-do list ──
  const [todos, setTodos] = useState(() => {
    try { const s = localStorage.getItem('villares_planner_todos'); if (s) { const p = JSON.parse(s); if (Array.isArray(p)) return p; } } catch {}
    return [];
  });
  const [todoInput, setTodoInput] = useState('');
  useEffect(() => { try { localStorage.setItem('villares_planner_todos', JSON.stringify(todos)); } catch {} }, [todos]);

  // status: 'afazer' | 'andamento' | 'feito' (compat: t.feito antigo → feito)
  const todoStatus = (t) => t.status || (t.feito ? 'feito' : 'afazer');

  const addTodo = () => {
    const t = todoInput.trim(); if (!t) return;
    setTodos(prev => [{ id: 'T-' + Date.now().toString(36), texto: t, status: 'afazer', criadoEm: D.localISO() }, ...prev]);
    setTodoInput(''); sfx.add();
  };
  const setTodoSt = (id, st) => setTodos(prev => prev.map(t => {
    if (t.id !== id) return t;
    if (st === 'feito') sfx.complete(); else if (st === 'andamento') sfx.add(); else sfx.tick();
    const { feito, ...rest } = t;
    return { ...rest, status: st };
  }));
  // Avança no ciclo: afazer → andamento → feito → afazer
  const cycleTodo = (id) => {
    const t = todos.find(x => x.id === id); if (!t) return;
    const cur = todoStatus(t);
    setTodoSt(id, cur === 'afazer' ? 'andamento' : cur === 'andamento' ? 'feito' : 'afazer');
  };
  const delTodo = (id) => { sfx.remove(); setTodos(prev => prev.filter(t => t.id !== id)); };
  const clearDone = () => setTodos(prev => prev.filter(t => todoStatus(t) !== 'feito'));

  const pendentes  = todos.filter(t => todoStatus(t) === 'afazer');
  const andamento  = todos.filter(t => todoStatus(t) === 'andamento');
  const concluidos = todos.filter(t => todoStatus(t) === 'feito');

  // ── Notas ──
  const [notas, setNotas] = useState(() => {
    try { const s = localStorage.getItem('villares_planner_notas'); if (s) { const p = JSON.parse(s); if (Array.isArray(p)) return p; } } catch {}
    return [];
  });
  useEffect(() => { try { localStorage.setItem('villares_planner_notas', JSON.stringify(notas)); } catch {} }, [notas]);

  const criarNota = () => setNotas(prev => [{ id: 'N-' + Date.now().toString(36), titulo: '', texto: '', fixada: false, criadoEm: new Date().toISOString() }, ...prev]);
  const atualizarNota = (id, patch) => setNotas(prev => prev.map(n => n.id === id ? { ...n, ...patch } : n));
  const excluirNota = (nota) => {
    const vazia = !nota.titulo.trim() && !nota.texto.trim();
    if (!vazia && !window.confirm('Excluir esta nota? Esta ação não pode ser desfeita.')) return;
    setNotas(prev => prev.filter(n => n.id !== nota.id));
  };
  const notasOrdenadas = useMemo(() =>
    [...notas].sort((a, b) => (b.fixada ? 1 : 0) - (a.fixada ? 1 : 0) || new Date(b.criadoEm) - new Date(a.criadoEm))
  , [notas]);

  return (
    <>
      <div className="view-head">
        <div className="view-head__title">Anotações</div>
        <div className="cal-modes">
          <button className={`cal-mode ${sub === 'todo' ? 'cal-mode--active' : ''}`} onClick={() => setSub('todo')}>To-do list</button>
          <button className={`cal-mode ${sub === 'notas' ? 'cal-mode--active' : ''}`} onClick={() => setSub('notas')}>Notas</button>
        </div>
      </div>

      {sub === 'todo' ? (
        <div className="todo2 fade-up">
          {/* Cabeçalho com progresso */}
          <div className="todo2__progress">
            <div className="todo2__progress-info">
              <span className="todo2__progress-pct">{todos.length === 0 ? 0 : Math.round(((concluidos.length + andamento.length * 0.5) / todos.length) * 100)}%</span>
              <span className="todo2__progress-label">
                {concluidos.length} concluídas · {andamento.length} em curso · {pendentes.length} a fazer
              </span>
            </div>
            <div className="todo2__progress-bar">
              <div className="todo2__progress-fill"
                   style={{ width: `${todos.length === 0 ? 0 : ((concluidos.length + andamento.length * 0.5) / todos.length) * 100}%` }}/>
            </div>
          </div>

          {/* Campo de adição em destaque */}
          <div className="todo2__add">
            <span className="todo2__add-icon">+</span>
            <input className="todo2__input" placeholder="O que precisa ser feito?"
                   value={todoInput}
                   onChange={(e) => setTodoInput(e.target.value)}
                   onKeyDown={(e) => { if (e.key === 'Enter') addTodo(); }}/>
            <button className="todo2__add-btn" onClick={addTodo} disabled={!todoInput.trim()}>
              Adicionar
            </button>
          </div>

          {todos.length === 0 ? (
            <div className="todo2__empty">
              <div className="todo2__empty-mark">✓</div>
              <div className="todo2__empty-title">Lista limpa</div>
              <div className="todo2__empty-sub">Adicione tarefas rápidas — ideias e pendências que não precisam de prazo nem categoria.</div>
            </div>
          ) : (
            <div className="todo2__cols">
              {/* A FAZER */}
              <div className="todo2__col">
                <div className="todo2__col-head">
                  <span className="todo2__col-dot"/> A fazer
                  <span className="todo2__col-count">{pendentes.length}</span>
                </div>
                <div className="todo2__list">
                  {pendentes.length === 0 ? (
                    <div className="todo2__col-empty">Vazio</div>
                  ) : pendentes.map(t => (
                    <div key={t.id} className="todo2__card">
                      <button className="todo2__check" onClick={() => cycleTodo(t.id)} title="Iniciar"/>
                      <span className="todo2__text">{t.texto}</span>
                      <button className="todo2__move" onClick={() => setTodoSt(t.id, 'andamento')} title="Mover para Em andamento">→</button>
                      <button className="todo2__del" onClick={() => delTodo(t.id)} title="Remover">×</button>
                    </div>
                  ))}
                </div>
              </div>

              {/* EM ANDAMENTO */}
              <div className="todo2__col">
                <div className="todo2__col-head todo2__col-head--prog">
                  <span className="todo2__col-dot todo2__col-dot--prog"/> Em andamento
                  <span className="todo2__col-count">{andamento.length}</span>
                </div>
                <div className="todo2__list">
                  {andamento.length === 0 ? (
                    <div className="todo2__col-empty">Nada em curso</div>
                  ) : andamento.map(t => (
                    <div key={t.id} className="todo2__card todo2__card--prog">
                      <button className="todo2__check todo2__check--prog" onClick={() => cycleTodo(t.id)} title="Concluir">◐</button>
                      <span className="todo2__text">{t.texto}</span>
                      <button className="todo2__move" onClick={() => setTodoSt(t.id, 'afazer')} title="Voltar para A fazer">←</button>
                      <button className="todo2__del" onClick={() => delTodo(t.id)} title="Remover">×</button>
                    </div>
                  ))}
                </div>
              </div>

              {/* CONCLUÍDO */}
              <div className="todo2__col">
                <div className="todo2__col-head todo2__col-head--done">
                  <span className="todo2__col-dot todo2__col-dot--done"/> Concluído
                  <span className="todo2__col-count">{concluidos.length}</span>
                  {concluidos.length > 0 && (
                    <button className="todo2__clear" onClick={clearDone} title="Limpar concluídos">Limpar</button>
                  )}
                </div>
                <div className="todo2__list">
                  {concluidos.length === 0 ? (
                    <div className="todo2__col-empty">Nada concluído</div>
                  ) : concluidos.map(t => (
                    <div key={t.id} className="todo2__card todo2__card--done">
                      <button className="todo2__check todo2__check--on" onClick={() => setTodoSt(t.id, 'afazer')} title="Reabrir">✓</button>
                      <span className="todo2__text">{t.texto}</span>
                      <button className="todo2__del" onClick={() => delTodo(t.id)} title="Remover">×</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      ) : (
        <>
          <div className="notes-toolbar">
            <button className="topbar__cta" onClick={criarNota}><Plus size={14}/> Nova nota</button>
          </div>
          {notasOrdenadas.length === 0 ? (
            <div className="empty-view fade-up">
              Nenhuma nota ainda. Clique em "Nova nota" para registrar lembretes,<br/>
              ideias e pendências que não precisam virar um item do Planner.
            </div>
          ) : (
            <div className="notes-grid">
              {notasOrdenadas.map(n => (
                <div key={n.id} className={`note fade-up ${n.fixada ? 'note--pinned' : ''}`}>
                  <div className="note__bar">
                    <span className="note__date">
                      {new Date(n.criadoEm).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')}
                    </span>
                    <button className={`note__btn ${n.fixada ? 'note__btn--on' : ''}`}
                            title={n.fixada ? 'Desafixar' : 'Fixar no topo'}
                            onClick={() => atualizarNota(n.id, { fixada: !n.fixada })}>
                      <Pin size={13}/>
                    </button>
                    <button className="note__btn note__btn--danger" title="Excluir nota" onClick={() => excluirNota(n)}>
                      <Trash size={13}/>
                    </button>
                  </div>
                  <input className="note__title" placeholder="Título" value={n.titulo}
                         onChange={(e) => atualizarNota(n.id, { titulo: e.target.value })}/>
                  <textarea className="note__text" placeholder="Escreva sua nota..." value={n.texto}
                            onChange={(e) => atualizarNota(n.id, { texto: e.target.value })}/>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </>
  );
}
